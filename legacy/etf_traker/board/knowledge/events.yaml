# 이벤트 캘린더 — 사람이 채운다.
#
# 레퍼런스 코멘트의 마지막 두 섹션(현대차 인베스터데이 리뷰, 엔비디아 실적 프리뷰)이
# 여기서 나온다. 이건 자동화 대상이 아니다. 무엇이 중요한 이벤트인지 고르는 건
# 사람의 판단이고, 그 판단이 이 리포트의 값어치다.
#
# writer 는 여기 적힌 사실만 서술한다. 여기 없는 이벤트는 리포트에 등장하지 않는다.
# 여기 적지 않은 수치를 LLM 이 지어내면 writer/verify.py 가 잡아낸다.
#
# date        이벤트 당일 (YYYY-MM-DD). 이 날짜의 리포트에서 '리뷰'로 다뤄진다
# preview_from 며칠 전부터 '프리뷰'로 다룰지 (기본 1)
# tickers     이 이벤트에 반응할 종목코드 또는 종목명. 등락률이 자동으로 붙는다
# themes      themes.yaml 의 테마 id
# facts       발표된 사실. 수치는 문자열 그대로 쓴다 (반올림하지 않는다)
# quotes      직접 인용. 발언자와 원문
# question    프리뷰에 적을 관전 포인트. 익일 리뷰에서 이 질문의 답을 적는다

events: []

