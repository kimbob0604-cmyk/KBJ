# 1층 섹터 분류 (세분류)
#
# 사용자가 쓰던 엑셀의 섹터 열에서 그대로 옮긴 48개다. GICS 산업그룹의 한국어
# 표기에 가깝다. KRX 업종분류(14개)로는 이 해상도가 안 나온다 —
# '비철금속'과 '철강'이 KRX 에서는 둘 다 '철강금속' 하나다.
#
# CLAUDE.md 5장은 "에프앤가이드·WICS 섹터분류는 사용하지 않는다(사용 불가로 확정)"
# 라고 못박았다. 그 분류를 **받아오지** 않는다는 뜻으로 유지하고, 같은 해상도의
# 자체 분류를 DART 사업의 내용 기반 배치 분류로 직접 만든다. 5장이 2층 테마에 대해
# 예정한 방식과 같다. 근거는 DECISIONS.md D-014.
#
# 종목별 배정 결과는 knowledge/sector_map.yaml 에 쌓인다. 그 파일은 사람이 고칠 수
# 있고, 손으로 고친 항목은 재분류가 덮어쓰지 않는다.

meta:
  version: "0.1"
  taxonomy: "board48"
  cardinality: "1:1 — 전 종목이 정확히 하나씩. 커버리지 보장용"
  source: "사용자 기존 엑셀의 섹터 열"
  unmapped: "미분류"

# krx_hint 는 배치 분류의 사전 필터다. KRX 업종이 여기 없으면 그 섹터 후보에서 뺀다.
# 분류기가 '보험' 종목을 '반도체'로 보내는 사고를 값싸게 막는다.
sectors:
  # 반도체는 하나로 묶으면 해상도가 안 나온다(사용자 요청, D-061). 밸류체인
  # 위치가 다르면 주가 동인이 다르다 — 장비는 캐펙스, 소재는 가동률, 설계는
  # 라이선스·수주. desc 는 분류기 프롬프트에 이름과 함께 들어간다.
  - {name: 반도체제조,                 krx_hint: [전기전자],
     desc: IDM·파운드리 — 웨이퍼를 직접 가공해 칩을 만드는 회사}
  - {name: 반도체장비,                 krx_hint: [전기전자, 기계],
     desc: 전공정 장비(증착·식각·세정·노광 주변)와 그 부분품·개조}
  - {name: 반도체후공정,               krx_hint: [전기전자, 기계, 서비스업],
     desc: OSAT·패키징·테스트 서비스와 후공정 장비·소켓·프로브카드}
  - {name: 반도체소재부품,             krx_hint: [전기전자, 화학],
     desc: 웨이퍼·특수가스·케미컬·타깃·쿼츠·파츠 등 소모성 소재와 부품}
  - {name: 반도체설계,                 krx_hint: [전기전자, 서비스업],
     desc: 팹리스·IP·디자인하우스 — 공장 없이 설계·판매}
  - {name: 디스플레이패널,             krx_hint: [전기전자]}
  - {name: 디스플레이장비,             krx_hint: [전기전자, 기계]}
  - {name: 전자제품,                  krx_hint: [전기전자]}
  - {name: "전자장비,사무용전자제품",    krx_hint: [전기전자]}
  - {name: 전기제품,                  krx_hint: [전기전자]}
  - {name: 전기장비,                  krx_hint: [전기전자, 기계]}
  - {name: 통신장비,                  krx_hint: [전기전자]}
  - {name: 핸드셋,                    krx_hint: [전기전자]}
  - {name: 컴퓨터,                    krx_hint: [전기전자, 서비스업]}

  - {name: 소프트웨어,                 krx_hint: [서비스업]}
  - {name: 게임소프트웨어,              krx_hint: [서비스업]}
  - {name: 미디어,                    krx_hint: [서비스업]}
  - {name: 통신서비스,                 krx_hint: [통신업]}
  - {name: 교육,                      krx_hint: [서비스업]}

  - {name: 제약,                      krx_hint: [의약품]}
  - {name: 생명과학,                   krx_hint: [의약품, 서비스업]}
  - {name: "건강관리장비,서비스",        krx_hint: [의료정밀, 의약품, 서비스업]}

  - {name: 화학,                      krx_hint: [화학]}
  - {name: 화장품,                    krx_hint: [화학, 유통업]}
  - {name: 에너지,                    krx_hint: [화학, 전기가스업]}
  - {name: 철강,                      krx_hint: [철강금속]}
  - {name: 비철금속,                   krx_hint: [철강금속]}
  - {name: "포장재,종이와목재",          krx_hint: [종이목재, 화학]}
  - {name: "건설,건축제품,건축자재",      krx_hint: [건설업, 비금속광물]}

