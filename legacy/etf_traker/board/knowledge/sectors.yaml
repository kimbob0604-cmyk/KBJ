  - {name: 조선,                      krx_hint: [운수장비]}
  - {name: 자동차,                    krx_hint: [운수장비]}
  - {name: 자동차부품,                 krx_hint: [운수장비]}
  - {name: 운송,                      krx_hint: [운수창고]}
  - {name: 기타자본재,                 krx_hint: [기계, 운수장비, 전기전자]}
  - {name: 복합기업,                   krx_hint: [기타]}

  - {name: "식품,음료",                krx_hint: [음식료품]}
  - {name: 담배,                      krx_hint: [음식료품]}
  - {name: 필수가정용품,               krx_hint: [화학, 음식료품]}
  - {name: "문구,가정용품",             krx_hint: [화학, 종이목재, 유통업]}
  - {name: 가구,                      krx_hint: [종이목재, 유통업]}
  - {name: 의류,                      krx_hint: [섬유의복]}
