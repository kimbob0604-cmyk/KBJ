  - {name: "호텔,레저서비스",           krx_hint: [서비스업]}

  - {name: 백화점,                    krx_hint: [유통업]}
  - {name: 기타유통,                  krx_hint: [유통업]}
  - {name: 상사,                      krx_hint: [유통업]}

  - {name: 은행,                      krx_hint: [금융업, 은행]}
  - {name: 증권,                      krx_hint: [금융업, 증권]}
