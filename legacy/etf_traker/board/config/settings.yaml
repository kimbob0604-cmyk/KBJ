# 임계값 한 곳 모음. 코드에 숫자를 박지 않는다.
# 값을 바꿀 때는 docs/DECISIONS.md 에 근거를 남긴다.

meta:
  version: "0.1"
  timezone: "Asia/Seoul"

# ── 신고가 판정 ────────────────────────────────────────────
newhigh:
  # CLAUDE.md 4장 고정 정의. 직전 N영업일(당일 제외) 최고가를 당일 갱신.
  # 남은 것은 셋뿐이다 — d60 · w52 · hist.
  # d120 은 D-010 으로 넣었다가 뺐고(D-060), d20 은 사용자 요청으로 뺐다(D-071).
  # 둘 다 이유가 같다: 표에서 자리만 차지하고 판단에 쓰이지 않았다.
  lookback:
    d60: 60
    w52: 252
  labels:
    hist: 역사적
    w52: 52주
    d60: 60일
  # 라벨 우선순위. 상위가 하위를 포함한다. 앞이 상위.
  priority: [hist, w52, d60]
  # 표에서 '달성'으로 볼 최소 등급. 이보다 하위 라벨만 가진 종목은 표에 넣지 않는다.
  # 지금은 최하위가 d60 이라 계산한 셋이 모두 표에 오른다.
  min_display_kind: d60
  # 리포트 기본 기준. high = 장중 고가, close = 종가. 둘 다 계산해 별도로 저장한다.
  #
  # **종가 기준이다.** 고가 기준은 장중에 잠깐 뚫고 종가는 전일보다 낮게 끝난
  # 날도 신고가로 잡는다. 그러면 '일간 수익률은 마이너스인데 52주 신고가' 가
  # 되어 표를 읽는 사람이 매번 멈춘다. 종가 기준은 그런 날이 아예 없다 —
  # 오늘 종가 > 과거 종가 최고 ≥ 어제 종가이므로 등락률이 반드시 플러스다.
  # 고가 기준 라벨도 계속 계산해 같은 줄에 담고, 화면 토글로 볼 수 있다.
  default_basis: close

# ── 근접 ──────────────────────────────────────────────────
# 인베스팅닷컴 52주 신고가 근접 스크리너 기본값에 맞춘다 (CLAUDE.md 10장).
proximity:
  max_gap_pct: 5.0        # 갭 5% 이내
  # 인베스팅닷컴 기본값은 200억이지만(CLAUDE.md 10장) 보드 하한을 1,000억으로
  # 올리면서 함께 올렸다(D-072). 여기가 200 이면 근접 판정은 200억으로 해 놓고
  # 표에서 1,000억으로 다시 걸러, 화면 머리말의 '시총 200억 이상'이 거짓이 된다.
  min_mktcap_eok: 1000.0
  narrow_days: 5          # 5일 축소폭의 기준 영업일 수

# ── 파생 지표 ─────────────────────────────────────────────
volume:
  avg_days: 20            # 거래량 배수·저항두께의 분모가 되는 평균 거래일 수
resistance:
  # 저항두께 = 현재가~기준최고가 구간 누적 거래량 / 20일 평균 거래량.
  # 아래 경계는 표기용 라벨일 뿐이고 원 수치를 항상 함께 출력한다.
  thin_below: 3.0
  thick_above: 8.0
giveback:
  ratio: 0.70             # (고가-종가)/(고가-전일종가) >= 0.70 이면 재료 반납
  max_chg_pct: 3.0        # 그리고 당일 등락률이 이 값 미만일 때만 이벤트로 본다
  # 반납 폭이 이보다 작으면 이벤트로 올리지 않는다. 비율 조건만 두면 장중에 +0.5%
  # 갔다가 -0.1% 로 끝난 종목까지 '재료 반납'으로 잡혀 리포트가 노이즈로 찬다.
  # 판정 정의(비율)는 그대로 두고 이벤트 승격 문턱만 두는 것이다. DECISIONS.md D-009.
  min_pp: 3.0

# ── 테마 (2층) ────────────────────────────────────────────
themes:
  # themes.yaml 의 seeds 는 사용자가 직접 적은 것이라 신뢰도를 높게 준다.
  # DART 사업의 내용 기반 배치 분류가 붙으면 그쪽은 모델 점수를 그대로 쓴다.
  seed_confidence: 0.9
  # CLAUDE.md 2장 5번 — 이 미만은 서술 프롬프트에 넣지 않는다.
  min_confidence_for_narration: 0.7
  unmapped_bucket: "미분류"

# ── 화면 필터 ─────────────────────────────────────────────
display:
  # 보드에 올릴 최소 시가총액. **화면 토글이 아니라 생성 단계에서 건다** —
  # 신고가 달성·근접 목록을 만들 때 이 미만은 아예 담지 않는다. 시총 몇백억짜리가
  # 표를 채우면 '오늘 무슨 일이 있었나' 를 읽을 수 없다는 사용자 판단이다(D-072).
  # 시총을 **모르는** 종목도 빠지지만, 하한 미달과 따로 세어 배너에 다르게 적는다.
  min_mktcap_eok: 1000.0
  # 신고가 표의 '거래대금 N억↑' 토글이 쓰는 값. **기본은 꺼짐** — 눌러야 걸린다.
  # 화면이 이 값을 그대로 읽어 알약 문구와 판정에 함께 쓴다(D-074). 예전에는
  # board.js 에 50 이 박혀 있고 여기 5.0 이 따로 있어, 이 줄을 고쳐도 화면이
  # 꿈쩍하지 않았다 (CLAUDE.md 3장 — 코드에 숫자를 박지 않는다).
  min_turnover_eok: 50.0
  max_rows_achieved: 200
  max_rows_proximity: 80
  heatmap_groups: 12
  heatmap_cells: 12

# ── 데이터 건전성 ─────────────────────────────────────────
integrity:
  # 수정주가 미반영 시계열을 걸러내는 가드. 국내 가격제한폭은 +-30%.
  # 하루 사이 이 비율을 넘는 종가 변화는 액면분할·무상증자·병합으로 본다.
  split_guard_ratio: 0.31
  # 가드에 걸린 종목은 역사적 신고가 판정에서 제외하고 그 사실을 리포트에 노출한다.
  suppress_hist_on_suspect: true
  # 상장 후 이 영업일 수를 못 채운 종목은 해당 라벨을 계산하지 않는다.
  min_history_days:
    hist: 60

# ── 탐지기 임계값 ──────────────────────────────────────────
# CLAUDE.md 3장 — 코드에 숫자를 박지 않는다.
detect:
  volume_anomaly_mult: 5.0    # 탐지기 4. 거래량 배수 이 값 이상
  # 탐지기 6. 60일·252일·역사적 중 몇 종 이상.
  #
  # **라벨은 중첩이다** — 52주를 뚫으면 60일도 자동으로 뚫린다. 그래서 이 값은
  # '몇 종'이 아니라 '어느 등급 이상'을 고르는 손잡이다. 라벨을 하나 빼면 같은
  # 숫자가 다른 등급을 가리킨다.
  #
  #   20일이 있던 시절(4라벨) 3 = 52주 이상   ← 원래 동작
  #   20일을 뺀 뒤(3라벨)   3 = 역사적만      ← D-071 이 조용히 바꿔 놓은 것
  #                          2 = 52주 이상    ← 원래 동작으로 되돌린 값
  #
  # 그래서 2 다(D-073). 3 으로 두면 이 탐지기는 '역사적 신고가'와 같은 것을 센다.
  multi_label_min: 2
  proximity_cluster_min: 3    # 탐지기 9. 한 테마에서 근접 종목 몇 개 이상

# ── 랭킹 표 ───────────────────────────────────────────────
rankings:
  # 엑셀 색 방향. 첨부해 주신 국장 시트는 녹색=상승, 미국장 시트는 적색=상승이고,
  # 웹 대시보드는 국내 관례(CLAUDE.md 10장)대로 적색=상승이다. 셋이 어긋나 있어
  # 한 곳에서 고르게 뺐다. 'green_up' 이 국장 시트 재현, 'red_up' 이 대시보드와 일치.
  excel_scale: green_up
  # 유동성 하한. 없으면 시총 50억짜리가 상승률 상위를 독식해 표가 쓸모없어진다.
  # 신고가 보드와 같은 1,000억으로 맞췄다(D-072) — 한 화면에서 표마다 하한이
  # 다르면 같은 종목이 어떤 표에는 있고 어떤 표에는 없는 이유를 설명할 수 없다.
  min_mktcap_eok: 1000.0
  min_turnover_eok: 1.0
  # 섹터 순위에 남길 최소 구성종목 수. 3종목짜리 섹터의 시총가중 등락률은
  # 48종목짜리와 같은 표에 못 놓는다 — 한 종목이 순위를 통째로 만든다.
  # 1 로 두면 전부 표시한다. 빠진 섹터는 '빠진 데이터'에 이름과 수로 남는다.
  min_sector_members: 5
  top_per_sector: 5       # 각 섹터 1~5등
  rows_per_board: 30      # 종목 표 행 수

# ── 섹터 뉴스 ─────────────────────────────────────────────
news:
  # 뉴스를 붙일 테마 수. 네이버 검색 API 무료 한도는 일 25,000회라 호출 자체는
  # 여유가 크지만, 테마를 늘리면 아무도 안 읽는 카드만 늘어난다.
  # 오늘 실제로 움직인 것에만 붙인다.
  max_themes: 8
  # 테마당 질의 수 = 1(테마명) + 이 값(대표 종목명). 종목명을 섞어야
  # 테마명으로는 안 걸리는 개별 재료가 잡힌다.
  stocks_per_theme: 3
  max_articles: 6         # 테마당 남길 기사 수
  per_query: 20           # 검색 한 번에 받아올 기사 수
  # 이 등락률(절대값)에 못 미치고 신고가도 없으면 뉴스를 안 붙인다.
  # 안 움직인 테마의 기사는 그날의 트리거가 아니다.
  min_abs_chg_pct: 2.0

# ── 서술 생성 (writer) ────────────────────────────────
writer:
  # CLAUDE.md 7장 모델 배분. 바꾸려면 DECISIONS.md 에 근거를 남긴다.
  models:
    narrate: claude-sonnet-5              # 섹터 서술·장마감 총평 (실시간)
    cluster: claude-haiku-4-5             # 뉴스 클러스터링·테마 매칭 (Batch API)
    bootstrap: claude-haiku-4-5           # 종목 부트스트랩 분류 (Batch API, 1회성)
  # 사고 깊이. low/medium/high/xhigh/max. 서술은 사실을 잇는 작업이라 높일 이유가 적다.
  effort: medium
  # 위 effort 를 받지 않는 모델. **실측으로만 채운다** — 이름 규칙으로 짐작하지
  # 않는다(CLAUDE.md 2장 4번). 여기 없는 모델이 400 으로 거절하면 writer/claude.py
  # 가 그 호출에서 effort 를 빼고 다시 부르며 사유를 남긴다.
  #
  # 2026-09-22 실측: 다이제스트 ① 배정(cluster 모델)이
  #   400 invalid_request_error — This model does not support the effort parameter.
  #   (request_id req_011CfHqvwCaBQmdNioFkvm1v)
  # 로 죽어 그날 다이제스트가 분석 없이 결손만 싣고 나갔다.
  no_effort_models:
    - claude-haiku-4-5
  # 응답 상한. 잘리면 문장 중간에서 끝난 서술이 리포트에 실린다. 넉넉히 잡는다.
  max_tokens: 16000
  parallel: 4                             # 섹터별 병렬 호출 수
  # 검증 실패 시 재시도 횟수. 초과하면 그 섹션을 빼고 사유를 남긴다.
  retries: 2
  # 수치 검증을 끌 수 있게 두되 기본은 켬. 끄면 CLAUDE.md 2장 4번을 어기는 것이다.
  strict_numbers: true

# ── 재무 툴팁 (DART 주요계정) ─────────────────────────────
# 히트맵 종목 칸에 마우스를 올리면 시총·매출·영업이익을 억원으로 보여 준다 (D-075).
# 소스는 DART OpenAPI fnlttMultiAcnt(다중회사 주요계정, 회사 100개 묶음). 히트맵에
# 오르는 200종목 안팎이면 하루 20회 남짓이라 일 한도(20,000)와 무관하다.
financials:
  annual_years: 3        # 툴팁에 실을 연간 개수 (최근 사업보고서 기준)
  quarters: 4            # 툴팁에 실을 분기 개수 (누적→분기 차분)
  stale_days: 7          # 캐시가 이보다 오래되면 다시 받는다 (분기보고서 갱신 주기 대응)
  batch_size: 100        # fnlttMultiAcnt 한 번에 넣는 회사 수 (API 상한 100)
  pause_sec: 0.3         # 호출 사이 지연 — 분당 한도 보호 (병렬일 때는 미사용)
  workers: 3             # 동시 호출 수. 한 번에 75초 남짓 걸려 순서대로면 배치당 10분
  fs_div: CFS            # 연결(CFS) 우선, 없으면 별도(OFS)

# ── 종목별 트리거(재료) ────────────────────────────────────
# 52주 이상 신고가 종목마다 당일 기사·공시·X 포워딩을 붙인다 (D-085).
# 소스 우선순위는 코드가 고정한다 — dart > telegram_x > naver_news > google_news.
triggers:
  kind: w52                 # 대상 등급. stockflows.targets 와 같은 집합이어야 한다
  per_stock_items: 3        # 종목당 남길 재료 수(소스 우선순위 순)
  # 네이버 질의 틀. '{name} 주가' 는 자동 생성 시세 기사가 맨 위로 온다 — 쓰지 않는다.
  naver_queries: ['{name} {code}', '{name} 신고가']
  naver_display: 20         # 질의 한 번에 받는 건수 (= '상위 N건 기준')
  # 기준일이 오늘이 아니면 네이버를 아예 건너뛴다 (아래 실측).
  naver_skip_when_past: true
  gnews_queries: ['{name}'] # Google News 는 제목에 이름이 있어야 채택하므로 이름만
  # 시간 예산. 전체 데드라인과 소스별 상한(초). 넘긴 소스는 접고 사유를 남긴다.
  budget_sec: 240
  per_source_sec:
    naver_news: 90
    google_news: 60
    dart: 60
    telegram_x: 20
  timeout_sec: 8            # 호출 한 번의 대기 상한
  retries: 1                # 재시도 횟수 (시도는 retries + 1 회)
  inbox_hours: 24           # X 포워딩 인박스에서 볼 시간 창
  # 인박스는 사용자가 X 게시물을 봇에 손으로 공유해야 채워진다. 그러지 않기로
  # 정해서(2026-09-22, XDIGEST.md 8장 11번) 꺼 둔다. 켜 두면 고칠 수도 없고 고칠
  # 생각도 없는 '인박스 없음' 이 배너에 매일 붙어 배너 전체를 안 읽게 된다.
  # 수집기(ingest/tg_inbox.py)와 붙이는 경로는 그대로 있다 — true 면 돌아온다.
  inbox_enabled: false
  title_chars_tg: 60        # 텔레그램 재료 줄의 제목 글자 수
  # 종목명 뒤에 붙어도 이름의 일부가 아닌 조사. 이 뒤 글자가 또 한글·영문·숫자면 불일치.
  name_particles: [가, 는, 은, 이, 도, 의, 를, 을, 와, 과, 로, 에]
  # 3자 이하·일반명사 이름은 제목에 이름이 있고 (요약에 아래 주식어 or 매체가 금융지)
  # 일 때만 채택한다. '대상' 하나로는 기사가 종목 얘기인지 알 수 없다.
  generic_names: [케이씨, 비엠티, 레이언스, 지어소프트, 대상, 한국, 동양, 삼양, 남양,
                  대한, 세아, 대성, 동부, 삼성, 현대, 한화, 한솔, 영원, 신성, 서울, 부산]
  stock_words: [주가, 신고가, 상한가, 급등, 강세, 주식, 종목, 코스피, 코스닥, 시총,
                공시, 수주, 계약, 실적, 영업이익, 매출, 투자, 인수, 특허, 임상, 상장,
                거래량, 매수, 증권, 목표주가]
  # 자동 생성 시세·수급 기사. 제목이 이 패턴이면 채택 전에 뺀다.
  #
  # 왜 빼는가 — 이 기사들은 '왜 올랐는지' 가 아니라 '올랐다' 를 다시 쓴 것이다.
  # 등락률·거래량·순매수는 보드가 이미 같은 줄에 적는다. 재료 자리에 이게 앉으면
  # 읽는 쪽은 트리거가 있다고 읽는데 실은 같은 수치를 두 번 보는 것이다.
  #
  # 아래 패턴은 2026-09-22 러너 실측 제목에서 뽑았다 (D-085 실측표).
  #   [장중수급포착] 케이씨, 외국인/기관 동시 순매수… 주가 +7.26%
  #   가온전선 주가 8,500원 하락 후 마감
  #   대한전선·가온전선·세방전지 동반 약세…전기·전선 관련주 장중 흐름은
  #   케이씨 주가, 9월 21일 애프터마켓 44,400원 7.51% 상승
  # 이유가 붙은 제목은 남긴다 — '특징주, …-HBM 테마 상승세에 6.19% ↑' 는 남는다.
  autogen_title_patterns:
    - '^\s*\[장중수급포착\]'
    - '주가,?\s*\d{1,2}월\s*\d{1,2}일'
    - '장중\s*[\d,]+원'
    - '장중\s*(흐름|추이|동향)'
    - '주가\s*[+\-][\d.]+%'
    - '주가\s*[\d,]+원\s*(상승|하락|보합)'
    - '[\d,]+원\s*[\d.]+%\s*(상승|하락)'
    - '\d+\.\d+%\s*(상승|하락)…'
  domain_blacklist: [topstarnews.net, joongangenews.com, job-post.co.kr]
  # 도메인 → 표시명. 네이버 검색 API 는 매체명을 주지 않아 originallink 도메인이 매체다.
  # 여기 없으면 도메인을 그대로 적는다. finance_outlets 는 '금융지' 판정에도 쓴다.
