# X 24시간 다이제스트 — 수집 설정. 계약은 docs/XDIGEST.md.
# 임계값은 코드가 아니라 여기에만 있다(CLAUDE.md 3장). 값을 바꿀 때는
# DECISIONS.md 에 근거를 남긴다.
#
# settings.yaml 에 얹지 않는 이유: 이 경로는 board.yml 이 아니라 별도
# 워크플로(xdigest.yml)가 돌리고 DB·state 캐시를 복원하지 않는다(XDIGEST.md
# 4장). 한 파일에 섞으면 다이제스트 값 하나를 고칠 때마다 보드 전체 설정을
# 건드리게 되고, 보드 쪽 --test 게이트가 이 경로의 변경을 막는다.
#
# 여기 있는 것은 **수집(3-1)** 몫이다. 분석·렌더·발송 몫은 같은 파일에
# 자기 절로 더한다.

# ── 질의 ──────────────────────────────────────────────────
# 블루스카이는 계정 목록이 아니라 **키워드**로 받는다. 예시(9장) 12계정 중 10개가
# 블루스카이에 없고 있는 둘도 팔로워 0·35 라(XDIGEST.md 2장) 계정별 수집이
# 성립하지 않는다.
#
# 2026-09-22 러너 실측 24시간 물량(중복 포함, 합 363건) —
#   semiconductor 99 · foundry 94 · DRAM 64 · TSMC 33 ·
#   AI datacenter 29 · SK hynix 24 · HBM 20
# 거의 영어다. 우리말 질의는 재 보지 않았다.
#
# 넷만 쓴다. 일곱을 다 쓰면 호출이 하루 7회가 되고 질의 사이 2초를 지키면 대기만
# 12초다(사이 6개). 물량이 서로 겹치는 만큼 새로 얻는 것 없이 한도만 깎는다.
#
# 고른 근거: semiconductor · DRAM · TSMC 는 물량 상위 셋이다. HBM 은 물량이
# 20건으로 가장 적지만 예시의 `■ 공통 테마` 첫 소주제와 삼성 HBM4 증산 항목이
# 이 말로 걸리는 것들이라 넣었다 — 물량 순으로만 고르면 다이제스트의 중심
# 주제가 빠진다. **물량 2위인 foundry 를 뺀 자리다**(호출 넷 상한).
queries: [HBM, semiconductor, DRAM, TSMC]

# ── 별도 구획 (D-NEXT-Q) ─────────────────────────────────
# 2026-09-23 사용자 요청 — "AI 최신 뉴스와 퀀트·백테스트가 빠져 있다". 위
# `queries` 는 기본 구획(반도체·AI 인프라)이고, 여기 구획은 **따로 받고 따로
# 적는다.** 텔레그램에는 `■ 투자 인사이트` 뒤에 `■ AI 최신 뉴스` ·
# `■ 퀀트·백테스트` 가 붙고, 머리 2행이 구획마다 건수를 적는다.
#
# 구획을 가르는 것은 **질의**다. 게시물은 처음 잡힌 질의의 구획으로 가고(기본
# 구획 질의가 먼저 돈다), 분석은 구획마다 한 번씩 따로 부른다. 모델에게 구획을
# 가르게 두면 반도체 글이 AI 뉴스로 새도 코드가 되짚을 근거가 없다.
# 광고·잡담·다른 뜻으로 걸린 글은 두 겹으로 거른다 — `keywords` 가 본문에 하나도
# 없으면 모델에 넣지 않고, 모델이 범위(`scope`)에 맞는 게시물 키만 `relevant` 로
# 돌려준다. 걸러진 건수는 themes.json 에 남는다.
#
# **물량을 재지 않았다.** 2026-09-23 작업 컨테이너는 api.bsky.app 에 닿지 않았다
# (프록시가 CONNECT 403). 러너에서 `mode=collect` 한 번이면 posts.json 의
# `sources.bluesky.by_topic`(구획별 창 안 건수)과 로그의 질의별 건수가 남는다.
# 재고 나서 질의를 고친다 — 기본 구획 질의를 실측 363건으로 고른 것과 같은 순서다.
#
# 호출 수: 기본 4 + AI 4 + 퀀트 5 = 하루 13회, 질의 사이 2초면 대기 24초다.
# D-NEXT-Y 에서 연달아 30여 번 부른 날 403 을 받았다 — 13회는 그 절반 아래다.
#
# 키: key(파일에 남는 구획 키) · title(■ 제목) · label(머리 2행 표기) ·
#     scope(모델에게 주는 범위, 매일 같은 문장이라 캐시 접두사에 든다) ·
#     queries · limit(질의당 건수 — 없으면 위 `limit`) · max_items(• 줄 상한) ·
#     max_pool(모델에 넣는 게시물 상한, 최신부터 — 넘으면 결손에 적는다) ·
#     keywords(소문자 부분 문자열. 없으면 거르지 않는다)
sections:
  - key: ai_news
    title: AI 최신 뉴스
    label: AI뉴스
    scope: >-
      AI 모델 출시·업데이트, AI 연구소·기업의 발표와 제품, AI 에이전트, LLM 연구·서비스
      소식. 반도체·데이터센터 하드웨어는 기본 구획 몫이다. AI 에 대한 감상, 찬반 논쟁,
      AI 로 만든 그림 홍보는 소식이 아니다
    # 2026-09-23 러너 실측: 넷 다 최신순 100건이 전부 24시간 안이었다(OpenAI ·
    # Anthropic · LLM · AI agent 100/100). 최신순 50건이면 한두 시간치라 '24시간
    # 다이제스트' 가 아니다. **인기순(top) + 창(since·until)** 으로 창 전체에서
    # 반응이 큰 100건을 받는다 — 같은 날 실측 100/100 창 안. 상위에는 농담·정치
    # 글도 많다(좋아요 상위 셋이 전부 잡담이었다). 그것을 거르는 것은 `scope`
    # 판정이고, 인기순은 하루치를 덮는 풀을 만드는 몫이다.
    sort: top
    limit: 100
    queries: [OpenAI, Anthropic, LLM, AI agent]
    keywords: [openai, anthropic, llm, agent, 에이전트]
    max_items: 8
    # 인기순 400건(4 × 100) 중 키워드를 통과한 것에서 최신 250건을 모델에 넣는다.
    # 150 이면 하루치 풀의 절반 가까이를 버린다. 250건 × 게시물당 ~100토큰이면
    # 호출당 입력 ~2.5만 토큰이다(추정 — 재지 않았다).
    max_pool: 250
  - key: quant
    title: 퀀트·백테스트
    label: 퀀트
    scope: >-
      퀀트 투자, 팩터·알파, 시스템 트레이딩 전략, 백테스트 방법과 결과(워크포워드
      검증·과최적화 포함). 코인 시그널 판매·유료 리딩방·강의 홍보는 광고다. 금융이
      아닌 뜻(양자역학 등)으로 걸린 글은 범위 밖이다
    # 2026-09-23 러너 실측(24시간 안, 최신순 100건 중):
    #   backtest 10 · backtesting 6 · factor model 6 · algorithmic trading 4 ·
    #   quant trading 3 · quantitative finance 3 · systematic trading 2 ·
    #   퀀트 0 · factor investing 0 · 백테스트 (한도에 막혀 못 잼)
    #   quant(lang=en) 41 — 대부분 arXiv quant-ph(양자물리) 봇과 무관 글이라 뺐다.
    #   lang 없이 quant 는 99건 중 34건이 프랑스어('quant à')였다.
    # 블루스카이에서 이 주제는 **물량이 얇다** — 합쳐 하루 30건 안팎이다. 질의당
    # 100건이면 창 안을 다 받는다. 걸리는 글은 Quantocracy·Quantpedia 같은 퀀트
    # 블로그 소식, 백테스트 방법론 글이다. 0건 날은 '해당 없음' 한 줄로 나간다.
    limit: 100
    queries: [backtest, backtesting, factor model, algorithmic trading, quant trading]
    keywords: [quant, 퀀트, backtest, 백테스트, factor, 팩터, algorithmic, systematic]
    max_items: 8
    max_pool: 150

# `--check` 의 프로브가 누르는 질의 하나. 위 목록의 첫 항목(HBM)을 쓰지 않는
# 이유는 물량이다 — 실측 24시간 20건이면 평균 72분에 1건이라, 새벽에 눌러
# 마지막 게시물이 25시간 전이면 경로가 멀쩡한데도 '24시간 안 0건' 이 된다.
# 물량 1위(semiconductor 99건)로 누른다. 판정은 200 JSON 을 받았는가 하나이고
# 건수는 note 에만 적는다 — 없는 것과 막힌 것을 섞지 않는다.
probe_query: semiconductor

# 질의당 받을 상위 건수. searchPosts 의 limit 상한이 100 이다. 실측에서 한
# 질의의 24시간 물량이 최대 99건이었으므로 100 이면 그 질의는 대체로 다 받는다.
# 못 받는 구간이 있다는 사실은 coverage.gaps 에 한 줄로 남는다.
limit: 100

# latest = 최신순. top(인기순)으로 받으면 24시간 창 밖의 오래된 인기 게시물이
# 앞에 와서 limit 100 이 창 안을 못 덮는다. 구획이 `sort: top` 을 쓰면 수집기가
# 창을 since·until 로 함께 줘서 그 문제가 없다(bsky.collect).
sort: latest

# ── 창 ───────────────────────────────────────────────────
# 창의 끝(KST). 발송 예정은 08:00 이고 분석·검증·렌더에 5~7분이 든다
# (XDIGEST.md 4장). 07:45 dispatch 시각을 창의 끝으로 고정한다 — 수집이 끝난
# 시각을 끝으로 쓰면 실행이 늦은 날의 창이 조용히 길어진다.
#
# 2026-09-23 09:00 → 08:00 으로 당겼다(사용자 요청). 창의 끝도 같이 한 시간 당겨
# '발송 15분 전' 을 지킨다. 바꿀 때는 send_at 과 이 값, 그리고 외부 스케줄러의
# dispatch 시각(GITHUB.md 5-2)을 **함께** 옮긴다 — 셋이 어긋나면 창과 제목 시각이
# 다른 날을 가리킨다.
window_end_hm: "07:45"
# 1행 제목에 찍히는 예정 발송 시각이자, 이보다 늦게 나가면 '(실제 발송 HH:MM)'
# 을 붙이는 임계(XDIGEST.md 1장).
send_at: "08:00"
# 창의 길이(시간). '24시간 다이제스트' 의 24 다.
window_hours: 24

# ── 호출 예의·한도 ────────────────────────────────────────
# 질의 **사이** 대기(초). 남의 공개 서버이고 키가 없어 한도를 살 수도 없다.
# 429 를 한 번 받으면 그 질의 몫이 통째로 빈다 — 2초는 그것을 사는 값이다.
per_call_sleep_sec: 3
# 막힌(403·429) 질의 앞에서 쉬는 시간(초)과 한 실행에서 쉬는 횟수 상한.
# 2026-09-23 미리보기에서 질의 13개 중 뒤 7개가 줄줄이 403 이었다(그날 실측·
# 프로브로 이미 50번 가까이 부른 뒤다). 막히면 곧바로 다음 질의를 눌러 봐야 같은
# 답이라, 쉬고 **같은 질의를 한 번 더** 누른다. 최악 45초 × 3 = 135초가 더 든다 —
# 07:45 수집 시작이면 08:00 발송 안이다. 질의 사이도 2 → 3초로 벌렸다.
block_cooldown_sec: 45
block_cooldowns: 3
# 한 요청 대기 상한(초). 08:00 발송이라 수집 단계에 쓸 수 있는 시간이 1분
# 남짓이다(4장). 정상이면 질의 넷 × 1회라 대기가 거의 없다. 최악은 넷 × 호스트
# 둘 × 시도 둘 × 10초 + 질의 사이 2초 × 3 = 166초로 예산을 넘긴다 — 그런 날은
# 받은 것이 0 이고 사유가 남아 워크플로가 실패로 읽으므로, 짧게 잡아 사유를 못
# 받는 쪽보다 낫다고 봤다. timeout-minutes 20 안에도 든다.
# 별도 구획(D-NEXT-Q)으로 질의가 13개가 되어 정상 경로는 대기 24초 + 요청 13회,
# 최악은 13 × 2 × 2 × 10 + 24 = 544초다. 최악의 날은 08:00 을 넘겨 나가고 1행에
# '(실제 발송 …)' 이 붙는다 — 여전히 timeout-minutes 20 안이다.
timeout_sec: 10
# 재시도 횟수(시도 = 1 + 이 값). 전송 오류·기타 비200 에만 쓴다.
# 403/429/503 은 재시도하지 않고 다음 호스트로 간다 — 같은 답이 다시 온다.
# 0 으로 두면 패킷 한 번 유실에 그 질의 몫이 빈다. 2 이상은 위 최악값을 다시
# 반씩 늘린다 — 전송 오류가 두 번 이어지는 날은 그 호스트가 죽은 날이다.
retries: 1

# posts.json 에 남길 게시물 수 상한. 기본 질의 4 × 100 + AI 4 × 100 + 퀀트 5 × 100
# = 1,300 이 중복 제거 전 최대이므로(2026-09-23 AI 를 인기순 100건으로 올림), 이 값은 '정상이면 걸리지 않는' 자리에 둔
# 안전망이다. 상한에 걸리면 창 안·최신부터 남기고 무엇을 버렸는지
# sources.bluesky.cut 에 적는다. 구획 질의를 늘리면 이 값도 같이 올린다 — 낮으면
# 창 밖을 먼저 버리지만 그다음은 구획을 가리지 않고 오래된 것부터 버린다.
max_posts: 1300

# ── 표시 ─────────────────────────────────────────────────
# 머리 2행의 '반도체·AI 관련 M건 분석' 에 들어가는 말. 질의를 바꾸면 이것도
# 함께 바꾼다 — 질의가 반도체 밖으로 넓어졌는데 이 말이 그대로면 2행이 거짓이 된다.
# 별도 구획이 있는 날은 2행이 '반도체·AI 68건 · AI뉴스 5건 · 퀀트 2건 분석' 꼴이
# 되고, 이 말은 기본 구획 몫 하나다(구획의 말은 sections[].label). 전에는 이 값을
# 읽는 코드가 없어 렌더가 코드 기본값을 썼다 — D-NEXT-Q 에서 렌더·분석이 읽게 했다.
topics_label: 반도체·AI
