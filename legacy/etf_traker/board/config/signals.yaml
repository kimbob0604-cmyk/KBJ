# 스윙 시그널 임계값 — 코드에 숫자를 박지 않는다 (CLAUDE.md 3장).
#
# 근거 문서는 『유명 트레이더 매매법』(2026-09-23 판). 값마다 어느 항목에서 왔는지와
# 근거의 두께를 적는다. 표시는 원문의 뜻 그대로 쓴다.
#
#   원문      원문 본문에 숫자로 적힌 값
#   [복원]    원전에 값이 없어 그 문서가 채운 값. 범위 안에서 바꿔 가며 확인할 자리
#   [2차]     본인이 아니라 남이 요약한 글의 값. 원전 대조 전에는 그 사람 성과라 부르지 않는다
#   비원전    그 문서가 "원전값이 아니다" 라고 밝힌 값
#   새정의    원문에 없어 **이 저장소가 정한** 프록시. 원작의 규칙이 아니다
#
# 이 파일의 어떤 값도 성과가 검증된 값이 아니다. 백테스트 전 후보 규칙이다
# (docs/SIGNALS.md 1장). 값을 바꾸면 DECISIONS.md 에 근거를 남긴다.

meta:
  version: "0.1"
  doc: 유명 트레이더 매매법 (2026-09-23 판)

# ── F9 시장 게이트 ──────────────────────────────────────────
regime:
  # #42 깡토: "기준선 하나를 정해 두고 그 아래에서는 새로 사지 않는다. 책이 든 예는
  # 코스피 60일 평균선, 코스닥 120일 평균선, 52주 신저가 종목 비율 증가 셋" — 원문.
  # 원문이 "규칙은 스스로 정하라" 고 달아 뒀으므로 기간은 격자 대상이다.
  index_ma:
    KOSPI: 60        # 원문 #42
    KOSDAQ: 120      # 원문 #42
  # 평균선 계산에 쓸 지수 일봉을 받을 달력일 수. 120영업일을 채우려면 넉넉히 — 새정의
  fetch_calendar_days: 260
  # 52주 신저가 비율 — 종가가 직전 252영업일(당일 제외) 종가 최저를 깬 종목의 비율.
  # 신고가 정의(CLAUDE.md 4장)를 아래쪽으로 뒤집은 것이다 — 새정의(원문은 '증가' 만 말한다)
  new_low_lookback: 252
  # '증가' 를 무엇과 견줄지. 원문에 없다 — 새정의
  new_low_compare_days: 5
  # 게이트가 닫힌 시장의 후보를 어떻게 할지. 원문은 "새로 사지 않는다" 와
  # "비중만 줄이는 방법" 둘을 같이 적었다. 여기서는 빼지 않고 표시만 한다 — 새정의
  gate_action: mark          # mark | drop

# ── 대상(유니버스) ─────────────────────────────────────────
universe:
  # 보드 하한(D-072)을 그대로 쓴다. 따로 두지 않는다 — settings.yaml display.min_mktcap_eok
  use_board_mktcap_floor: true
  # #177 황동민 외: 매월 말 종가 1,000원 미만 제외 — 원문(논문 규격)
  min_price: 1000
  # 보통주만. 우선주·스팩·리츠는 시그널 대상이 아니다 — 새정의.
  # 값은 engine/kinds.py 의 코드(common · pref · spac · reit)다. 화면 라벨('보통주')이 아니다
  kinds: [common]
  # 20일 평균 거래대금 하한(억원). universe.json 의 turnover_avg20 은 종가×거래량 추정치다.
  # #14 코너스의 유니버스 조건은 미국 기준(25만 주·5달러)이라
  # 국내 값이 원문에 없다 — 새정의
  min_turnover_avg20_eok: 10

# ── F3 상대강도 ────────────────────────────────────────────
rs:
  # #42: 12·6·3개월 상승률을 2:3:5 로 섞는 예 — 원문. 개월→영업일 환산은 새정의
  weights: {ret_250d: 0.2, ret_126d: 0.3, ret_63d: 0.5}
  # #42: 백분위 70 아래는 관심 종목에서 뺀다 — 원문
  min_pct: 70
  # 백분위를 어느 모집단에서 매길지. 원문은 '지수와 견준 상승률' 이라 시장(코스피·코스닥)
  # 별로 매긴다. 한 시장 안에서는 지수를 빼도 순위가 같다 — 새정의
  by_market: true

# ── F4 추세 정렬 ───────────────────────────────────────────
trend:
  # #67 민경인: 평균선 기간 5·20·60·120 — [복원] (원문이 "쓴 것으로 보인다" 고만 적었다)
  daily_ma: [5, 20, 60, 120]
  # #42: 주봉·일봉 모두 정배열, 주봉이 먼저 — 원문. **주봉 기간은 원문에 없다** — 새정의
  weekly_ma: [5, 10, 20]
  require_weekly: true

# ── F2 변동성 수축 ─────────────────────────────────────────
contraction:
  # #16 볼린저: 20일 평균 ± 표준편차 2배, 가운데 선은 단순평균 — 원문
  bb_period: 20
  bb_k: 2.0
  # #16: 띠 폭이 "최근 6개월 중 가장 좁아진 뒤" — 원문. 6개월→126영업일 환산은 새정의
  bw_lookback: 126
  # "6개월 최저의 25% 안" 은 저자 본문이 아니라 후대 코드판 값 — 비원전. 격자 대상
  bw_near_min: 0.25
  # #17 카터: 채널 = 같은 20일 평균 ± 변동폭 1.5배 — 원문(매매 화면 기본값). 가운데 선
  # 단순/지수, 변동폭을 ATR 로 잴지 등락폭 평균으로 잴지는 자료마다 갈린다 — 여기서는
  # 단순평균·단순 ATR 을 쓴다(새정의)
  kc_period: 20
  kc_mult: 1.5
  # #11 크라벨: 전일 변동폭이 최근 7일 중 가장 좁음(NR7) / 안에 들어간 날 — 원문
  nr_days: 7
  # 돌파 전 N영업일 안에 수축이 있었는지 볼 창. 원문에 없다 — 새정의
  recent_days: 10
  # 거래량 마름: 5일 평균 ÷ 20일 평균. #42·#66 은 '줄어든다' 고만 적었다 — 새정의
  dryup_short: 5
  dryup_max: 0.7

# ── F1 셋업 ────────────────────────────────────────────────
setups:
  breakout:
    # #42: 정배열로 52주 신고가를 갱신하는 것을 선호, 역사적이면 더 좋다 — 원문
    min_kind: w52
  watch:
    # 근접은 보드 정의 그대로(갭 5% 이내, D-072). 따로 두지 않는다.
    min_kind: w52
    # #42: "돌파 가격 1~2% 앞에 알림을 걸어 두고" — 원문. 이 안이면 '알림 구간' 표시
    alert_gap_pct: 2.0
    # 감시 후보는 수축이 **필수**다 (F2). 수축 셋 중 하나면 통과 — 새정의
    require_contraction: true

# ── F7 수급 확인 ───────────────────────────────────────────
flows:
  # #42: "기관과 외국인이 산 양이 그날 거래량의 10%를 넘는 것을 최소 기준" — 원문.
  # 원문이 합인지 각각인지 정하지 않았다 → 합산 순매수로 본다(새정의).
  # ⚠️ 원문: 수급은 장이 끝나야 집계된다. 여기서는 장 마감 뒤 확정값으로 판정하고
  # 체결은 다음 거래일이라 미래참조가 아니다(공통 함정 7번).
  min_share_pct: 10
  # 신고가 종목(stockflows.json)에 없는 감시 후보의 수급을 따로 받을지. 종목당 한 번
  # 호출이다 — 새정의
  fetch_candidates: true
  fetch_max: 40

# ── 제외·주의 표시 (F10) ────────────────────────────────────
caution:
  # #178 강장구·심명화: 직전 한 달 일별 최대 수익률이 큰 종목은 다음 달이 낮다. 5분위의
  # 가장 높은 묶음 — 원문(동일가중 월 1.27%, 가치가중이면 0.29% 로 사라짐). 빼지 않고
  # 경고만 단다. 급등 후 매수(#196·#66)와 정면으로 부딪히는 근거라서다
  max_ret_days: 21
  max_ret_top_pct: 20

# ── 손절·목표·비중 (참고값) ─────────────────────────────────
risk:
  # #42: 손절 -7~8% — 원문
  stop_pct: 8
  # #196 쿨라마기: 손절은 그날 저가, 단 그 폭이 ADR 보다 넓으면 안 된다 — 원문.
  # ADR 을 며칠로 재는지는 본인 글에 없다 — [복원]. 계산식(고가/저가 평균)도 새정의
  adr_days: 20
  # #42: 목표는 손절 폭의 세 배 — 원문
  target_r: 3
  # #42: 한 번 매매에 잃어도 되는 금액을 계좌의 1~2% — 원문. 표시는 1%
  risk_per_trade_pct: 1

# ── 발송 ───────────────────────────────────────────────────
output:
  # 한 구획에 싣는 최대 종목 수. 넘치면 '외 N' — 새정의
  max_breakout: 10
  max_watch: 10

# ── 백테스트 (docs/SIGNALS.md 8장) ─────────────────────────
# 판정은 d일 종가, 체결은 d+1. 값의 표시 규칙은 위와 같다.
backtest:
  # 검증 구간 연수와 그 앞 워밍업 영업일(52주 신고가·250일 수익률·120일선·BB 126일) — 새정의
  years: 3
  warmup_bars: 300
  # 다음 날 시가가 전일 종가 대비 이 % 이상이면 상한가 체결 불가로 보고 뺀다.
  # 가격제한폭 30%(2015-06 이후, 원문 공통 함정 9번)의 근사 — 새정의
  limit_gap_pct: 29.5
  # #42: 목표에 못 닿고 옆으로 가면 최대 2~3주에서 판다 — 원문. 15영업일은 새정의
  time_stop_bars: 15
  # #42: 목표 도달 뒤 나머지는 추세가 꺾일 때 — 추세를 탄 종목은 20일선(원문 선택지 중 하나)
  trail_ma: 20
  # #42: 목표에서 절반 — 원문
  partial_at_target: 0.5
  # 끝까지 안 닫힌 거래의 상한 — 새정의
  max_hold_bars: 120
  # #155: 매도 쪽에 0.35%(거래세 0.3 + 수수료 0.05) — 원문(논문 규격)
  cost_sell_pct: 0.35
  # 편도 체결 미끄러짐 — 새정의
  slippage_pct: 0.1
  # 지수 게이트 분할용 지수 일봉을 받을 달력일 수 — 새정의
  index_calendar_days: 1600

# ── 시스템 점검 통과 기준 (engine/systems.py) ──────────────────
# 사용자 요청(2026-09-25): 승률이 높은 시스템만 남긴다. 승률만 보면 손절 없는 역추세
# 규칙이 꼬리 손실을 숨긴 채 통과하므로 기대값·PF 와 두 구간 일관성을 함께 건다.
# **결과를 보기 전에 정했다.** 결과를 보고 바꾸면 같은 표본에 맞춘 값이 된다 — 새정의
screen:
  min_trades: 200          # 전체 거래 수
  min_win_rate: 55         # 전체·앞 절반·뒤 절반 모두
  min_profit_factor: 1.2   # 전체
  # 평균 수익(비용 뺀) > 0 도 전체·앞 절반·뒤 절반 모두

# ── 조합 탐색 (engine/search.py) ────────────────────────────
# 사용자 선택(2026-09-25): 최근 1년을 봉인하고 그 앞에서만 조합을 고른다 — 새정의
search:
  years: 4                 # 검증 창. 봉인 구간을 포함한다
  holdout_days: 250        # 봉인 구간(최근 영업일) — 마지막에 한 번만 본다
  holdout:                 # 봉인 구간 기준. 1단계 기준(screen)과 같되 거래 수만 낮다
    min_trades: 50
    min_win_rate: 55
    min_profit_factor: 1.2
