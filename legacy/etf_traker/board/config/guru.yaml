# 글로벌 투자 구루 브리핑 — 설정. 계약은 docs/GURU.md, 근거는 DECISIONS D-NEXT-G.
# 임계값은 코드가 아니라 여기에만 있다(CLAUDE.md 3장).
#
# 2026-09-29 사용자 요청으로 X 다이제스트(블루스카이 키워드)를 이 브리핑으로 교체했다.
# 인물별 '당일 발언' 은 Claude API 웹 검색(web_search)으로 찾는다 — 사용자가 비용을
# 받아들이고 고른 소스다(무료 안인 Google News RSS 는 헤드라인뿐이라 뺐다).

title: 글로벌 투자 구루 브리핑
# 사용자 양식의 발송 시각(KST). 검증 기준 줄의 '기준 시각' 은 이 값이 아니라 실제
# 조사를 시작한 시각이다 — 늦게 돈 날을 06:40 으로 적으면 거짓이다.
send_at: '06:40'

# 도는 요일 — KST 기준. 화~토 아침이 월~금 미국장 뒤다. 일·월 아침에는 새 미국장이
# 없어 조사하지 않는다(미국 휴장일은 거르지 않는다 — 그날은 '뉴스 사이클' 로 읽는다).
# 0=월 … 6=일 (Python weekday)
run_weekdays: [1, 2, 3, 4, 5]

# 조사 창 — 조사 시각에서 거슬러 이만큼. 사용자 양식 '최근 24시간'.
window_hours: 24
# '참고' 줄(당일 발언이 없을 때 붙이는 최근 발언)은 이 날수 안의 것만.
note_days: 30

# ── 모델·비용 ─────────────────────────────────────────────
# 모델은 보드 서술과 같은 것(settings.yaml writer.models.narrate)을 쓴다 — 사용자가
# 고른 배분이다. 웹 검색 dynamic filtering(web_search_20260209)을 지원한다.
model: claude-sonnet-5
effort: medium
# 검색 도구 버전. 20260209 는 dynamic filtering(검색 결과를 코드로 걸러 토큰을 줄인다).
# 그 결과를 우리가 못 읽어 출처 대조가 전부 어긋나면 아래 fallback 이 알아서 다시 조사한다.
search_tool: web_search_20260209
# 한 그룹의 출처 대조가 **전부** 실패하면 이 도구로 그 그룹만 한 번 다시 조사한다
# (research._one). 없애려면 이 줄을 지운다.
search_tool_fallback: web_search_20250305
research_max_tokens: 16000
synth_max_tokens: 8000
# 그룹 한 번의 호출에서 쓸 수 있는 검색 횟수. 사람당 한 번 + 여유. 넘으면 API 가
# max_uses_exceeded 로 멈추고, 그 뒤 인물은 '확인 못 함' 으로 결손에 적힌다.
# 2026-10-01 첫 실행: 검색 37회 · 입력 89만 토큰 · 추정 $2.44(호출 4번 — 둘은 크레딧 부족으로
# 실패). 검색 결과가 입력 토큰의 대부분이라 사람당 1회로 낮춘다.
searches_per_person: 1.0
searches_min: 4
# pause_turn(서버 쪽 도구 루프가 10회에서 멈춤) 이어 부르기 상한
max_continuations: 4
# 동시에 부르는 그룹 수 — Actions 분을 아끼려고 병렬로 돈다
workers: 3

# 월 예산(달러). 넘으면 그날은 API 를 부르지 않고 한 줄 알림만 보낸다.
# XDIGEST.md 0장의 '넘으면 멈추고 묻는다' 규약. 사용자가 받아들인 추정 범위가
# 월 $15~30 이라 윗값으로 둔다.
budget_usd_month: 30
# 단가 — 비용 계산용. **추정 계산이다.** 바뀌면 여기만 고친다.
#   토큰 단가: claude-api 스킬 표(2026-09-25 캐시) — Sonnet 5 입력 $2 / 출력 $10 per 1M
#   검색 단가: 1,000회당 $10 — 공식 가격표로 확인 필요(확인 전까지 추정)
price:
  input_per_m: 2.0
  output_per_m: 10.0
  search_per_k: 10.0

