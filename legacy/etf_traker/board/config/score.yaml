# 서술 대상 테마 선정 점수. CLAUDE.md 7장.
#
# 스코어 = 업종 등락률 z-score + 신고가 종목수 + 거래대금 증가율
#          + 신규 진입 단계 수 + 수급 일치 여부
#
# 각 항목을 0~1 로 정규화한 뒤 아래 가중치로 더한다.
weights:
  chg_z: 1.0            # 등락률 z-score (전 테마 대비)
  newhigh_count: 0.8    # 신고가 종목 수
  turnover_mult: 0.6    # 거래대금 20일 평균 대비 배수
  new_stages: 1.2       # 오늘 새로 반응한 밸류체인 단계 수 — 확산이 이 리포트의 핵심
  flow_align: 0.5       # 기관·외국인 동시 순매수 (수급 미확보면 0)
  proximity: 0.3        # 근접 종목 수

select:
  narrate_min: 4        # 서술 대상 최소 개수
  narrate_max: 6        # 최대. 나머지는 수치 테이블로만 나간다
  min_stocks: 2         # 구성종목이 이보다 적은 테마는 서술하지 않는다
  min_abs_chg: 1.5      # 등락률 절대값이 이 미만이면 서술 대상에서 제외 (강제 포함 제외)
