name: flowlab 실데이터 검증

# 개발 환경에서는 네이버로 나가는 접속이 막혀 있어 합성 소스로만 돌 수 있다.
# 러너는 네트워크가 열려 있고, 보드 워크플로가 실데이터 DB·state 를 캐시에 두므로
# 여기서 실데이터로 flowlab 을 돌리고 결과를 브랜치에 커밋해 받아 본다.
# 결과는 flowlab/ci-out/ 에만 쌓는다 — docs/ 발행 폴더는 건드리지 않는다.

on:
  push:
    branches: ['claude/52-week-high-dashboard-9bedkz']
    paths:
      - 'flowlab/**'
      - '.github/workflows/flowlab.yml'
      - '!flowlab/ci-out/**'
      # 이 워크플로가 실호출로 검증하는 엔진 모듈 (D-075 재무). 바뀌면 같이 돈다.
      - 'board/ingest/financials.py'
      - 'board/ingest/dart.py'
  workflow_dispatch:
    inputs:
      date:
        description: 'flows 기준일 YYYYMMDD (비우면 최신 state)'
        required: false
        default: ''
      years:
        description: '이벤트 스터디 창 (년)'
        required: false
        default: '3'

concurrency:
  group: flowlab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r board/requirements.txt pandas numpy lxml beautifulsoup4 openpyxl

      - name: 단위 검증 (네트워크 불필요)
        run: python3 -m flowlab selftest

      # board.yml 과 같은 키. 기본 브랜치에서 만든 캐시는 다른 브랜치에서도 복원된다.
      - name: DB 규약 버전
        id: dv
        run: |
          v=$(python3 -c 'from board.ingest.pipeline import DATA_VERSION; print(DATA_VERSION)')
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: 보드 DB·state 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            board/board.db
            board/state
          key: board-db-v${{ steps.dv.outputs.v }}-flowlab-${{ github.run_id }}
          restore-keys: board-db-v${{ steps.dv.outputs.v }}-
      # 2026-09-17~20 에 여기가 IndexError 로 죽었다. 빈 캐시를 받아 board/state
      # 에 날짜 폴더가 하나도 없었는데, sorted(...)[-1] 이 그걸 트레이스백으로만
      # 알렸다. 아래 test -d 는 걸러 주지 못한다 — 빈 폴더도 존재하기 때문이다.
      # 무엇이 없는지 말하지 않는 실패는 런 로그를 몇 번이고 다시 받게 만든다.
      - name: state 확인
        run: |
          ls board/state 2>/dev/null | tail -5 || true
          test -d board/state || { echo "::error::state 캐시가 없다 — 보드 워크플로가 먼저 돌아야 한다"; exit 1; }
          if [ -z "$(find board/state -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            echo "::error::board/state 에 날짜 폴더가 하나도 없다 — 받은 캐시가 비었다"
            echo "위 '보드 DB·state 복원' 단계가 어느 키를 집었는지 보라."
            echo "board-db-v${{ steps.dv.outputs.v }}- 로 시작하는 캐시 중 **가장 최근 것**이 잡힌다."
            echo "보드를 만들지 않는 실행(check 등)이 빈 DB 를 올렸으면 그게 잡힌다."
            echo "고치는 법 — 이 브랜치에서 '신고가 보드' 를 mode init 으로 한 번,"
            echo "이어서 mode engine 으로 한 번 돌린다. 둘 다 텔레그램을 보내지 않는다."
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib, sys
          d = sorted(p for p in pathlib.Path('board/state').iterdir() if p.is_dir())[-1]
          f = d / 'newhigh.json'
          if not f.exists():
              sys.exit(f"::error::최신 state {d.name} 에 newhigh.json 이 없다 — "
                       "보드가 집계까지 가지 못한 실행의 캐시다")
          nh = json.loads(f.read_text())
          print(f"최신 state {d.name} · as_of {nh['as_of']} · 달성 {len(nh['achieved'])} · 근접 {len(nh['proximity'])}")
          PY

      # 일봉 캐시도 실행 간에 나른다 (siseJson 1,300회를 매번 다시 받지 않게).
      - name: 일봉 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: flowlab/cache/prices/naver
          key: flowlab-px-${{ github.run_id }}
          restore-keys: flowlab-px-

      # 응답 형태가 바뀌면 여기서 먼저 드러난다. 2,686종목을 다 돌고 나서 알게 되지 않도록.
      - name: 네이버 응답 표본
        run: python3 -m flowlab sample --code 005930 && python3 -m flowlab sample --code 003490

      - name: 이벤트 스터디
        run: python3 -m flowlab study --years ${{ github.event.inputs.years || '3' }}
      - name: 수급 레이어
        run: |
          d="${{ github.event.inputs.date }}"
          if [ -n "$d" ]; then python3 -m flowlab flows --date "$d"; else python3 -m flowlab flows; fi
      - name: 검증 (CLAUDE.md 7장 기록과 대조)
        id: verify
        continue-on-error: true
        run: |
          d="${{ github.event.inputs.date }}"
          # [KBJ P1] 원본의 대조 기준값(--ref·--ref-event, 실측 수급 수치 — 로그인 등급)은 지웠다.
          # 이 파일은 실행되지 않는다 — board 시험(test_workflow_modes)이 board.run 플래그를 읽으려고 둔다.
          python3 -m flowlab verify ${d:+--date $d} \
            --show 003490 \
            2>&1 | tee /tmp/flowlab-verify.txt
          # tee 는 파이프 끝의 종료코드를 쓰므로 verify 의 실패가 가려진다.
          exit "${PIPESTATUS[0]}"
      # 누적은 여러 날짜의 flows.json 이 쌓여야 하는 부가 산출이다. 하루치만
      # 있는 런에서는 실패하는 것이 정상인데, 예전에는 그 실패가 뒤의 '결과
      # 모으기·커밋' 을 통째로 건너뛰게 만들어 **검증 결과 자체가 레포에 안
      # 올라왔다.** 진단이 뒤 단계 실패에 묻히면 안 된다.
      - name: 누적
        id: history
        continue-on-error: true
        run: python3 -m flowlab history

      # D-075 히트맵 재무 툴팁 — DART 실호출은 러너에서만 된다. 히트맵 종목의
      # 주요계정을 받아 몇 종목이 채워졌는지, 표본 두 종목의 값을 로그에 남긴다.
      - name: DART 재무 실호출 (D-075)
        id: fin
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 -m board.run --financials --live
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('board/state/financials.json')
          if not p.exists():
              raise SystemExit('financials.json 이 없다')
          d = json.loads(p.read_text()); by = d['by_code']
          n_a = sum(1 for x in by.values() if x.get('annual')); n_q = sum(1 for x in by.values() if x.get('quarterly'))
          n_ofs = sum(1 for x in by.values() if x.get('fs_div') == 'OFS')
          n_der = sum(1 for x in by.values() for q in x.get('quarterly') or [] if q.get('derived'))
          print(f"종목 {len(by)} · 연간 있음 {n_a} · 분기 있음 {n_q} · 별도 폴백 {n_ofs} · 차분 불가 분기 {n_der}")
          for code in ('005930', '003490', '000660'):
              x = by.get(code)
              if not x: print(f"  {code}: 히트맵 밖(미수집)"); continue
              print(f"  {code} {x['fs_div']} 연간 " + ' | '.join(f"{a['year']} 매출 {a.get('rev')} OP {a.get('op')}" for a in x['annual']))
              print(f"         분기 " + ' | '.join(f"{q['label']}{'*' if q.get('derived') else ''} 매출 {q.get('rev')} OP {q.get('op')}" for q in x['quarterly']))
          PY

      - name: 일봉 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: flowlab/cache/prices/naver
          key: flowlab-px-${{ github.run_id }}

      - name: 결과 모으기
        if: always()
        run: |
          rm -rf flowlab/ci-out && mkdir -p flowlab/ci-out/state flowlab/ci-out/docs
          # 검증 출력 원문. 개발 환경은 러너 로그 전문을 못 받으므로 이 파일이
          # 유일한 창구다 — 뒤 단계가 실패해도 남아야 한다.
          cp /tmp/flowlab-verify.txt flowlab/ci-out/verify.txt 2>/dev/null || true
          # 글롭이 안 맞으면 셸이 패턴 문자열을 그대로 넘겨 cp 가 실패하고,
          # `bash -e` 가 이 단계를 여기서 끊는다. 그러면 아래 RUN.txt(어느 단계가
          # 왜 건너뛰었는지)와 state·docs 사본이 통째로 안 남는다 — 무엇이
          # 잘못됐는지 알아야 할 때 하필 그 기록이 사라진다.
          # 2026-09-17~20 의 실패가 매번 여기서 끊겼다.
          for f in board/state/*/flows.json; do
            [ -e "$f" ] || continue
            d=$(basename "$(dirname "$f")"); mkdir -p "flowlab/ci-out/state/$d"; cp "$f" "flowlab/ci-out/state/$d/"
          done
          # 검증에 필요한 엔진 산출물 사본 (최신 날짜만) — 읽기 전용 원본은 그대로
          latest=$(ls board/state | sort | tail -1)
          cp board/state/$latest/newhigh.json board/state/$latest/universe.json "flowlab/ci-out/state/$latest/" 2>/dev/null || true
          cp flowlab/out/*.json flowlab/out/*.md flowlab/out/*.csv.gz flowlab/ci-out/ 2>/dev/null || true
          cp board/state/financials.json flowlab/ci-out/financials.json 2>/dev/null || true
          cp docs/flows-*.html docs/eventstudy.html docs/flows-history.html flowlab/ci-out/docs/ 2>/dev/null || true
          echo "verify_outcome=${{ steps.verify.outcome }}" > flowlab/ci-out/RUN.txt
          echo "history_outcome=${{ steps.history.outcome }}" >> flowlab/ci-out/RUN.txt
          echo "financials_outcome=${{ steps.fin.outcome }}" >> flowlab/ci-out/RUN.txt
          echo "run=${{ github.run_id }} sha=${{ github.sha }} at=$(date -u +%FT%TZ)" >> flowlab/ci-out/RUN.txt
          du -sh flowlab/ci-out; ls -R flowlab/ci-out | head -40

      - name: 결과 업로드
        id: upload
        if: always()
        continue-on-error: true   # 판정은 아래 "업로드 결과" 가 한다
        uses: actions/upload-artifact@v4
        with:
          name: flowlab-${{ github.run_number }}
          path: flowlab/ci-out
          # 결과는 아래 단계가 저장소에 커밋한다 — 아티팩트는 사본이다.
          retention-days: 7

      # 결과를 브랜치에 커밋해 개발 환경에서 받아 본다. GITHUB_TOKEN 의 푸시는
      # 새 워크플로를 깨우지 않으므로 루프가 돌지 않는다.

      # 2026-09-20 에 계정 아티팩트 저장 한도를 넘겼다(살아 있는 것 1,375MB /
      # 포함 512MB). 1,266MB 를 지워 109MB 로 내렸지만 GitHub 은 이번 청구
      # 주기의 **누적**으로 셈하므로 지운다고 되돌아가지 않는다. 그래서 10/1
      # 리셋까지 어떤 업로드도 통과하지 못한다 — 실측으로 확인했다(9/20 15:30
      # UTC 삭제 뒤 12시간 20분이 지나도 그대로였고, 그 사이 올라간 아티팩트가
      # 하나도 없다).
      #
      # 그동안 실행이 매번 빨갛게 뜨면 진짜 실패를 놓친다. 그렇다고 그냥
      # continue-on-error 로 덮으면 10/1 이후의 진짜 업로드 실패까지 영영
      # 안 보인다. 그래서 **날짜로 스스로 끝나는** 가드를 둔다 — 그 날이
      # 지나면 이 단계는 아무것도 하지 않고 업로드 실패가 원래대로 잡을
      # 빨갛게 만든다. 되돌리는 것을 사람이 기억할 필요가 없다.
      #
      # 창 안에서 관대하게 굴어도 잃는 정보가 없다. 한도가 걸린 동안은 어떤
      # 업로드도 성공할 수 없어서, 여기서 걸러낼 '진짜 실패' 자체가 없다.
      - name: 업로드 결과
        if: always()
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          # 계정 청구 주기 리셋일(UTC). 이 날부터 가드가 저절로 꺼진다.
          UNTIL: '2026-10-01'
        run: |
          if [ "$OUTCOME" != "failure" ]; then exit 0; fi
          TODAY=$(date -u +%F)
          if [[ "$TODAY" < "$UNTIL" ]]; then
            echo "::warning::아티팩트 업로드 실패 — 계정 저장 한도로 본다." \
                 "$UNTIL(UTC) 까지는 이것으로 잡을 빨갛게 만들지 않는다. 그 뒤에는 실패로 잡는다"
            exit 0
          fi
          echo "::error::아티팩트 업로드 실패 — 저장 한도 유예($UNTIL)가 끝났다. 원인을 봐야 한다"
          exit 1
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f flowlab/ci-out
          git diff --cached --quiet && echo "바뀐 결과 없음" && exit 0
          git commit -m "flowlab CI 결과 $(date -u +%F) (run ${{ github.run_number }}, verify=${{ steps.verify.outcome }})"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            # --autostash 가 없으면 이 재시도는 **존재하는 이유대로 실패한다.**
            # 이 작업은 docs/flows-*.html 같은 추적 파일을 다시 만들어 놓고
            # 커밋은 flowlab/ci-out 만 한다. 그래서 늘 unstaged 변경이 남고,
            # git rebase 는 그 상태를 거부한다("cannot rebase: You have
            # unstaged changes"). 루프는 원격이 앞섰을 때를 위해 있는데
            # 하필 그때 못 살아난다 — 2026-09-20 run 31 이 그랬다. 검증을
            # 13분 돌려 통과해 놓고 결과를 못 올렸다.
            git fetch origin "${GITHUB_REF_NAME}" && git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
            sleep $((i * 3))
          done
          exit 1

      - name: 검증 결과
        if: always()
        run: |
          echo "verify step outcome: ${{ steps.verify.outcome }}"
          test "${{ steps.verify.outcome }}" = "success"
