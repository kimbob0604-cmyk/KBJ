name: X 다이제스트

# **2026-09-29 부터 이 워크플로는 '글로벌 투자 구루 브리핑' 을 보낸다**(docs/GURU.md,
# DECISIONS D-NEXT-G). 사용자가 블루스카이 반도체 다이제스트를 이 양식으로 교체했다.
# 이름·dispatch 타입(xdigest-daily · xdigest-send)은 외부 스케줄러가 부르는 그대로 둔다.
# 옛 다이제스트 모드(check · preview · analyze · render)는 손으로 부를 때만 남아 있다.

# 계약은 board/docs/XDIGEST.md — 일정은 4장, 발송·재시도는 3-5·3-6.
#
# **정시는 크론이 맞추지 않는다.** GitHub 예약 실행은 큐라 이 계정에서 다섯
# 시간씩 밀렸다(GITHUB.md 5-2 실측표: '0 7' 이 12:15 에, '10 7' 이 12:34 에).
# 08:00 발송은 외부 스케줄러(cron-job.org)가 `repository_dispatch` 로 맞춘다 —
# `xdigest-daily` 를 22:45 UTC(07:45 KST), `xdigest-send` 를 23:15 UTC(08:15 KST).
# (2026-09-23 09:00 → 08:00. 그 전까지 스케줄러가 등록돼 있지 않아 이 워크플로는
# 크론 뒤받침으로만 돌았고, 10:23 크론이 4시간 넘게 밀려 16:08 에 도착했다.)
# 아래 크론은 **스케줄러가 죽은 날의 뒤받침**이지 정시가 아니다. 늦게라도 오는
# 편이 안 오는 것보다 낫다.
on:
  repository_dispatch:
    # `types` 에 없는 `event_type` 으로 부르면 GitHub 는 204 를 돌려주면서
    # 워크플로를 트리거하지 않는다 — 실패도 로그도 없다.
    # **`xdigest-collect` 는 일부러 뺐다(2026-09-29).** 구루 브리핑에는 중간 수집이
    # 없어 20:45 호출이 할 일 없이 Actions 분(설치·검증 1분+)만 썼다. 외부
    # 스케줄러(cron-job.org)에 그 호출이 남아 있어도 이제 아무것도 돌지 않는다.
    types: [xdigest-daily, xdigest-send]
  schedule:
    # 분을 붐비는 자리에서 뺀다(:00 · :10 · :30 을 피한다). dispatch 실행
    # (07:45~07:55 · 08:15)과 겹치지 않는 시각이다 — 겹치면 두 실행이 같은
    # 기준일을 나눠 수집하고 커밋이 충돌한다(4장).
    #
    # **창의 끝(07:45 KST) 뒤여야 한다.** 그 앞에 돌면 아직 끝나지 않은 창을
    # 모아 보낸다. 08:23 · 10:23 KST — 실측 지연(1.2~6.4시간)을 더하면 오후에
    # 도착한다. 정시가 아니라 스케줄러가 죽은 날의 뒤받침이다.
    #
    # 뒤받침은 **한 번**만 둔다(2026-09-29). 두 번이면 dispatch 가 정상인 날에도
    # 매일 두 번 깨어나 설치·검증까지 돈 뒤 '이미 보냄' 으로 끝났다 — Actions 무료 분
    # 절약(GITHUB.md 5-4). 늦은 쪽(10:23 KST)을 남긴다.
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        default: daily
        options: [daily, collect, analyze, render, send, check, preview]

# 4장이 요구한다. 없으면 07:45 `daily` · 08:15 `send` · 크론 `daily` 가 겹치고,
# 겹치면 같은 기준일의 state 커밋이 충돌해 한쪽 수집이 리베이스에서 덮인다.
# 큐는 순서를 보장하지 않으므로 `send` 가 `daily` 보다 먼저 돌 수 있다 —
# 그래서 `send` 는 오늘 digest.txt 가 없으면 무동작이다(3-6).
concurrency:
  group: xdigest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r board/requirements.txt

      # 무엇을 하러 깨어났는지 한 곳에서 정한다(board.yml 과 같은 자리).
      - name: 모드 결정
        env:
          EV: ${{ github.event_name }}
          DISPATCH: ${{ github.event.action }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$EV" in
            workflow_dispatch)   MODE="${INPUT_MODE:-daily}" ;;
            # `case` 로 가른다. `[ … ] && MODE=send || MODE=daily` 는 이름이
            # 늘어나면 나머지를 전부 daily 로 떨어뜨려, 20:45 `xdigest-collect`
            # 가 수집·분석·렌더·**발송**까지 하고 표식을 찍는다 — 다음 아침
            # dispatch 는 --once 로 건너뛰고 사용자는 창이 반만 찬 판을 받는다.
            repository_dispatch) case "$DISPATCH" in
                                   xdigest-send)    MODE=send ;;
                                   xdigest-collect) MODE=collect ;;
                                   *)               MODE=daily ;;
                                 esac ;;
            schedule)            MODE=daily ;;
            *)                   MODE=daily ;;
          esac
          # 손으로 돌릴 때는 중복을 막지 않는다 — 사람이 일부러 다시 보내는 것이다(4장).
          if [ "$EV" = "workflow_dispatch" ]; then ONCE=""; else ONCE="--once"; fi
          echo "MODE=$MODE"  >> "$GITHUB_ENV"
          echo "ONCE=$ONCE"  >> "$GITHUB_ENV"
          echo "이 실행의 모드: $MODE (event=$EV action='$DISPATCH' once='$ONCE')"

      # 렌더·분할 규약은 네트워크가 필요 없다. 수집·발송 전에 먼저 막는다.
      - name: 단위 검증
        run: python3 -m board.run --test

      # 이 경로의 state(`board/state/xdigest`)는 **캐시가 아니라 커밋으로**
      # 보관한다. 전에 두었던 `actions/cache/restore` 단계는 `xdigest-state-`
      # 접두사를 저장하는 워크플로가 없어(board.yml·us-board.yml 은
      # `board-db-v<N>-`) 첫 실행부터 늘 미스였다 — 주석만 'board.yml 과 같은
      # 캐시를 읽는다' 고 단정하고 실제 보장은 커밋이 하고 있었다(2장 1번).
      # 캐시를 저장하지도 않는다: 일봉이 없는 이 실행이 공용 키를 덮으면
      # board·flow·flowlab 이 그 빈 것을 받는다.

      # 4장 '중복 방지' 표. 자동 경로(`--once` 가 붙은 실행)에서 이미 보낸
      # 기준일이면 Claude·검증·렌더를 돌리지 않는다 — 늦은 크론이 갱신을 한 번 더
      # 걷는 값만 남기고, 그러지 않으면 하루 Claude 호출이 1회가 아니라 3회가
      # 되어 5장 비용표가 깨지고, **이미 보낸 digest.txt 를 새 내용으로 덮어**
      # 커밋에 남은 본문이 실제 발송본과 달라진다(7장 완료 기준 3번의 사후 대조가
      # 불가능해진다). 표식이 없는데 오늘 `sent.json` 이 있으면 부분 발송이라
      # 재렌더하지 않고 `send` 경로로만 간다(4장 표 2행).
      - name: 표식 확인
        if: env.ONCE != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime
          from board.guru import pipeline as GP
          asof = datetime.now(GP.RS.KST).date().isoformat()   # 기준일은 KST 달력일
          if GP.mark() == asof:
              print('SKIP=sent')
          elif GP.RD.read(asof, 'sent.json'):
              print('SKIP=partial')
          PY
          echo "표식 확인: SKIP='$(grep -m1 '^SKIP=' "$GITHUB_ENV" | cut -d= -f2)'"

      # `send` 는 발송 직전에 표식을 **그 순간의 원격 값**으로 다시 읽는다(4장).
      # `daily` 가 큐에서 몇 분 늦게 커밋한 사이에 `send` 가 --once 를 통과해
      # 2통을 다시 보내는 것을 막는다. 체크아웃 시점의 값으로는 못 막는다.
      # fetch 실패를 삼키지 않는다. 삼키면 아무 로그도 없이 체크아웃 시점의 값으로
      # 판단해 들어가고, 그 사이 `daily` 가 표식을 커밋했다면 `--once` 를 통과해
      # 2통을 다시 보낸다 — 이 단계가 막으려던 바로 그 사고다(4장 · 완료 기준 4번).
      # 늦게 보내는 편이 두 번 보내는 것보다 나으므로 `NO_REREAD` 를 남기고
      # '실행' 단계가 발송을 건너뛴다.
      - name: 표식·발송 기록 다시 읽기
        if: env.MODE == 'send'
        run: |
          if ! git fetch origin "${GITHUB_REF_NAME}" --depth=1; then
            echo "::warning::표식을 다시 읽지 못했다(git fetch 실패) — 발송을 건너뛴다"
            echo "NO_REREAD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git checkout "origin/${GITHUB_REF_NAME}" -- docs/api/xdigest-sent.json 2>/dev/null || true
          git checkout "origin/${GITHUB_REF_NAME}" -- board/state/xdigest 2>/dev/null || true
          git checkout "origin/${GITHUB_REF_NAME}" -- docs/api/guru-sent.json 2>/dev/null || true
          git checkout "origin/${GITHUB_REF_NAME}" -- board/state/guru 2>/dev/null || true
          git reset -q || true
          echo "표식: $(cat docs/api/xdigest-sent.json 2>/dev/null || echo '없음')"

      - name: 실행
        env:
          # 자격증명 이름은 board/.env.example 과 같게 맞춘다.
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # 다이제스트를 받는 방. 없으면 TELEGRAM_CHAT_ID(보드 방)로 간다.
          XDIGEST_CHAT_ID:     ${{ secrets.XDIGEST_CHAT_ID }}
          # 블루스카이 로그인(선택). 없으면 공개 호스트만 쓴다 — XDIGEST.md 3-1.
          BSKY_HANDLE:         ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:   ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          # -e 가 없으면 수집이 실패해도 그대로 분석으로 넘어가 빈 다이제스트를
          # 보낸다. 아래 'if ... then exit 0; fi' 형태도 -e 때문에 쓴 것이다.
          set -eo pipefail
          case "$MODE" in
            # 점검은 실패를 삼키지 않는다. `|| true; exit 0` 이던 자리다 —
            # 그러면 없는 플래그를 불러도 0초에 초록으로 끝난다(실제로
            # `--xdigest-check` 가 없던 동안 그랬다). 여기서 빨간 것이
            # '발송 시각에 알면 늦다' 는 그 신호다. 본문은 tee 로 남겨
            # '실행 요약'(if: always())이 런 페이지에 찍는다.
            check)    rc=0
                      python3 -m board.run --xdigest-check 2>&1 \
                        | tee /tmp/xdigest.txt || rc=$?
                      exit $rc ;;
            # 구루 브리핑에는 중간 수집이 없다 — 조사는 daily 한 번에 한다.
            collect)  echo "구루 브리핑은 중간 수집이 없다 — 아무것도 하지 않는다" ;;
            # 이미 보낸 날에도 새 설정을 실물로 본다 — 임시 디렉터리에서 돌고
            # 표식·state 를 건드리지 않아 아래 '결과 커밋' 이 올릴 것이 없다.
            preview)  python3 -m board.run --xdigest-preview --send-preview 2>&1 \
                        | tee /tmp/xdigest.txt ;;
            analyze)  python3 -m board.run --xdigest-analyze ;;
            render)   python3 -m board.run --xdigest-render ;;
            send)     if [ -n "$NO_REREAD" ]; then
                        echo "표식을 다시 읽지 못해 발송하지 않는다 — 다음 실행이 보낸다"
                        exit 0
                      fi
                      # shellcheck disable=SC2086
                      python3 -m board.run --send guru $ONCE ;;
            # 수집 → 분석·검증 → 렌더 → 발송. 분석이 실패해도 렌더는 돈다
            # (3-6 — 머리 세 줄 + 결손 + 계정별 건수 + URL 목록이 나간다).
            # 앞 단계가 표식을 봤으면 4장 표대로 여기서 갈린다.
            *)        # 구루 브리핑: 이미 보냈으면 아무것도(웹 검색 비용도) 쓰지 않는다.
                      if [ "$SKIP" = "sent" ]; then
                        echo "이미 보낸 기준일 — 조사·발송 없음"
                        exit 0
                      fi
                      if [ "$SKIP" = "partial" ]; then
                        echo "부분 발송 상태 — 다시 조사하지 않고 못 보낸 통부터 보낸다"
                        # shellcheck disable=SC2086
                        python3 -m board.run --send guru $ONCE
                        exit 0
                      fi
                      # shellcheck disable=SC2086
                      python3 -m board.run --guru \
                        && python3 -m board.run --send guru $ONCE ;;
          esac

      # 아티팩트 업로드 단계를 두지 않는다 — 계정 저장 한도를 넘겨 어떤 업로드도
      # 통과하지 못한다(0장 · board.yml '업로드 결과'). 산출물은 커밋으로 남기고,
      # 텔레그램 없이도 런 페이지에서 읽히게 본문을 요약에 찍는다.
      - name: 실행 요약
        if: always()
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          echo "### X 다이제스트 — $MODE" >> "$S"
          g=$(ls -1d board/state/guru/*/ 2>/dev/null | tail -1)
          if [ -n "$g" ] && [ -f "${g}brief.txt" ]; then
            { echo '#### 구루 브리핑'; echo '```'; head -120 "${g}brief.txt"; echo '```'; } >> "$S"
            [ -f "${g}sent.json" ] && { echo '```json'; cat "${g}sent.json"; echo '```'; } >> "$S"
          fi
          d=$(ls -1d board/state/xdigest/*/ 2>/dev/null | tail -1)
          if [ -n "$d" ] && [ -f "${d}digest.txt" ]; then
            # 80줄 — 별도 구획(D-NEXT-Q)은 본문 맨 뒤라 40줄이면 요약에서 안 보인다.
            { echo '```'; head -80 "${d}digest.txt"; echo '```'; } >> "$S"
            echo "본문 $(wc -c < "${d}digest.txt")바이트" >> "$S"
          else
            echo "_digest.txt 가 없습니다._" >> "$S"
          fi
          for f in verify.json sent.json; do
            if [ -n "$d" ] && [ -f "${d}${f}" ]; then
              { echo "**$f**"; echo '```json'; cat "${d}${f}"; echo '```'; } >> "$S"
            fi
          done
          if [ -f /tmp/xdigest.txt ]; then
            { echo '```'; cat /tmp/xdigest.txt; echo '```'; } >> "$S"
          fi
          exit 0

      # **`if: always()`** 다 (board.yml '결과 커밋' 의 `if: success()` 와 다르다).
      # 발송이 중간에 실패한 실행도 sent.json 을 남겨야 다음 send 가 몇 통까지
      # 갔는지 안다(3-5). 표식 파일은 발송이 끝까지 성공했을 때만 쓰이므로
      # (xdigest/send.py `mark`) 실패한 실행이 커밋해도 중복 발송이 되지 않는다.
      - name: 산출 커밋
        if: always()
        env:
          # 푸시가 세 번 다 거부됐을 때 사유를 텔레그램으로도 한 줄 보낸다(3-6).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          XDIGEST_CHAT_ID:    ${{ secrets.XDIGEST_CHAT_ID }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 한 줄에 몰면 안 된다. 한쪽이 아직 없을 때 pathspec 오류로
          # 통째로 실패해 다른 쪽까지 스테이징되지 않는다(board.yml '결과 커밋').
          #
          # `-f` 인 이유: board/.gitignore 의 `state/*/` 가 이 디렉터리를 통째로
          # 뺀다. 그 파일을 이 경로가 고치지 않고 여기서만 강제한다.
          git add -f board/state/xdigest 2>/dev/null || true
          git add docs/api/xdigest-sent.json 2>/dev/null || true
          git add -f board/state/guru 2>/dev/null || true
          git add docs/api/guru-sent.json 2>/dev/null || true
          git diff --cached --quiet && echo "바뀐 산출물 없음" && exit 0
          git commit -m "X 다이제스트 $(date -u +%F) ($MODE)"
          # dispatch 로 온 체크아웃은 detached HEAD 라 맨 git push 는 아무 데도
          # 가지 않는다. 브랜치를 명시한다. 거부되면 원격 위로 다시 얹는다 —
          # 충돌은 이 경로의 생성물뿐이고 방금 만든 쪽이 최신이다.
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "푸시 성공 (시도 $i)"
              exit 0
            fi
            echo "푸시 거부 — 원격이 앞서 있다. 다시 얹는다 (시도 $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              echo "::error::리베이스 실패 — 손으로 봐야 한다"
              exit 1
            }
            sleep $((i * 3))
          done
          # 세 번 다 실패했으면 표식이 남지 않는다 — 다음 자동 실행이 같은 날을
          # 다시 보낼 수 있다. 그래서 사유를 텔레그램으로도 한 줄 보낸다(3-6).
          echo "::error::산출을 푸시하지 못했습니다. 표식이 없어 중복 발송이 날 수 있습니다."
          python3 - <<'PY' || true
          from board.report import telegram as TG
          from board.xdigest import send as XS
