# 비용 성격별 분류 매핑
# ---------------------------------------------------------------------------
# DART 정기보고서 주석의 "비용의 성격별 분류" 표에 나오는 계정명을
# 리포트의 7개 버킷으로 접는다. 회사마다 계정명이 다르므로,
#   python run.py --stock 006110 --diagnose-costs
# 를 돌려 미매핑 계정 목록을 확인한 뒤 여기에 추가하는 것이 정상 워크플로다.
#
# 매칭 규칙: 공백 제거 후 부분문자열 포함(대소문자 무시). 위에서부터 먼저 맞는 버킷 채택.
# 따라서 더 구체적인 버킷을 위에 둘 것 (예: '무형자산상각비'가 '상각비'보다 위).

buckets:
  원가:
    - 재고자산의변동
    - 동력비          # 제철·제련업의 전력·연료. 제조원가 성격(변동비)
    - 유틸리티비        # 전력·용수 (005930 표기). 동력비와 같은 성격
    - 상품의변동
    - 제품및재공품      # '제품및재공품등의변동' 등 변형 포함
    - 원재료
    - 상품매입
    - 매입액
    - 상품및원재료사용액
    - 재료비
    - 공사원가
    - 용역원가
    - 상품매출원가

  인건비:
    - 종업원급여
    - 급여
    - 임금
    - 퇴직급여
    - 복리후생비
    - 주식보상비용
    - 인건비

  감가상각비:
    - 감가상각비및무형자산상각비
    - 감가상각비와무형자산상각비
    - 감가상각비
    - 무형자산상각비
    - 사용권자산상각비
    - 상각비

  지급수수료:
    - 지급수수료
    - 수수료비용
    - 지급수수료및제세공과

  외주용역비:
    - 외주용역비
    - 외주비
    - 외주가공비
    - 용역비
    - 지급임차료및외주비

  유지보수비:
    - 유지보수비
    - 수선비
    - 유지관리비
    - 소모품비

  # 명시적 '기타' — 합산 결과는 같지만, 검토를 마친 계정이라는 표시다.
  # (미매핑 경고에서 빠진다. 7버킷 체계에 자리가 없어 기타로 두는 것)
  기타:
    - 광고선전비        # 판관비 성격 — 7버킷 체계에 자리가 없어 기타
    - 판매촉진비
    - 운반비
    - 수출제비        # '수출제비용' 포함
    - 임차료          # '지급임차료' 포함
    - 기타비용
    - 기타

# 위 어디에도 안 걸리는 계정은 전부 '기타'로 합산된다.
# 합계 행으로 판정해 제외할 라벨 (버킷에 넣지 않고 검증용으로만 사용)
total_labels:
  - 합계
  - 성격별비용합계
  - 총계
  - 계
  - 영업비용합계
  - 매출원가및판매비와관리비

# 변동비/고정비 구분 (이미지 5의 우측 라벨)
cost_behavior:
  변동비: [원가, 지급수수료, 외주용역비]
  고정비: [인건비, 감가상각비, 유지보수비, 기타]

# 주석 표를 찾을 때 쓰는 제목 키워드 (우선순위 순)
note_titles:
  - 비용의성격별분류
  - 성격별비용
  - 비용의성격별
  - 영업비용
  - 판매비와관리비

# ---------------------------------------------------------------------------
# 영업이익 → 당기순이익 브릿지 (이미지 3)
# 영업외손익을 아래 4개 항목으로 쪼갠다. 금융수익/금융원가/기타수익/기타비용 주석에서 찾는다.
bridge:
  note_titles:
    - 금융수익및금융원가
    - 금융수익과금융비용
    - 금융수익
    - 금융원가
    - 기타수익및기타비용
    - 기타수익
    - 기타비용
    - 영업외손익

  buckets:
    FVPL 평가이익:
      - 당기손익-공정가치측정
      - 당기손익공정가치측정
      - FVPL
      - 평가이익
      - 평가손실
      - 파생상품평가
    순이자손익:
      - 이자수익
      - 이자비용
      - 이자손익
    순외환손익:
      - 외화환산
      - 외환차익
      - 외환차손
      - 환산이익
      - 환산손실
      - 외환손익
    배당·기타:
      - 배당금수익
      - 지분법
      - 유형자산처분      # 처분이익/처분손실 — 부호는 negative_keywords 가 가른다
      - 무형자산처분
      - 대손상각비        # '기타의대손상각비' 포함 ('손'이 부호를 가른다)
      - 기부금
      - 잡이익
      - 잡손실

  # 손실 성격이라 부호를 뒤집어야 하는 계정 (주석에 절대값으로 실리는 경우)
  negative_keywords:
    - 비용
    - 손실
    - 손
    - 원가
    - 기부금
