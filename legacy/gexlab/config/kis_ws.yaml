# KIS 웹소켓 접속·구독 메시지 형식 (services/ws_gateway/client.py 가 읽는다)
#
# 출처: KIS Open API 문서 — 웹소켓 접속 주소·구독 메시지 형식·PINGPONG(API 인터페이스 사실).
#   GEXLAB 은 이 형식을 한국투자증권 공식 샘플 저장소 koreainvestment/open-trading-api(커밋
#   b4e6249714418aa57833d1cbbbced39cbcc5b125, 2026-08-26, 가져온 날 2026-09-28 —
#   config/kis_ws_fields.yaml 과 같은 커밋)로 확인했다. 아래는 그 대조 기록이다(`source` 는 시험이
#   읽는다 — 코드는 옮기지 않았다).
#   - kis_devlp.yaml — `ops: "ws://ops.koreainvestment.com:21000" # 웹소켓`,
#     `vops: "ws://ops.koreainvestment.com:31000" # 모의투자 웹소켓`
#   - examples_user/kis_auth.py
#       data_fetch(tr_id, tr_type, params): header = {approval_key, content-type: utf-8,
#         tr_type, custtype: "P"}, body = {"input": {"tr_id": …, **params}} — 등록 "1"·해제 "2"
#       system_resp: isOk = body.rt_cd == "0", isUnSub = msg1[:5] == "UNSUB",
#         body.output 의 iv·key(체결통보 복호화용), PINGPONG 은 header 만 온다
#       KISWebSocket.__subscriber: PINGPONG 이면 `await ws.pong(raw)`
#       KISWebSocket.send: 메시지마다 smart_sleep() — 실전 0.05초·모의 0.5초
#       '0'·'1' 로 시작하는 프레임은 `|` 로 나눠 [1] TR, [3] `^` 이어 붙인 값 ('1' 은 AES 암호화)
#   - examples_llm/domestic_futureoption/krx_ngt_option_ccnl/krx_ngt_option_ccnl.py 등:
#       params = {"tr_key": 종목코드}
#   - legacy/websocket/python/ws_domestic_future.py: 같은 등록 문자열, PINGPONG → websocket.pong(data),
#       등록 사이 asyncio.sleep(0.5)
# 공식 샘플에 없는 값은 모두 '확인 필요' — Phase 1 녹화(실제 응답 원문)로 확인하고 고친다.
source:
  repo: https://github.com/koreainvestment/open-trading-api
  commit: b4e6249714418aa57833d1cbbbced39cbcc5b125
  fetched: 2026-09-28
  files:
    - https://github.com/koreainvestment/open-trading-api/blob/b4e6249714418aa57833d1cbbbced39cbcc5b125/kis_devlp.yaml
    - https://github.com/koreainvestment/open-trading-api/blob/b4e6249714418aa57833d1cbbbced39cbcc5b125/examples_user/kis_auth.py
    - https://github.com/koreainvestment/open-trading-api/blob/b4e6249714418aa57833d1cbbbced39cbcc5b125/examples_llm/domestic_futureoption/krx_ngt_option_ccnl/krx_ngt_option_ccnl.py
    - https://github.com/koreainvestment/open-trading-api/blob/b4e6249714418aa57833d1cbbbced39cbcc5b125/legacy/websocket/python/ws_domestic_future.py

url:
  real: ws://ops.koreainvestment.com:21000  # 공식 ops (평문 ws — 접속키가 평문으로 간다. KIS 방식)
  vts: ws://ops.koreainvestment.com:31000   # 공식 vops (모의 — 시세 수집에 쓰지 않는다, PLAN §4.2)

header:
  custtype: P           # 공식 (개인)
  content_type: utf-8   # 공식 헤더 키는 'content-type'

tr_type:
  subscribe: "1"        # 공식 등록
  unsubscribe: "2"      # 공식 해제

pingpong:
  tr_id: PINGPONG       # 공식
  # 공식 샘플은 받은 원문을 웹소켓 PONG 제어 프레임에 실어 보낸다(ws.pong(raw)). 'echo' 는 원문을
  # 텍스트로 되돌려 보내는 비공식 방식 — 공식대로 둔다. 서버가 어느 쪽을 기대하는지는 확인 필요
  reply: pong

responses:
  ok_rt_cd: "0"         # 공식 isOk
  unsub_prefix: UNSUB   # 공식 isUnSub (msg1 앞 5자)
  # 아래 오류 문구는 공식 샘플에 없다 — 확인 필요. msg1 을 대문자로 바꿔 포함 여부로 가른다.
  # 가르는 순서: key_rejected → key_in_use → max_subscriptions → already_subscribed → not_subscribed
  key_rejected: INVALID APPROVAL      # 접속키 거절
  key_in_use: ALREADY IN USE          # 같은 앱키를 다른 세션이 쓰는 중 (세션 소유는 ws-gateway 하나)
  max_subscriptions: MAX SUBSCRIBE OVER
  already_subscribed: ALREADY IN SUBSCRIBE  # 등록 요청인데 이미 등록돼 있다 → 등록된 것으로 본다
  not_subscribed: NOT FOUND           # 해제 요청인데 등록돼 있지 않다 → 해제된 것으로 본다

client:
  # 등록·해제 메시지 간격. 속도 한도는 미실측이라 설계 §4 값(0.1초에 1건)으로 시작 — 확인 필요
  # (공식 샘플 smart_sleep 실전 0.05초, legacy 0.5초)
  pacing_s: 0.1
  # 감속(설계 §4 '오류 응답이면 감속하고 health 기록'): 등록·해제 오류 응답(최대 구독 초과·알 수 없는
  # 거절 등 — 이미 등록됨·등록 안 됨·접속키 거절은 빼고)이면 간격을 pacing_factor 배로, 상한
  # pacing_max_s(0.1 → 0.2 → 0.4 → 0.8 → 1.0초). 감속 전에 보낸 요청의 오류는 같은 버스트로 보고 더
  # 늘리지 않는다. 성공 응답이 pacing_recover_after 건 이어지면 한 단계씩 pacing_s 까지 되돌린다.
  # 상한 1.0초면 세션 전환(해제 39 + 등록 35건)이 약 74초 — 속도 한도·오류 문구 미실측, 확인 필요
  pacing_max_s: 1.0
  pacing_factor: 2.0
  pacing_recover_after: 20
  # 등록·해제 응답을 기다리는 시간. 넘으면 등록은 된 것으로, 해제는 풀리지 않은 것으로(둘 다 자리를
  # 차지한 쪽 — 예산 보수적) 보고 health. 그 때문에 등록할 자리가 없으면 끊고 다시 붙는다(새 세션은
  # 구독이 없다). 풀리지 않은 해제는 다음 맞추기에서 다시 보낸다 — 확인 필요
  ack_timeout_s: 5.0
  # 연결이 이만큼 살아 있었을 때만 백오프를 1초부터 다시 센다(등록 성공 응답만으로는 아니다 —
  # 받아 주고 곧 끊는 서버에 1초마다 다시 붙지 않게, PLAN §6.5)
  stable_s: 60.0
  # Redis kis:ws_key 가 비었을 때 다시 읽는 간격 (발급은 auth 만 한다)
  key_wait_s: 5.0
  # 장 마감 직후 도착한 체결(15:45:00 체결이 15:45:00.2 도착 등)을 그 세션으로 붙이는 여유 — 확인 필요
  late_grace_s: 60.0
  # websockets 라이브러리의 프로토콜 ping 간격. 공식 샘플은 websockets.connect(url) 기본값(20초) — 확인 필요
  ping_interval_s: 20.0
  open_timeout_s: 10.0

backoff:  # PLAN §6.5: 1초 → 60초
  initial: 1.0
  factor: 2.0
  maximum: 60.0
  jitter: 0.0
