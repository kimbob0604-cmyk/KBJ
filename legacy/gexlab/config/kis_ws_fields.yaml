# KIS 웹소켓 체결 TR 컬럼 순서 (data/kis/ws.py 가 읽는다)
#
# 출처: KIS Open API 문서 — 국내선물옵션 실시간 체결 TR 응답의 필드 이름·순서(API 인터페이스 사실).
#   GEXLAB 은 이 순서를 한국투자증권 공식 샘플 저장소 koreainvestment/open-trading-api(커밋
#   b4e6249714418aa57833d1cbbbced39cbcc5b125, 2026-08-26, 가져온 날 2026-09-28)의 TR 별 `columns`
#   리스트로 확인했다. 아래 `source`·`url` 은 그 대조 위치다(시험이 읽는다 — 코드는 옮기지 않았다).
# 교차 확인: 같은 저장소 examples_user/domestic_futureoption/domestic_futureoption_functions_ws.py
#   (네 TR 모두 동일), legacy/websocket/python/ws_domestic_future.py 의 한글 라벨(menulist) —
#   legacy 는 끝의 실시간 가격제한 필드(dynm_*) 등이 없는 옛 목록이고 앞부분 순서는 같다.
#   seln_cntg_smtn = 총매도수량, shnu_cntg_smtn = 총매수수량 (누적 매도·매수 체결수량 — PLAN §5.5 HIRO-lite)
# 주의: 야간 옵션(H0EUCNT0)은 끝 두 필드 순서가 주간과 다르다(dynm_prc_limt_yn, dynm_llam).
#   야간 선물은 dscs_bltr_acml_qty, 야간 옵션은 avrg_vltl·dscs_lrqn_vol 이 없다.
# Phase 1 녹화 프레임으로 필드 수·값을 다시 확인한다 (지금 테스트는 이 목록으로 만든 합성 프레임).
