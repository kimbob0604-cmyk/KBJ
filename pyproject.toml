[project]
name = "kbj"
version = "0.1.0"
description = "국장 통합 터미널 · 포트폴리오 완성본"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 신규 kbj/ 코드에 필요한 것만. 버전 하한은 P0 통합 해석(docs/conflict_map.md §3.3)과 맞춘다
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
]
# legacy 세 프로젝트(legacy/gexlab·etf_traker·stock_dashboard)를 루트 .venv 하나로 돌리는 의존성.
# 이식 보고들의 python_deps 를 합쳤다(docs/conflict_map.md §3.3, /tmp/p0test/resolve/union.txt 해석과 같은 범위).
# 루트 uv.lock 이 정본이다 — legacy/gexlab/uv.lock 은 원본 기록으로만 남는다(legacy/gexlab/MIGRATION.md).
# legacy 를 비우는 단계(PLAN D8)에서 이 그룹도 지운다.
legacy = [
    # gexlab (실행)
    "exchange-calendars>=4.13.2",
    "vollib>=1.0.11",
    "websockets>=17.1",
    # gexlab (개발 — 자기 pyright·pre-commit 설정용)
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    # 공통 — pandas 는 pykrx 가 <3.0 을 요구해 2.3 대로 묶는다(GX 는 2.3.3 에서 통과 확인, E2)
    "pandas>=2.3.3,<3.0",
    "numpy>=2.0",
    "requests>=2.31",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    # etf_traker (board·monitor·flowlab·dart-report·etf_tracker_v9)
    "anthropic>=0.40.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "fonttools>=4.40",
    "streamlit>=1.36",
    "playwright>=1.40",
    # stock_dashboard (requirements.txt + 누락분 aiohttp·tenacity — dart_collector.py)
    "flask>=3.0",
    "pykrx>=1.0.51",
    "apscheduler>=3.10",
    "gunicorn>=21.2",
    "yfinance>=0.2.40",
    "flask-socketio>=5.3",
    "simple-websocket>=1.0",
    "aiohttp>=3.9",
    "tenacity>=8.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kbj"
module-root = ""

# ── ruff — 규칙은 GEXLAB pyproject 와 같다. 대상은 kbj/·tests/·scripts/ 만(legacy 제외 — ADR 0003) ──
[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "scripts"]
include = ["kbj/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = ["legacy", "docs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "RUF"]
# RUF001~003: 한글 문서·주석의 전각 문자 경고는 끈다
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ── pyright — 대상은 kbj/·tests/·scripts/ 만(legacy 제외 — ADR 0003) ─────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["kbj", "tests", "scripts"]
exclude = ["legacy", "**/__pycache__", ".venv"]
strict = ["kbj/core"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q --strict-markers"
xfail_strict = true

# ── import-linter — 구조로 막는 의존 규칙 (DATA_TIERS §3, ADR 0002·0003) ─────────────────────
[tool.importlinter]
root_packages = ["kbj"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "① 공개 수집기(kbj.data.public)는 로그인 수집기(kbj.data.private)를 import 하지 않는다"
type = "forbidden"
source_modules = ["kbj.data.public"]
forbidden_modules = ["kbj.data.private"]

[[tool.importlinter.contracts]]
name = "② kbj 는 legacy 를 import 하지 않는다"
type = "forbidden"
source_modules = ["kbj"]
forbidden_modules = ["legacy"]

[[tool.importlinter.contracts]]
name = "③ kbj.core 는 순수 계산 — 어댑터·서비스·저장소와 I/O 라이브러리를 import 하지 않는다"
type = "forbidden"
source_modules = ["kbj.core"]
forbidden_modules = ["kbj.data", "kbj.services", "kbj.store", "httpx", "psycopg", "redis"]
