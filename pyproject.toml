[project]
name = "kbj"
version = "0.1.0"
description = "국장 통합 터미널 · 포트폴리오 완성본"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 신규 kbj/ 코드에 필요한 것만. 버전 하한은 P0 통합 해석(docs/conflict_map.md §3.3)과 맞춘다.
# P2(docs/p2_design.md §11.2 S0)에서 더한 것:
# - exchange-calendars: 거래 캘린더 XKRX·XNYS(kbj.core.calendar — 지연 import). pandas 는 이 의존성으로
#   들어오고 단일 lock 이 2.3.3 으로 묶는다(legacy 그룹 `pandas<3.0`, conflict_map §3.3)
# - defusedxml: 공공데이터포털·DART corpCode.xml XML 파싱(외부 XML 은 표준 xml 로 열지 않는다)
# - FastAPI·uvicorn 은 넣지 않는다 — 로그인 API 와 웹훅 서버는 P3(메인 결정 D4, R8). P2 웹훅은 순수 처리 함수
dependencies = [
    "defusedxml>=0.7.1",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    # pyright strict(kbj/core)가 exchange_calendars 가 돌려주는 pandas 값의 타입을 읽게(묶음 B —
    # GX dev 의존성 그대로). 없으면 `.sessions` 의 year·month·day 가 Unknown 이라 strict 가 실패한다
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
    # 하루 운영 시뮬레이션의 가짜 KIS 웹소켓 서버(tests/fakes/ws_server.py — GX 승격, 묶음 I)
    "websockets>=17.1",
]
# legacy 세 프로젝트(legacy/gexlab·etf_traker·stock_dashboard)를 루트 .venv 하나로 돌리는 의존성.
# 이식 보고들의 python_deps 를 합쳤다(docs/conflict_map.md §3.3, /tmp/p0test/resolve/union.txt 해석과 같은 범위).
# 루트 uv.lock 이 정본이다 — legacy/gexlab/uv.lock 은 원본 기록으로만 남는다(legacy/gexlab/MIGRATION.md).
# legacy 를 비우는 단계(PLAN D8)에서 이 그룹도 지운다.
legacy = [
    # gexlab (실행) — exchange-calendars 는 P2 부터 런타임 의존성(위 dependencies)
    "vollib>=1.0.11",
    "websockets>=17.1",
    # gexlab (개발 — 자기 pyright·pre-commit 설정용). pandas-stubs 는 P2 부터 dev 그룹(위)
    "pre-commit>=3.7",
    # 공통 — pandas 는 pykrx 가 <3.0 을 요구해 2.3 대로 묶는다(GX 는 2.3.3 에서 통과 확인, E2)
    "pandas>=2.3.3,<3.0",
    "numpy>=2.0",
    "requests>=2.31",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    # etf_traker (board·monitor·flowlab·dart-report·etf_tracker_v9)
    "anthropic>=0.40.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "fonttools>=4.40",
    "streamlit>=1.36",
    "playwright>=1.40",
    # stock_dashboard (requirements.txt + 누락분 aiohttp·tenacity — dart_collector.py)
    "flask>=3.0",
    "pykrx>=1.0.51",
    "apscheduler>=3.10",
    "gunicorn>=21.2",
    "yfinance>=0.2.40",
    "flask-socketio>=5.3",
    "simple-websocket>=1.0",
    "aiohttp>=3.9",
    "tenacity>=8.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kbj"
module-root = ""

# ── ruff — 규칙은 GEXLAB pyproject 와 같다. 대상은 kbj/·tests/·scripts/ 만(legacy 제외 — ADR 0003) ──
[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "scripts"]
include = ["kbj/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = ["legacy", "docs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "RUF"]
# RUF001~003: 한글 문서·주석의 전각 문자 경고는 끈다
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ── pyright — 대상은 kbj/·tests/·scripts/ 만(legacy 제외 — ADR 0003) ─────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["kbj", "tests", "scripts"]
exclude = ["legacy", "**/__pycache__", ".venv"]
strict = ["kbj/core"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
# importlib: tests/ 아래 하위 폴더(unit/<영역>·property·integration·sim)에 __init__.py 를 두지 않는다 —
# 같은 이름의 시험 파일이 생겨도 수집이 깨지지 않게(docs/p2_design.md §1.11). 공용 도구는 `tests.fakes.*`
addopts = "-q --strict-markers --import-mode=importlib"
xfail_strict = true
# integration·docker 는 서로의 별칭이다(tests/conftest.py — GX 방식). 단위 실행은 `-m "not integration"`
markers = [
    "integration: compose·컨테이너 스택(TimescaleDB·Redis)이 필요한 통합 시험 (Docker 없으면 건너뜀)",
    "docker: integration 의 옛 이름 — 둘 중 하나가 붙으면 둘 다 붙는다(tests/conftest.py)",
    "network: 외부 API 를 실제로 부르는 시험 (CI 기본 제외 — 키가 있는 운영 환경에서만)",
    "sim: 하루 운영 시뮬레이션(가짜 시계·가짜 서버 — tests/sim)",
]

# ── import-linter — 구조로 막는 의존 규칙 (DATA_TIERS §3, ADR 0002·0003) ─────────────────────
[tool.importlinter]
root_packages = ["kbj"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "① 공개 수집기(kbj.data.public)는 로그인 수집기(kbj.data.private)를 import 하지 않는다"
type = "forbidden"
source_modules = ["kbj.data.public"]
forbidden_modules = ["kbj.data.private"]

[[tool.importlinter.contracts]]
name = "② kbj 는 legacy 를 import 하지 않는다"
type = "forbidden"
source_modules = ["kbj"]
forbidden_modules = ["legacy"]

[[tool.importlinter.contracts]]
name = "③ kbj.core 는 순수 계산 — 어댑터·서비스·저장소와 I/O 라이브러리를 import 하지 않는다"
type = "forbidden"
source_modules = ["kbj.core"]
forbidden_modules = ["kbj.data", "kbj.services", "kbj.store", "httpx", "psycopg", "redis"]

# ── P2 묶음 I — 정본 경계(docs/p2_design.md §9.6, ADR 0004). 계약 소스 모듈이 다 생긴 뒤 한꺼번에 넣었다 ──
# ④ 은 간접 import 까지 막는다(기본값) — auth 를 끌어오는 길이 kbj 어디에도 없어야 한다(메인 결정 D1 의 세 겹 중 하나)
[[tool.importlinter.contracts]]
name = "④ KIS 발급(kbj.services.auth)은 다른 모듈이 import 하지 않는다"
type = "forbidden"
source_modules = [
    "kbj.core",
    "kbj.config",
    "kbj.data",
    "kbj.store",
    "kbj.engines",
    "kbj.reports",
    "kbj.services.api",
    "kbj.services.collectors",
    "kbj.services.engine",
    "kbj.services.notifier",
    "kbj.services.ops",
    "kbj.services.scheduler",
    "kbj.services.ws_gateway",
    "kbj.services.runtime",
]
forbidden_modules = ["kbj.services.auth"]

# ⑤ 도 간접 import 까지 막는다(기본값). 예외는 notifier 의 공용 shim(client)·대기열(outbox)이 telegram_api 의
# Attachment 자료형(HTTP 없음)만 가져오는 두 줄뿐이다(ignore_imports) — scheduler 등이 shim 으로 알림을 넣는 것은
# 허용, notifier.service·__main__(발송 루프)를 거쳐 텔레그램 HTTP 를 끌어오는 것은 실패. Attachment 가
# telegram_api 밖(HTTP 없는 모듈)으로 옮겨지면 ignore_imports 두 줄을 지운다(묶음 E 요청)
[[tool.importlinter.contracts]]
name = "⑤ 텔레그램 HTTP(kbj.services.notifier.telegram_api)는 notifier 안에서만"
type = "forbidden"
source_modules = [
    "kbj.core",
    "kbj.config",
    "kbj.data",
    "kbj.store",
    "kbj.engines",
    "kbj.reports",
    "kbj.services.api",
    "kbj.services.auth",
    "kbj.services.collectors",
    "kbj.services.engine",
    "kbj.services.ops",
    "kbj.services.scheduler",
    "kbj.services.ws_gateway",
    "kbj.services.runtime",
]
forbidden_modules = ["kbj.services.notifier.telegram_api"]
ignore_imports = [
    "kbj.services.notifier.client -> kbj.services.notifier.telegram_api",
    "kbj.services.notifier.outbox -> kbj.services.notifier.telegram_api",
]

[[tool.importlinter.contracts]]
name = "⑥ 어댑터(kbj.data)는 서비스·엔진·리포트를 모른다"
type = "forbidden"
source_modules = ["kbj.data"]
forbidden_modules = ["kbj.services", "kbj.engines", "kbj.reports"]

[[tool.importlinter.contracts]]
name = "⑦ 저장소(kbj.store)는 어댑터·서비스·엔진을 모른다"
type = "forbidden"
source_modules = ["kbj.store"]
forbidden_modules = ["kbj.data", "kbj.services", "kbj.engines"]
