# 계층: 장 12 × (HS2 1 + HS4 2 + HS6 4 + HS10 4) + 850110 의 HS10 하나 더 = 133 / 달
counts:
  hs_dim: 133
  items: 7978            # 133 × 60 − 결측 2행(390120·3901200000, 2026-06)
  countries: 2400        # 40 × 60
  item_countries: 14400  # HS4 24 × 상위 10개국 × 60
  ten_day: 15884         # (120개월 × 3구간 + 2026-12 1구간) × 11열 × 4종
  ten_day_columns: 45    # 4종 × 11열 + 바뀐 이름 1
  stocks: 80
  watchlist: 50
  map_public_stocks: 30
  map_local_stocks: 3

