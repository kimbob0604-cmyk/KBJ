# 합성 20종목 세계(p4_world.py)의 기대 행렬 — 페이지 8 라우트 14개 × 20종목(docs/p4_design.md §8.4)
#
# 이 파일은 묶음 M 의 [제안]이었고 웨이브 3(묶음 S)이 완료 시험(tests/acceptance)으로 확정했다. 처리기(F·E·R·K·V)·API(A)의 동작이 정해지며 칸이 바뀌면 S·A 가 M 에게
# 고칠 칸을 요청한다(설계 §1.13 — p4_world·p4_expect 는 M 담당). 숫자 칸(손계산)은
# tests/unit/fixtures/test_p4_world.py 가 world.expect_*() 와 같은지 본다.
#
# 상태 값
#   ok            200, 봉투 검증 통과(적용 가능 칸이면 applicable=true)
#   na:<사유>     200, data.applicable=false, data.na_reason=<NaReason> — 값 칸 null(0 으로 채우지 않음)
#   no_data       404, code=no_data("아직 없음 — <작업> <예정 시각>")
#   ok:PER·ok:PBR 시나리오 method(200)
# valuation 은 칸마다: current(전 거래일 현재 배수)·band(5년 밴드 — 1,240거래일, 유효 250일 미만은
# short_history). scenario 의 na:<사유> 는 method=INSUFFICIENT. case = §8.4 표 번호(= WorldStock.no —
# 키 이름 'no' 는 YAML 1.1 에서 false 로 읽혀 쓰지 않는다).
#
# 사유 우선순위 [제안 — V·A 와 맞출 것]: currency_mismatch > no_filings > spac > financial_sector >
#   not_detail_tier > short_history > loss·capital_impairment·no_revenue > missing_input
#   (#5 스팩은 KSIC 64999 라 금융업이기도 하다 — spac 이 먼저. 반기 보고만 하는 리츠·코넥스는 분기
#   차분이 derived(None)라 TTM 이 없다 → missing_input.)
