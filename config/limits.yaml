# 출처별 호출 한도 — 비밀 아님(docs/secrets.md: 튜닝값은 환경변수가 아니라 config/*.yaml).
# 해석기는 kbj/data/limits.py 하나(모르는 키는 오류). 근거: docs/p2_design.md §4.2·§4.3, docs/probe_results.md.
#
# 초당 리미터(GCRA, kbj/data/ratelimit.py): 버킷(capacity) 1 → 어떤 반열린 1초 창에도 ceil(rate) 건 이하.
# 한도초과 신호(on_rate_limited) → 속도 반감(floor_rate 하한)·hold_s 유지·step_s 마다 +step_rate 회복.
# 일 예산(kbj/data/budget.py): KST 날짜별 Redis 카운터. 상한이면 부르지 않는다(세지 않음), 실패한 호출도 센다.
# Redis 키: rl:<출처>:<해시>, krx:calls:<YYYYMMDD>, budget:<출처>[:<범위>]:<YYYYMMDD>(kbj/store/redis_keys.py).
version: 1

# KIS 앱키 하나(rl:kis:<앱키 해시> — legacy GX 와 같은 버킷). 실측 무오류 5/s 의 80%(GX probe #10).
# 일 한도 미공표 → 예산 없음. EGW00201 → 반감(하한 1.0)·60초 유지·60초마다 +0.5.
kis:
  rate: 4.0
  capacity: 1
  floor_rate: 1.0
  hold_s: 60
  step_rate: 0.5
  step_s: 60
  tr_min_interval_s: {FHPIF05030100: 1.0}   # 전광판 콜/풋 1초 1건(GX PLAN §2.5)
  default_priority: P2
  # 역할 → 우선순위(설계 §4.2 [제안], conflict_map §1.2). 높은 등급이 기다리면 낮은 등급은 못 받는다
  priorities:
    auth_issue: P0              # 접근토큰·접속키 발급 요청(services.auth)
    ws_reconnect_snapshot: P0   # 웹소켓 재연결 뒤 복구 스냅샷(legacy GX → P7)
    gex_board: P1               # GX 전광판(legacy GX poller)
    gex_investor: P2            # GX 투자자별
    command_reply: P2           # 텔레그램 명령 /가격 (KIS:quote_on_demand)
    close_collect: P3           # 장마감 수집 market.close_collect
    legacy_bridge: P3           # legacy 논리 URL 브리지 기본값(헤더 x-kbj-priority 로 바꿈)
    backfill: P4                # 백필
    minute_load: P4             # 분봉 적재
    # P5 F2(docs/p5_design.md §3.4, R5) — 분 수집이 10분 슬롯·스캔보다 먼저
    market_minute: P2           # flows.market_minute(장중 투자자 1분 — FHPTJ04030000)
    program_intraday: P2        # program.intraday(시장 프로그램 1분)
    program_scan: P3            # program.stock_scan(종목 프로그램 10분 — 거래대금 상위 N + 관심종목)
    program_sweep: P4           # program.stock_sweep(18:10 전 종목 훑기 — 이어 받기)
  # 하루 KIS 호출 합의 상한 [제안 30,000 — docs/p5_design.md §3.4]. 실행 중에는 막지 않는다(KIS 일 한도 미공표) —
  # 등록부 시험(tests/unit/scheduler/test_registry_validation.py)이 작업별 추정 호출 합이 이 값 이하인지 본다.
  daily_soft_cap: 30000

# KRX OpenAPI(rl:krx:<키 해시> + krx:calls:<날짜>). 초당 한도 공표 없음 → 2/s [추정].
# 일 상한: KRX 10,000/일(GX #16)의 80% = 8,000 [확인 필요 — 메인 결정 D5, 실측 체크리스트 probe_results.md §7].
# 백필은 그 안에서 최대 5,000. GX 기본 200 은 파생 2건 기준이라 주식·지수·ETP 에 모자란다(R9).
krx:
  rate: 2.0
  floor_rate: 1.0
  step_rate: 0.5
  daily_cap: 8000
  backfill_cap: 5000

# OpenDART(rl:dart:<키 해시> + budget:dart:<날짜>). dart-report 0.12초 스로틀 ≈ 8/s.
# 일 20,000건의 90%. `020`(요청 제한 초과) → 그날 예산 닫기, `013` → 빈 결과.
# 백필(P4 fin.backfill — 재무 5년)은 그 안에서 최대 8,000 [제안 — docs/p4_design.md §3.5](budget:dart:backfill:<날짜>,
# DartClient.from_settings(backfill=True)). 평일 보통 약 1,400·시즌 최대 약 4,200 + 백필 8,000 < 18,000.
dart:
  rate: 8.0
  floor_rate: 2.0
  step_rate: 2.0
  daily_cap: 18000
  backfill_cap: 8000

# 공공데이터포털(rl:datago:<데이터셋 해시> + budget:datago:<데이터셋 ID>:<날짜>) — 데이터셋마다 따로.
# 문서 30 tps 의 약 80%, 개발계정 10,000/일의 95%(probe_results.md §1).
# GW `22` → 그 데이터셋 그날 닫기, `23` → 감속, `30`·`31` → critical(키), `05` → 재시도.
datago:
  rate: 25.0
  floor_rate: 5.0
  step_rate: 5.0
  daily_cap_per_dataset: 9500

# KOSIS(rl:kosis:<키 해시>). 180/분 < 200/분(probe_results.md F8·§5.3). 일 한도 미공표 [확인 필요].
kosis:
  rate: 3.0
  floor_rate: 1.0
  step_rate: 0.5

# ECOS(rl:ecos:<키 해시>). 한도 미공표 → 2/s [추정]. `602` → 반감·10분 유지, 같은 날 3회면 그날 닫기 [제안].
# `400`(60초 타임아웃) → 기간을 나눠 다시, `INFO-200` → 빈 결과(오류 아님) — probe_results.md §4.1.
ecos:
  rate: 2.0
  floor_rate: 1.0
  hold_s: 600
  step_rate: 0.5
  close_after_throttles: 3

# 텔레그램 봇(rl:telegram:<봇 토큰 해시>) — notifier 만 부른다. 전체 25/s, 대화당 1/s(그룹 20/분).
# 429 retry_after 를 따라 최대 4회(bok send-telegram.js:34). 값은 Telegram Bot FAQ [추정 — 레포 근거 없음].
telegram:
  rate: 25.0
  floor_rate: 5.0
  step_rate: 5.0
  per_chat_rate: 1.0
  retry_after_max: 4

# ETF 운용사 PDF(운용사 9곳 — kbj/data/private/etf_issuers, 작업 etf.collect — P3 로 당김 D-P3-12).
# 운용사 호스트마다 scoped 리미터(rl:etf_issuers:<호스트 해시> — RedisRateLimiter.scoped) 1/s [제안].
# ET 는 동시 6건(WORKERS — "운용사 서버 배려해서 6 이하")이었다. 일 한도 공표 없음 → 예산 없음.
etf_issuers:
  rate: 1.0

# ── P5(docs/p5_design.md §3.5 [제안] — 실측 #43~#48 로 확정) ────────────────────────────────────
# FRED(rl:fred:<키 해시>) — 공표 한도 분당 120 [확인 필요]의 약 100%가 아니라 2/s 상한. 시리즈 약 40 +
# 발표일 1 + 저작권 약 6/일. 공개(gov_series·release_dates)·로그인(restricted_series)이 같은 키라 버킷 하나.
fred:
  rate: 2.0
  floor_rate: 0.5
  step_rate: 0.5

# 미 재무부 수익률 곡선·뉴욕연은 SOFR·EFFR — 키 없음, 하루 1~3건 [제안].
treasury:
  rate: 1.0
nyfed:
  rate: 1.0

# Yahoo chart(로그인 — 약관상) — 매크로 12종 + 미국 지수 약 6 + 상단 띠 '한국 대 글로벌'. 429 → 반감.
yahoo:
  rate: 1.0
  floor_rate: 0.2
  hold_s: 300
  step_rate: 0.2

# ForexFactory 비공식 피드(로그인 — 기본 꺼짐 config/macro.yaml ff.enabled, §10 Q3). 하루 1건.
ff:
  rate: 0.2
  floor_rate: 0.1
  step_rate: 0.1

# Nasdaq screener·history(로그인 — 약관 [확인 필요 §10 Q6]). 일봉 약 1,700/일(ET 유니버스 실측 1,719).
# ET config/us.yaml workers 4 보다 낮게 2/s [제안].
nasdaq:
  rate: 2.0
  floor_rate: 0.5
  hold_s: 300
  step_rate: 0.5

# Stooq CSV(로그인 — Nasdaq 실패 종목 폴백만). 빈 본문(HTTP 200) 이 한도 신호일 수 있다(ET D-077).
stooq:
  rate: 1.0
  floor_rate: 0.2
  hold_s: 300
  step_rate: 0.2
