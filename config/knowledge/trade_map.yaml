# 종목↔HS 매핑표(공개 — 자체 큐레이션, docs/p10_trade_stocks_plan.md 단계 2·docs/p6_design.md §4.5, metrics §28).
# 판 2(2026-10-21 — 사용자 결정: 300종목, 나쁜양파 '종목별 흐름' 단위). 해석기 kbj/config/trade.py.
#
# **전부 초안(reviewed: false)** — 회사별 주요 제품·사업장 소재지를 공개 정보로 추려 적었다. 가중치(매출 중 그 흐름의
# 몫)와 HS 소호(6자리)는 추정이다. 사업보고서(DART)로 확인한 종목은 근거에 접수번호를 채우고 reviewed: true 로 바꾼다.
# 상관 검증(종목 수출 지수 vs 분기 매출 — 페이지 8 겹쳐 보기)이 낮은 흐름은 '업황 혼합'으로 읽는다.
#
# 형식(한 종목): code·name·reviewed·flows·evidence. 흐름(flow) 하나:
#   id(종목 안 유일, 소문자) · name(화면 제목) · kind(national 전국 품목 | sigungu 사업장 시군구 × HS6)
#   · nature(company 회사 출하 | mixed 업황 혼합 | affiliate 관계사·자회사 물량) · direction(exp 기본 | imp)
#   · regions(sigungu — trade_regions.yaml 통합 ID) · partners(national — 상대국 ISO2, 비면 전세계)
#   · products[{hs, name, weight}] · basis(선정 근거 — 자체 요약 문장, 원문 복사 아님)
# 규칙: 종목별 가중치 합 ≤ 1, 같은 (HS·방향·시군구) 줄 중복 금지, 시군구 흐름은 수출·HS6 만. 관심종목 전용 매핑은
# 여기 넣지 않는다(VM local 파일 — trade.yaml map.local_file). 관세청 조회코드표 원본은 레포에 넣지 않는다.
