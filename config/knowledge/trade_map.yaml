# 종목↔HS 매핑표(공개 — 자체 큐레이션, docs/p6_design.md §4.5·D-P6-14, metrics §28). 해석기 kbj/config/trade.py.
# 첫 판(웨이브 2 MAP — 사용자 결정 2026-10-13 Q7: reviewed: false 로 출시). 수출 비중이 사업보고서에 적히는
# 업종(반도체·자동차·조선·전력기기·화장품·라면·방산·이차전지·석유화학·철강 등)에서 자체로 고른 61종목.
# **가중치는 초안이다** — 사람이 사업보고서 매출 구성으로 검토한 뒤 reviewed: true 로 바꾼다. 근거의 접수번호(rcept_no)는
# 검토 때 채운다 [확인 필요]. HS 는 업종 대표 HS4(일부 HS6)이고 실데이터 대조는 verify_trade [실측 필요 #56].
#
# 형식(한 종목):
#   - code: "000000"          # 6자리 영숫자
#     name: 종목 이름
#     reviewed: false          # 사람이 가중치·근거를 검토했는가
#     items:                   # 품목 행 — hs 는 2~10 짝수 자리 접두, flow exp·imp, weight 0~1
#       - {hs: "854232", flow: exp, weight: 0.55, countries: [CN, US]}   # countries 비면 전 국가
#     regions:                 # 지역 행 — trade_regions.yaml 의 통합 ID × HS6
#       - {region_id: "KR-41-xxx", hs6: "330499", weight: 0.3}
#     evidence:                # 근거 1개 이상 — DART 접수번호 + 자체 문장 요약(원문 복사 아님)
#       - {kind: dart_business_report, rcept_no: "<14자리>", note: "매출 구성 요약"}
# 규칙: 종목별 가중치 합 ≤ 1, 같은 품목·지역 행 중복 금지. 관심종목은 여기 넣지 않는다(공개판이 관심종목을
# 드러내지 않게 — R9). 관심종목 전용은 VM local 파일(trade.yaml map.local_file).
# 관세청 조회코드표 원본은 레포에 넣지 않는다.
