  # 광·네트워크 묶음은 us_overrides.yaml 의 종목별 지정으로만 만든다.
  "Telecommunications Equipment": "통신장비"
  "Major Pharmaceuticals": "제약"
  "Biotechnology: Biological Products (No Diagnostic Substances)": "바이오"
  "Biotechnology: Pharmaceutical Preparations": "바이오"
