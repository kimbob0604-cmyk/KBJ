# 미국장 1층 섹터 — 국장 48섹터와 같은 자리의 분류다.
#
# 원천은 나스닥 스크리너가 주는 `sector`(12개)와 `industry`(150개 남짓) 두 열이다.
# sector 만 쓰면 'Technology' 하나에 소프트웨어·반도체·하드웨어가 뭉쳐 표의
# 해상도가 안 나오고(국장에서 '철강금속' 이 그랬다), industry 만 쓰면 150줄짜리
# 표가 된다. 그래서 industry 를 규칙으로 묶어 18개 자체 섹터를 만든다.
#
# 규칙은 **결정론적이다.** LLM 을 부르지 않는다 — 같은 입력이면 늘 같은 섹터가
# 나와야 어제 표와 오늘 표를 비교할 수 있다 (CLAUDE.md 2장 3번).
# 매칭 순서는 위에서 아래다. 먼저 걸리는 규칙이 이긴다.
#
# 매핑되지 않은 종목은 '미분류' 로 남기고 그 수를 배너에 노출한다.
# 손으로 고친 종목별 배정은 us_overrides.yaml 에 적는다 — 규칙이 덮지 않는다.

meta:
  version: "0.1"
  taxonomy: "us18"
  unmapped: "미분류"

# any: industry 문자열에 이 조각이 들어 있으면 해당 섹터 (대소문자 무시)
# sector: 위에서 안 걸렸을 때 나스닥 sector 열로 떨어뜨리는 폴백
sectors:
  - name: 반도체
    any: ["semiconductor", "semi-conductor", "integrated circuit"]
  - name: 소프트웨어·인터넷
    any: ["computer software", "prepackaged software", "edp services",
          "programming, data processing", "internet", "computer services",
          "advertising", "package software"]
  - name: IT 하드웨어
    any: ["computer manufacturing", "computer peripheral", "electronic components",
          "computer communications equipment", "office equipment",
          "industrial machinery/components: electronic",
          "consumer electronics", "electrical products"]
  - name: 통신
    any: ["telecommunications equipment", "telecommunication", "wireless",
          "radio and television broadcasting and communications equipment",
          "cable & other pay television", "specialty telecommunications"]
  - name: 헬스케어
    any: ["pharmaceutical", "biotechnology", "medical", "health", "hospital",
          "ophthalmic goods", "industrial specialties: medical",
          "diagnostic", "dental"]
  - name: 운송
    any: ["marine transportation", "trucking", "air freight", "airline",
          "railroad", "transportation services", "oil refining/marketing: marine",
          "shipping"]
  - name: 보험
    any: ["insurance", "insurers", "property-casualty", "life insurance",
          "accident &health insurance", "specialty insurers"]
  - name: 금융
    any: ["bank", "savings institution", "finance", "investment manager",
          "investment bankers", "broker", "credit", "asset management",
          "blank check", "financial conglomerate"]
  - name: 부동산
    any: ["real estate", "reit", "property"]
  - name: 에너지
    any: ["oil & gas", "oil/gas", "petroleum", "coal mining", "natural gas",
          "oilfield services", "integrated oil", "oil refining"]
  - name: 유틸리티
    any: ["electric utilities", "power generation", "water supply",
          "natural gas distribution", "environmental services"]
  - name: 소재
    any: ["major chemicals", "chemical", "steel", "iron ore", "precious metals",
          "metal fabrications", "mining", "aluminum", "paper", "forest products",
          "containers/packaging"]
  - name: 건설·인프라
    any: ["homebuilding", "engineering & construction", "building products",
          "building materials", "construction", "cement", "architecture"]
  - name: 산업재
    any: ["industrial machinery", "military", "ordnance", "aerospace", "defense",
          "auto parts", "motor vehicles", "capital goods", "pollution control",
          "diversified commercial services", "professional services",
          "industrial specialties", "wholesale distributors", "containers",
          "engine", "turbine", "electrical equipment"]
  - name: 필수소비재
    any: ["packaged foods", "beverages", "food distributors", "food chains",
          "farming", "agricultural", "tobacco", "household products",
          "consumer specialties", "meat/poultry", "beer"]
  - name: 미디어·엔터
    any: ["broadcasting", "movies", "entertainment", "publishing", "newspapers",
          "recreational products", "casino", "hotels/resorts", "services-misc. amusement"]
  - name: 복합기업
    any: ["multi-sector"]
  - name: 소비재
    any: ["retail", "apparel", "shoe", "consumer durables", "restaurants",
          "department stores", "catalog/specialty distribution", "home furnishings",
          "leisure", "specialty chemicals: consumer", "other consumer"]

# 위 규칙에 안 걸렸을 때. 스크리너 sector 열을 그대로 떨어뜨린다.
sector_fallback:
  Technology: 소프트웨어·인터넷
  "Health Care": 헬스케어
  Finance: 금융
  "Consumer Discretionary": 소비재
  "Consumer Staples": 필수소비재
  "Consumer Services": 소비재
  "Consumer Durables": 소비재
  "Consumer Non-Durables": 필수소비재
  Energy: 에너지
  Industrials: 산업재
  "Capital Goods": 산업재
  "Basic Materials": 소재
  "Basic Industries": 소재
  "Real Estate": 부동산
  Telecommunications: 통신
  "Public Utilities": 유틸리티
  Utilities: 유틸리티
  Transportation: 운송
  Miscellaneous: 미분류

# 위 둘로도 안 걸렸을 때 마지막으로 **회사 이름**을 본다.
#
# 스크리너는 적지 않은 종목의 sector·industry 를 **비워서** 보낸다(run #3 에서
# 유니버스 밖까지 합쳐 149종목). 그 행은 위 규칙으로는 영원히 안 풀린다.
# 이름은 남아 있고, 미국 상장사 이름은 업종을 꽤 정직하게 말한다 —
# 'Bancorp' 는 은행이고 'Therapeutics' 는 신약이다.
#
# **이건 약한 신호다.** 그래서 순서가 마지막이고, 이 경로로 배정된 종목은
# sector_src='name' 으로 표시되어 화면·진단에서 구분된다. 여기서도 못 풀면
# '미분류' 로 남긴다 — 이름이 안 알려 주는 것을 지어내지 않는다.
#
# 낱말은 **겹치지 않게** 고른다. 'Technologies'·'Group'·'Holdings' 처럼 업종을
# 가리지 않는 말은 넣지 않는다. 앞에서부터 먼저 걸리는 규칙이 이긴다.
name_rules:
  - name: 헬스케어
    any: ["therapeutic", "pharmaceutic", " pharma", "biosciences", "bioscience",
          "biotech", "oncolog", "medicines", "medical", "health", "diagnost",
          "genomic", "laborator", "surgical", "dental", "hospital", "biopharma"]
  - name: 반도체
    any: ["semiconductor", "microelectronic", "photonics"]
  - name: 보험
    any: ["insurance", "assurance", "casualty", "underwriter", "reinsurance"]
  - name: 금융
    any: ["bancorp", "bancshares", " bank", "savings financial", "capital corp",
          "asset management", "financial corp", "financial group", "securities",
          "credit corp", "lending", "mortgage"]
  - name: 부동산
    any: ["realty", "properties", "real estate", " reit", "residential trust"]
  - name: 에너지
    any: ["petroleum", " oil", "midstream", "energy corp", "energy inc",
          "drilling", "offshore energy", "natural gas"]
  - name: 유틸리티
    any: ["electric power", " utilities", "water works", "energy utility"]
  - name: 소재
    any: ["mining", "gold corp", "silver corp", "copper", "lithium", "steel",
          "chemical", "materials corp", "resources ltd"]
  - name: 운송
    any: ["airlines", "shipping", "ship lease", "shipholding", "tankers",
          "maritime", " marine", "logistics", "freight", "railway", "railroad",
          "transport"]
  - name: 건설·인프라
    any: ["homes inc", "homebuild", "construction", "builders", "infrastructure"]
  - name: 소프트웨어·인터넷
    any: ["software", "cybersecurity", "cloud inc", "digital media", "internet"]
  - name: 소비재
    any: ["restaurant", "retail", " stores", "apparel", "footwear", "brands inc"]
  - name: 필수소비재
    any: ["beverage", "foods inc", "food corp", "grocery", "tobacco"]

# ⑧ 등락 상위가 묶는 2층 산업 라벨. 스크리너 industry 문자열을 사람이 읽는
# 이름으로 줄인다. 없으면 원문 그대로 쓴다 — 지어내지 않는다.
industry_label:
  "Computer Software: Prepackaged Software": "Software"
  "Computer Software: Programming, Data Processing": "Internet Software"
  # 실데이터에는 쉼표가 없다(run #2). 두 표기를 모두 둔다.
  "Computer Software: Programming Data Processing": "Internet Software"
  "Integrated oil Companies": "석유메이저"
  "Radio And Television Broadcasting And Communications Equipment": "무선통신 장비"
  "Multi-Sector Companies": "복합기업"
  "Oil Refining/Marketing": "정유"
  "Finance: Consumer Services": "소비자금융"
  "Ordnance And Accessories": "방산"
  "Retail-Auto Dealers and Gas Stations": "자동차 소매"
