# 테마 사전 초안 v0.1
# 에프엔가이드 섹터분류 미사용. KRX 업종분류(1층) 위에 얹는 자체 테마(2층).
# seeds는 매핑 부트스트랩의 시드일 뿐 확정 구성종목이 아님. 전 종목 매핑은
# DART 사업의 내용 기반 배치 분류 + 상위 800종목 수동 검수로 채운다.
# 종목코드는 미기재. 부트스트랩 단계에서 종목명 → 코드 정규화 후 채운다.

meta:
  version: "0.1"
  krx_sector_source: "KRX 업종분류 현황"
  mapping_cardinality: "다대다 (한 종목이 복수 테마 소속 가능)"
  unmapped_bucket: "미분류 — 일간 리포트에 노출, 수동 회수"
  confidence_field: "각 매핑에 0~1 신뢰도. 0.7 미만은 서술 프롬프트에서 제외"

# ─────────────────────────────────────────────────────────────
# 축 유형 정의. 탐지기가 이 값으로 분기한다.
# ─────────────────────────────────────────────────────────────
axes:
  project_chain:
    label: "프로젝트 밸류체인"
    stages: [설계, PM, 주기기, 기자재, 정비, EPC]
    diffusion: "후단 단계 신규 진입 = 자금 확산"
    detectors: [valuechain_diffusion, proximity_cluster]

  supply_chain:
    label: "공급망 단계"
    stages: [소재, 부품, 장비, 세트]
    diffusion: "전방 캡엑스 → 후방 장비 전이"
    detectors: [valuechain_diffusion, proximity_cluster]

  development_stage:
    label: "개발 단계"
    stages: [전임상, 임상1, 임상2, 임상3, 허가, 상업화]
    diffusion: "단계 확산 아님. 모달리티·적응증 확산으로 판정"
    detectors: [modality_spread]

  channel_brand:
    label: "채널·브랜드"
    stages: [원료, ODM, 브랜드, 유통]
    diffusion: "원료·ODM 쏠림 vs 브랜드 확산 구분이 핵심"
    detectors: [valuechain_diffusion]

  regulated_yield:
    label: "요금·규제"
    stages: []
    diffusion: "단계 없음. 금리·정책·환율 뉴스 매칭으로 대체"
    detectors: [policy_match, rate_sensitivity]

  cycle_spread:
    label: "운임·사이클"
    stages: [지수, 사업자, 기자재]
    diffusion: "외부 지수 방향과 종목 방향의 일치 여부를 본다"
    external_index_required: true
    detectors: [index_divergence, opposite_reaction]

  platform_ip:
    label: "플랫폼·IP"
    stages: [IP, 제작, 플랫폼, 광고]
    diffusion: "수익 배분이 제작사 쪽인지 플랫폼 쪽인지"
    detectors: [valuechain_diffusion]

  order_downstream:
    label: "수주·전방"
    stages: [전방, 부품, 완성]
    diffusion: "전방 이벤트가 부품사로 낙수되는지"
    detectors: [valuechain_diffusion, event_spillover]

# ─────────────────────────────────────────────────────────────
# ── 상장돼 있지 않은 시드 ────────────────────────────────────
# seeds 에 남겨 두되 "왜 안 붙는지" 를 여기 적는다. 지우면 밸류체인 기록이
# 틀려지고(세메스 없는 반도체 전공정은 그 자체로 오류다), 그냥 두면 매일
# '시드 N건 미해결' 로 세어져 진짜 오타·사명변경이 그 숫자에 묻힌다.
#
# 여기 적힌 이름은 화면의 '빠진 데이터' 에서 빠진다. 목록에 없는 미해결 시드는
# 이름과 함께 매일 노출된다 — 그때 이 표에 추가하거나 seeds 를 고친다.
unlisted:
  세메스: 삼성전자 자회사. 비상장
  삼성디스플레이: 삼성전자 자회사. 비상장
  SK온: SK이노베이션 자회사. 비상장 (2026-08 기준)
  토스뱅크: 비바리퍼블리카 자회사. 비상장
  앰코: Amkor Technology. 미국 나스닥 상장이고 국내 미상장

# ─────────────────────────────────────────────────────────────────────────────
# 사명 변경 표 — 옛 시드 이름 → 지금 상장 마스터에 있는 이름
#
# 시드 이름을 직접 고치지 않는다. 옛 이름은 밸류체인 기록의 일부이고, 근거를
# 함께 남겨야 나중에 검증할 수 있다. 매일 `theme_seeds_unresolved` 에 뜨던
# 이름을 여기로 옮기면 그 줄에서 빠진다.
#
# **넣을 자격은 하나다 — 상장 마스터가 증명해야 한다.** 아래는 전부 마스터의
# 현재 이름이 옛 이름을 통째로 담고 있어(접두 브랜드가 붙은 형태) 같은 회사임이
# 데이터로 보이는 것들이다. 2026-09-03 `--diagnose-banner` 실측으로 확인했다.
#
# 기억에 기대 넣지 않는다. 같은 날 089970 을 '에이피티씨' 로 알고 물었더니
# 마스터가 '브이엠' 이라고 답했다. 기억은 후보를 낼 뿐이고 판정은 마스터가 한다.
# 확신이 없으면 비워 두고 미해결로 남긴다 — 틀린 매핑은 빈칸보다 나쁘다.
renames:
  한국조선해양: HD한국조선해양      # 009540 — 옛 이름이 통째로 들어 있다
  금호석유: 금호석유화학            # 011780 — 시드가 약칭이었다
  나스미디어: KT나스미디어          # 089600 — KT 접두가 붙었다
  티라유텍: LS티라유텍              # 322180 — LS 접두가 붙었다
  파수: 파수AI                     # 150900 — AI 접미가 붙었다
  만도: HL만도                     # 204320 — HL 접두가 붙었다
  효성첨단소재: HS효성첨단소재       # 298050 — HS 접두가 붙었다

