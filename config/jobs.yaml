    owner: "kbj.services.engine.trade_map:load"
    schedule: {cron: "35 7 * * *", when: always}
    retry: {max: 1, backoff_s: [600]}
    as_of: run_date
    writes: [pub_trade.stock_map]
    note: "종목↔HS 매핑표(공개 config/knowledge/trade_map.yaml + VM local — D-P6-14)를 판 단위로 통째로 바꾼다. 검증 실패면 실패(옛 판 유지 — 지우지 않는다). 외부 호출 없음"

  - name: trade.derive
    phase: P6
    enabled: true               # P6 웨이브 3(WRAP — D-P6-20)
    owner: "kbj.services.engine.trade:derive"
    schedule: {cron: "40 10,15 * * *", when: month_days, month_days: [14, 15, 16, 17, 18, 19, 20]}
    retry: {max: 1, backoff_s: [1200]}
    as_of: month
    depends_on: [{job: trade.customs_monthly, hard: true}]
    writes: [pub_trade.surge, pub_trade.item_group_monthly]
    note: "급등·급락(metrics §26)·104품목 묶음(§29) — pub_trade 월간만 읽는다(외부 호출 없음). 입력이 없으면 not_ready"

  - name: trade.stock_index
    phase: P6
    enabled: true               # P6 웨이브 3(WRAP — D-P6-20)
    owner: "kbj.services.engine.trade_map:stock_index"
    schedule: {cron: "0 21 * * *", when: always}
    retry: {max: 1, backoff_s: [1800]}
    as_of: run_date
    depends_on:
      - {job: trade.derive, hard: false}
      - {job: trade.map_load, hard: false}
      - {job: fin.quarterly, hard: false}
    writes: [pub_trade.stock_export]
    note: "종목 수출 지수·분기 YoY·매출 YoY 시차 상관(metrics §28) — stock_map·월간·시군구·pub_fin.quarterly 만 읽는다. 시세 칸 없음(로그인 종가 줄은 /api/stock/{code}/chart)"

  - name: market.fsc_daily
    phase: P5                 # D-P3-17 — KRX 대조 보조는 P5
    enabled: true               # 2026-10-18 로컬 운영에서 켬 — 키(ECOS·FRED·DATAGO)를 넣었고 빈 칸을 채우려는 사용자 요청
    owner: "kbj.services.collectors.fsc_daily:run"
    schedule: {cron: "10 13 * * 1-5", when: trading_day}
    retry: {max: 3, backoff_s: [1800]}
    collects:
      - {source: DATAGO, dataset: "15094808", as_of: prev_trading_day}
      - {source: DATAGO, dataset: "15094807", as_of: prev_trading_day}
    budget: datago
    writes: [prv_market.daily_bar]
    absorbs: ["ET:kr.yml:datago_daily"]
    note: "꺼짐(WRAP) — 막는 실측 #48(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 금융위 주식·지수 시세(로그인 — 공공누리 4유형). KRX 일별의 대조·보조 [제안]. D+1 13시 개방"

  - name: market_stats.kofia
    phase: P5
    enabled: true               # 2026-10-18 로컬 운영에서 켬 — 키(ECOS·FRED·DATAGO)를 넣었고 빈 칸을 채우려는 사용자 요청
    owner: "kbj.services.collectors.kofia:run"
    schedule: {cron: "30 13 * * 1-5", when: trading_day}
    retry: {max: 3, backoff_s: [1800]}
    collects:
      - {source: DATAGO, dataset: 15094809/credit, as_of: prev_trading_day}
      - {source: DATAGO, dataset: 15094809/capital, as_of: prev_trading_day}
      - {source: DATAGO, dataset: 15094809/fund, as_of: prev_trading_day}
      - {source: DATAGO, dataset: 15094809/cma, as_of: prev_trading_day}
    budget: datago
    writes: [pub_market_stats.credit_balance, pub_market_stats.market_capital,
             pub_market_stats.fund_nav, pub_market_stats.cma]
    note: "꺼짐(WRAP) — 막는 실측 #48(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 상단 띠 신용잔고·예탁금(신규). D+1 13시 개방(probe_results §3.1)"

  # ── 장중 ────────────────────────────────────────────────────────────────────────────────
  - name: filings.dart_feed
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.dart_feed:run"
    # DART 는 거래소 휴장일(12/31·근로자의 날)에도 접수한다 [확인 필요 #28] → when: always(평일 cron)
    schedule: {cron: "* 7-19 * * 1-5", when: always}
    retry: {max: 0}
    deadline_min: 5
    as_of: minute
    collects:
      - {source: DART, dataset: list, as_of: minute}
      # 아래는 전부 접수번호 이벤트(event) — 처리기가 claims 로 직접 선점(D-P4-25 ②)
      - {source: DART, dataset: document, as_of: event}
      - {source: DART, dataset: cvbdIsDecsn, as_of: event}
      - {source: DART, dataset: bdwtIsDecsn, as_of: event}
      - {source: DART, dataset: exbdIsDecsn, as_of: event}
      - {source: DART, dataset: piicDecsn, as_of: event}
      - {source: DART, dataset: fricDecsn, as_of: event}
      - {source: DART, dataset: tsstkAqDecsn, as_of: event}
      - {source: DART, dataset: tsstkDpDecsn, as_of: event}
      - {source: DART, dataset: elestock, as_of: event}
      - {source: DART, dataset: majorstock, as_of: event}
    budget: dart
    writes: [pub_filings.disclosure, pub_filings.earnings_prelim, pub_filings.overhang_event,
             pub_filings.overhang_adjust, pub_filings.insider_report, pub_filings.major_holder_report,
             pub_filings.buyback_event]
    absorbs: ["SD:dart_poll", "ET:board/ingest/dart.disclosures", "ET:triggers._dart"]
    note: "증분 목록(§4.1 — 이미 본 접수번호에서 멈춤, 07:00 첫 실행은 전 영업일 다시 훑기) + 새 접수번호의 구조화 API·원문 파싱(한 건 실패는 그 건만 parse_state failed — 다음 실행이 3회까지). 알림은 하지 않는다(일반 공시 push 없음 — D-P4-14, 관심종목 잠정실적 알림은 earnings.alerts)"

  - name: filings.company_profile
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.dart_company:run"
    schedule: {cron: "0 4 * * 6", when: always}
    retry: {max: 2, backoff_s: [1800]}
    deadline_min: 360
    collects:
      - {source: DART, dataset: company, as_of: run_date}
    budget: dart
    writes: [pub_filings.corp_profile]
    note: "기업개황(결산월 acc_mt·표준산업분류) — 종목마다 1건이라 실제 호출은 상장사 수(약 2,700)만큼이다 [확인 필요: 주 1회]. corp_code 표는 filings.corp_code 가 매일 갈아 넣으므로 따로(pub_filings.corp_profile)"

  - name: fin.quarterly
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.fin:quarterly"
    # triggered_by 는 지웠다(실행기에 구현이 없다 — D-P4-4). 정기보고서 접수(pub_filings.disclosure
    # kind=periodic, fin_loaded_at 없음)를 30분마다 DB 에서 본다(대기 상태 폴링)
    schedule: {cron: "*/30 7-21 * * *", when: always}
    retry: {max: 3, backoff_s: [1800]}
    as_of: minute                # 하루 여러 번 돈다 — 실행 as_of 하나에 한 번(D-P4-25 ①)
    collects:
      # 전부 event — 처리기가 claims 로 직접 선점(D-P4-25 ②). 키 모양은 카탈로그 notes
      - {source: DART, dataset: fnlttSinglAcntAll, as_of: event}
      - {source: DART, dataset: fnlttMultiAcnt, as_of: event}
      - {source: DART, dataset: stockTotqySttus, as_of: event}
      - {source: DART, dataset: hyslrSttus, as_of: event}
    budget: dart
    writes: [pub_fin.statement_raw, pub_fin.quarterly, pub_fin.ratio, pub_filings.share_count,
             pub_filings.largest_holder, pub_filings.disclosure]
    absorbs: ["SD:mac-crontab:dart_collector", "ET:board/ingest/financials", "ET:dart-report 수집부"]
    note: "재무 2층(D-P4-5): 상세 대상(관심종목 ∪ 컨센서스 유니버스 ∪ 공개 데모)은 전체 재무제표(CFS→OFS), 나머지는 07:30 뒤 첫 실행의 주요계정 묶음. statement_raw → normalize(to_quarterly 하나) → quarterly·ratio, 적재한 공시는 disclosure.fin_loaded_at"

  # ── P8 규칙 알림(docs/p8_design.md §0.4·§3.2 — 묶음 FND 가 모양, 웨이브 3 WRAP 이 셋을 켰다) ──────────
  # 켠 것: rules.close·rules.outcome·rules.backtest_nightly(외부 호출 없음 — 원장만) + rules.intraday(사용자 요청
  # 2026-10-14 — ADR 0031 §6). rules.intraday 의 TR 칸 이름·가집계 회차·순위 목록은 공식 KIS 예제로 확인했고, 남은
  # 확인(#65 단위·반영 지연, #66 목록 길이·금액 단위·회차 편차)은 장중 하루 실측이다.
  - name: rules.intraday
    phase: P8
    enabled: true               # 사용자 요청(2026-10-14 — ADR 0031 §6). 남은 확인 #65·#66 = 장중 하루 실측
    owner: "kbj.services.engine.rules:intraday"
    schedule: {equity: {start: open, end: close, every_min: 10}, when: trading_day}
    retry: {max: 0}
    deadline_min: 10
    # 장중 수급(사용자 결정 2026-10-13): 종목 가집계(KIS:inst_foreign_intraday — 쓰기 주인 flows.intraday,
    # prv_flows.investor_intraday)를 읽는다. 같은 회차 수집이 끝나기를 최대 5분 기다리고, 없으면 그 조건은
    # '판단 불가'(발송 없음)
    depends_on: [{job: flows.intraday, hard: false, wait_min: 5}]
    collects:
      - {source: KIS, dataset: watch_quotes_intraday, as_of: slot10m}
    writes: [prv_alerts.watch_quote_slot, prv_alerts.signal_intraday]
    notify: {kind: alert.rule}
    absorbs: ["SD:tg_custom_alerts", "SD:tg_watchlist", "SD:tg_trailing", "SD:price_sync_intraday",
              "SD:stage2_realtime_kr"]
    note: "D-P8-9·20 — 대상 = 관심종목 main ∪ 보유 ∪ 규칙 코드, 상한 60(config/rules.yaml intraday_max_codes — 넘으면 자르고 근거·health 에 '잘림'). 슬롯 시세를 저장해 장중 재생 백테스트가 같은 입력을 읽는다. 평가 = 전 거래일까지 확정 일봉 + 그 슬롯 부분 봉(FHKST01010100 실시간, quality estimated), 수급 조건은 가집계(FHPTJ04400000 순매수·순매도 상위 목록 — 공식 예제상 하루 4회 입력 외국인 09:30·11:20·13:20·14:30 / 기관 10:00·11:20·13:20·14:30 ±10분)의 확실히 들어온 가장 최근 회차 값만(근거 문구 '장중 잠정 13:20 회차', 회차 전·두 목록 밖 종목은 판단 불가 → 발송 없음). 사건 시점 발송(alert.rule — 쿨다운 상태기 + notifier 안전망). 남은 확인(장중 하루 실측): #65 FHKST01010100 단위·반영 지연, #66 목록 길이 N·금액 단위·회차 실제 편차"

  - name: rules.close
    phase: P8
    enabled: true               # P8 WRAP — 원장만(KIS 호출 없음), 16:00 한 통(ADR 0018)
    owner: "kbj.services.engine.rules:close"
    schedule: {cron: "0 16 * * 1-5", when: trading_day, catch_up_until: "20:30"}
    retry: {max: 0}
    depends_on: [{job: market.close_collect, hard: true}]
    writes: [prv_alerts.signal_close]
    notify: {kind: alert.rule_close}
    note: "D-P8-4 — 마감 규칙 평가(원장만 — KIS 호출 없음, 대상 상한 없음). 오늘 행은 KIS 마감 값(estimated 가능), 수급은 확정 원장으로 다시 판정(장중 잠정과 다르면 일치 감시가 data_revised). 발송은 16:00 한 통 묶음(alert.rule_close — ADR 0018, 0건이면 없음). SD 에 마감 규칙 평가가 없어 absorbs 없음"

  - name: rules.outcome
    phase: P8
    enabled: true               # P8 WRAP — KRX 확정 일봉만(비교 지수 코드 #67 [확인 필요] — 없으면 초과수익 빈칸)
    owner: "kbj.services.engine.rules_perf:outcome"
    schedule: {cron: "30 8 * * 1-5", when: trading_day}
    retry: {max: 2, backoff_s: [600, 1200]}
    depends_on: [{job: krx.daily, hard: true}]
    as_of: prev_trading_day
    writes: [prv_alerts.signal_outcome]
    note: "D-P8-12 — 알림 후 성과(기간 1·3·5·10·20 거래일 — config/rules.yaml horizons): KRX 확정 일봉(D+1 08:05)으로 ret·지수 초과·MFE·MAE. 정지·상폐·분할 의심은 사유를 적고 통계에서 뺀다. 발송 없음"

  - name: rules.backtest_nightly
    phase: P8
    enabled: true               # P8 WRAP — 원장만, 발송 없음
    owner: "kbj.services.engine.rules_perf:nightly"
    schedule: {cron: "45 8 * * 1-5", when: trading_day}
    retry: {max: 1, backoff_s: [900]}
    depends_on: [{job: rules.outcome, hard: true}]
    as_of: prev_trading_day
    writes: [prv_alerts.backtest_run, prv_alerts.backtest_signal, prv_alerts.match_check]
    note: "D-P8-14 — 켜진 규칙을 최근 20 거래일(match.window_days)에 다시 백테스트해 실시간 신호와 비교(입력 지문 같음 → logic = health 오류 → ops.watchdog, 다름 → data_revised), 3년(nightly.years) 요약을 backtest_run 에. 발송 없음"

  - name: flows.intraday
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.market_intraday:flows"
    schedule: {equity: {start: open, end: close, every_min: 10}, when: trading_day}
    retry: {max: 2, backoff_s: [20, 40]}      # D-P3-14 — 슬롯 안에서 재시도(장중 1시간 무결측)
    deadline_min: 9
    collects:
      - {source: KIS, dataset: inst_foreign_intraday, as_of: slot10m, venues: [KRX]}
      - {source: KIS, dataset: turnover_rank_intraday, as_of: slot10m, venues: [KRX]}
      - {source: KIS, dataset: etf_quote_intraday, as_of: slot10m}
    writes: [prv_flows.investor_intraday, prv_flows.stock_investor_daily,
             prv_market.turnover_rank_intraday, prv_market.stock_snapshot, prv_etf.quote_intraday]
    note: "D7 — 장중 외국인·기관 가집계·거래대금 순위·ETF 현재가(잠정, quality=estimated). 슬롯마다 *_intraday 이력 + 일별 원장 오늘 행(kis.prelim). 마감 뒤 확정치로 덮는다(D-P3-7)"

  - name: market.intraday
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.market_intraday:market"
    # close+10: 15:30 슬롯은 마감 동시호가 결과 전(15:30:00 에 받는다)이라 15:20 값이 남는다 —
    # 15:40 슬롯이 종가를 받는다(2026-10-20 코스피 5,539.05 로 남고 종가 5,552.74 를 못 받았다)
    schedule: {equity: {start: open, end: "close+10", every_min: 10}, when: trading_day}
    retry: {max: 2, backoff_s: [20, 40]}      # D-P3-14
    deadline_min: 9
    collects:
      - {source: KIS, dataset: index_quote_intraday, as_of: slot10m}
      - {source: KIS, dataset: sector_quote_intraday, as_of: slot10m}
    writes: [prv_market.index_intraday, prv_market.sector_intraday]
    note: "D-P3-14 신규 — 장중 지수 3·업종 목록 3(코스피 1·코스닥 소속 3·1)·코스닥 업종 한 건씩 최대 4. 페이지 1 지수 타일·업종 히트맵·장중 시장 거래대금(지수 기준, estimated)"

  # ── P5 F2 장중 투자자 수급·프로그램매매(docs/p5_flow_program_prompt.md §3.4, docs/p5_design.md §0.4·§3.4) ──
  # 1분 작업은 정규장 + 장 마감 단일가 15:40 까지(close+10). 빈 분은 채우지 않는다(보간 금지 — 행 없음).
  # 프로그램 TR 은 실측(#40·#41) 전이라 웨이브 3 에도 꺼진 채 남는다(D-P5-23). KIS 우선순위는 limits.yaml
  # kis.priorities(market_minute·program_intraday P2 · program_scan P3 · program_sweep P4).
  - name: flows.market_minute
    phase: P5
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): K2I 3조합만(GX 2026-09-28 실측) — 현물은 #39 전까지 꺼진 조합
    owner: "kbj.services.collectors.flows_minute:run"
    schedule: {equity: {start: open, end: "close+10", every_min: 1}, when: trading_day}
    retry: {max: 1, backoff_s: [15]}         # 슬롯 안에서 한 번만 — 슬롯 + 45초 넘으면 estimated(§3.4)
    deadline_min: 1
    as_of: minute
    collects:
      - {source: KIS, dataset: market_investor_intraday, as_of: minute}
    writes: [prv_gex.investor_flow]
    note: "ADR 0019 — prv_gex.investor_flow 의 유일한 쓰기 주인(D-P5-21). 조합은 config/markets.yaml flows.minute.pairs 의 켠 것만(실측 전 K2I F001·OC01·OP01 — 현물은 #39 뒤, 위클리 4조합은 P7 켬 — GX #13, 값은 markets.yaml). 대금 백만원(GX 단위 그대로). 같은 분 재실행 멱등(UNIQUE ts·시장·업종·투자자)"

  - name: program.intraday
    phase: P5
    enabled: true               # 2026-10-20 켬 — 사용자 요청 "꺼 둔 것도 전부 활성화"(실측 전 항목은 실패하면 운영 페이지 13에 사유가 남는다)
    owner: "kbj.services.collectors.program:intraday"
