    schedule: {cron: "*/5 7-20 * * 1-5", when: always}
    retry: {max: 0}
    deadline_min: 5
    as_of: minute                # 5분마다 — 실행 as_of 하나에 한 번(D-P4-25 ①)
    writes: [prv_fin.earnings_surprise]
    notify: {kind: alert.earnings}
    absorbs: ["SD:earnings_pipeline_5min"]
    note: "미처리 잠정실적(pub_filings.earnings_prelim 중 prv_fin.earnings_surprise 에 행 없음) → YoY 분류(+ 분기 컨센서스 있을 때 서프라이즈) → 기록 → 관심종목·우선순위 ≤ 2 면 alert.earnings(사건 시점 — 장 마감 뒤 사건도 바로, ADR 0018 의 16:00 대상 아님). 본문은 템플릿(LLM 없음). subject <corp_code>:<회계기간>:<연결/별도>(정정공시 재발송 없음)"

  - name: filings.derive
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.filings:derive"
    # 스케줄 cron 은 하나뿐 — 21:10·21:40 이 밤 마무리(초안의 + 21:30 대신, D-P4-25 ⑤)
    schedule: {cron: "10,40 7-21 * * *", when: always}
    retry: {max: 1, backoff_s: [300]}
    deadline_min: 25
    as_of: minute
    writes: [pub_filings.overhang_state, pub_filings.overhang_summary, pub_filings.insider_window,
             pub_filings.earnings_schedule, pub_filings.disclosure]
    note: "공개 파생(계약 ⑬ — 로그인 모듈 import 금지): 그날 바뀐 회사의 오버행 상태·요약·내부자 창(30·90·180일)·실적 일정·공시 키워드 점수(disclosure.kw_score)를 pub_filings 에. DB 만 — 수집 없음"

  - name: fin.backfill
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.fin:backfill"
    schedule: {manual: true}
    retry: {max: 2, backoff_s: [600]}
    deadline_min: 360
    backfill_of: [fin.quarterly]
    budget: dart
    writes: [pub_fin.statement_raw, pub_fin.quarterly, pub_fin.ratio, pub_filings.share_count,
             pub_filings.largest_holder]
    note: "python -m kbj.services.scheduler run-once fin.backfill --as-of <YYYY-MM-DDTHH:MM> — 시작 연도·층은 config/fin.yaml backfill(스케줄러 backfill 명령은 거래일 펼치기라 쓰지 않는다 — §0.4). 이미 받은 statement_raw 는 건너뛰어 여러 날에 나눠 돈다. DART 백필 상한 dart.backfill_cap(DartClient.from_settings(backfill=True), 우선순위 P4 — 장중 피드에 양보). run-once 는 fin.quarterly 의 데이터셋마다 <데이터셋>@<as_of> 실행 키를 하나씩 잡는다 — 처리기는 그 키(ctx.keys)를 collected 로 돌려준다"

  # ── 장중 운영 감시·수동 ─────────────────────────────────────────────────────────────────
  - name: ops.watchdog
    phase: P2
    enabled: true
    owner: "kbj.services.collectors.ops_watchdog:run"
    schedule: {cron: "*/5 * * * *", when: always}   # P9 WRAP(ADR 0037 §3) — 5분·매일 24시간
    retry: {max: 0}
    deadline_min: 10
    as_of: minute
    notify: {kind: ops.watchdog}
    absorbs: ["SD:data_watchdog", "ET:daily.yml 실패 curl(#37)", "GX health"]
    note: "마감 지난 실행·하트비트 끊긴 서비스·실패 작업 → ops.watchdog 알림(같은 공백 30분 — notify.yaml cooldown). P9: 지금 끊긴 상시 서비스를 ops.health_events heartbeat_gap 으로 남긴다(1주 판정 ① 입력 — 5분 간격이면 10분 넘는 끊김을 놓치지 않는다)"

  - name: market.backfill
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.krx_daily:backfill"
    schedule: {manual: true}
    retry: {max: 2, backoff_s: [600]}
    backfill_of: [krx.daily]
    budget: krx
    writes: [prv_market.daily_bar, prv_market.stock_snapshot, prv_market.universe, prv_etf.etf_daily,
             prv_etf.meta]
    absorbs: ["SD:mac-crontab:ohlcv_5y_collector"]
    note: "run-once --as-of <과거 날짜> 또는 backfill --from --to(§3.8) — krx.daily 와 같은 데이터 키(선점 공유). 백필 상한 krx.backfill_cap, 최근 날짜부터 과거로. ET 네이버 일봉 백필은 KRX 로 다시 받는다(U4 — 네이버 출처 옛 최고가는 옮기지 않는다, R8)"

  # ── P5 2차 묶음 IDX — 패시브 지수 정기변경(편입·편출) 예측(docs/p5_index_rebalance_prompt.md §3-4) ──
  # 외부 원천을 부르지 않는다(DB·설정만 — collects 없음). 알림 없음(ADR 0018 의 16:00 발송과 무관 — 결과
  # 발표일 알림은 P8 규칙 알림). 켜기는 메인 결정(꺼진 채 등록 — 단계별 켜진 표 ENABLED_BY_PHASE 는 공유 시험).
  - name: index.calendar
    phase: P5
    enabled: true               # 2026-10-20 켬 — 사용자 요청 "꺼 둔 것도 전부 활성화"(실측 전 항목은 실패하면 운영 페이지 13에 사유가 남는다)
    owner: "kbj.services.engine.index_review:calendar"
    schedule: {cron: "41 6 * * *", when: always}
    retry: {max: 1, backoff_s: [300]}
    as_of: run_date
    writes: [prv_index.review_calendar]
    note: "config/index_reviews.yaml reviews(사람이 적은 공표 일정표 — 계산 추정 금지, 대조 #51) → prv_index.review_calendar. confirmed=false 는 estimated. 사용자 컷오프(user_cutoff_won)는 덮지 않는다"

  - name: index.predict
    phase: P5
    enabled: true               # 2026-10-20 켬 — 사용자 요청 "꺼 둔 것도 전부 활성화"(실측 전 항목은 실패하면 운영 페이지 13에 사유가 남는다)
    owner: "kbj.services.engine.index_review:predict"
    schedule: {cron: "20 17 * * 1-5", when: trading_day}   # 16:00 발송 묶음 뒤(ADR 0018)
    retry: {max: 2, backoff_s: [600, 1800]}
    as_of: trade_date
    depends_on: [{job: market.close_collect, hard: true}]
    writes: [prv_index.prediction_run, prv_index.predictions, prv_index.passive_aum]
    note: "규칙 숫자 [확인 필요 #50·#52·#53]. 켜진 지수(MSCI Korea·KOSPI200·KOSDAQ150)마다 효력 전 첫 리뷰의 편입·편출·경계·유지 판정(metrics §24). 계산 날짜 = min(그날, 리뷰 기준일) — 기준일 뒤엔 기준일 값으로 고정. 구성종목 목록(prv_index.constituents — 사용자·보도자료, load-constituents CLI)이 없으면 no_constituents 한 줄만(예측하지 않는다). 지수 하나의 실패는 격리. 백테스트·목록 반영·컷오프 입력은 `python -m kbj.services.engine.index_review`"

  # ── P7 — 페이지 3 진단·GEX 알림·VKOSPI(docs/p7_design.md §0.4·§3.2) ───────────────────────────
  # 웨이브 1(FND-B)이 모양을 확정했고 웨이브 3(WRAP)이 diag.public·diag.daily·gex.alert 를 켰다(krx.vkospi 꺼짐). 공개 진단(diag.public)·로그인
  # 진단(diag.daily)은 모듈이 나뉜다(공개 작업은 로그인 원천·저장소를 모른다 — D-P7-15). 마감 뒤 새 발송은
  # 없다 — 진단·GEX 마감 줄은 16:00 brief.closing(무른 의존), 장중 레벨 알림만 gex.alert(ADR 0018, §10 Q5).
  - name: diag.public
    phase: P7
    enabled: true               # P7 WRAP(§1.7-1)
    owner: "kbj.services.engine.diag_pub:run"
    schedule: {cron: "40 8 * * 1-5", when: trading_day, catch_up_until: "10:00"}
    retry: {max: 2, backoff_s: [600]}
    as_of: trade_date
    depends_on:
      - {job: macro.morning, hard: false, wait_min: 20}
      - {job: market_stats.kofia, as_of: prev, hard: false}   # 13:30 공표 — 아침엔 직전 거래일 실행분
    writes: [pub_diag.indicator, pub_diag.gauge, pub_diag.event_marker]
    note: "공공지표 진단(metrics §D1~§D5·§D9) — 신용스프레드 구간·신용잔고·예탁금 추세·수출 모멘텀·금리 방향 → 매크로 위험 게이지, 이벤트 표시. 공개 표(pub_*)만 읽고 쓴다(D-P7-15 — 로그인 원천·저장소를 모른다). 외부 호출 없음. 금투협은 D+1 13시 공표라 아침엔 직전 실행분(전전 거래일 값 — 품질 규칙 §D2)"

  - name: diag.daily
    phase: P7
    enabled: true               # P7 WRAP(§1.7-1)
    owner: "kbj.services.engine.diag:run"
    schedule: {cron: "0 16 * * 1-5", when: trading_day}
    retry: {max: 1, backoff_s: [300]}
    as_of: trade_date
    depends_on:
      - {job: market.close_collect, hard: true}
      - {job: board.daily, hard: false, wait_min: 15}
    writes: [prv_diag.indicator, prv_diag.fear_greed, prv_diag.verdict]
    note: "시장 진단·국장 공포탐욕·종합 판정(metrics §D6~§D8). 그날 D 는 estimated, 직전 거래일 D−1 은 KRX 확정 원장으로 다시 계산해 ok 로 덮는다 — 확정용 두 번째 작업 없음(쓰기 주인 하나, D-P7-15). 발송하지 않는다 — brief.closing 이 무른 의존으로 기다린다(D-P7-16). 보드·마감 수집이 재료라 16:00 전으로 못 당긴다 — 보드 → 진단 → 마감 요약이 16:00 안에 도는 것은 실행기가 끝난 시도를 같은 회차에 거두어서(ADR 0030 §4-6)"

  - name: krx.vkospi
    phase: P7
    enabled: true               # 2026-10-20 켬 — 사용자 요청 "꺼 둔 것도 전부 활성화"(실측 전 항목은 실패하면 운영 페이지 13에 사유가 남는다)
    owner: "kbj.services.collectors.krx_vkospi:run"
    schedule: {cron: "10 8 * * 1-5", when: trading_day}
    retry: {every_s: 600, until: "10:00"}
    collects:
      - {source: KRX, dataset: idx/drvprod_dd_trd, as_of: prev_trading_day}
    budget: krx
    writes: [prv_diag.vol_index]
    note: "파생상품지수 일별의 VKOSPI 행 [실측 필요 #P7-1 — 데이터셋·행 이름·칸]. 꺼져 있거나 값이 없으면 공포탐욕 변동성 성분은 월물 ATM IV(prv_gex.metrics atm_iv)로 대신하고 estimated + '대체: ATM IV'(metrics §D7)"

  - name: gex.alert
    phase: P7
    enabled: true               # P7 WRAP(§1.7-1)
    owner: "kbj.services.engine.gex_alert:run"
    schedule: {equity: {start: open, end: close, every_min: 1}, when: trading_day}
    retry: {max: 0}
    deadline_min: 1
    as_of: minute
    notify: {kind: alert.gex_level, when: changed}
    note: "장중 GEX 레벨 알림(D-P7-17 [제안]) — visible 지표만: Flip(all) 건넘·콜월/풋월 행사가 바뀜·기대변동폭 ±1σ 밖. 정규장 09:00~15:30 만(15:30 에 끝 — §10 Q5), 쿨다운 600초(notify.yaml). invalid·stale 산출로는 보내지 않는다. 표에 쓰지 않는다(상태는 Redis gex:alert:last). 15:30 뒤·야간 변화는 16:00 마감 요약·아침 브리핑에만"

  # ── 페이지 9 테마·밸류체인 — stock-dashboard 테마 마스터 받아 쓰기(ADR 0039, 사용자 결정 2026-10-15) ──
  # 원천 stock-dashboard '종목 마스터 갱신'(.github/workflows/master-refresh.yml cron '0 21 * * 6' = 일 06:00 KST,
  # 바뀌면 PR — 머지 뒤 main 에 반영). 그 뒤 일요일 12:40 KST 에 한 번 본다(휴장과 무관). meta.json built_at 이
  # 같으면 나머지 파일을 받지 않는다. PR 머지가 늦으면 다음 주에 반영 — 바로 반영하려면
  # `python -m kbj.services.scheduler run-once theme.master_sync`(런북). 테마 강도는 표 없이 API 가 읽을 때 계산.
  - name: theme.master_sync
    phase: P9
    enabled: true               # 외부 키 불필요(공개 GitHub raw 파일)
    owner: "kbj.services.collectors.theme_master:run"
    schedule: {cron: "40 12 * * 0", when: always}
    retry: {max: 2, backoff_s: [1800, 3600]}
    collects:
      - {source: STOCK_DASHBOARD, dataset: theme_master, as_of: run_date}
    writes: [prv_themes.master_load, prv_themes.naver_theme, prv_themes.theme_link,
             prv_themes.naver_excluded, prv_themes.member, prv_themes.stock, prv_themes.industry_group,
             prv_themes.type_override]
    note: "data/master/ 7개 → 검증(필수 칸·참조·대테마 ≥ 30·편입 ≥ 3,000·직전 판 대비 20% 넘게 줄면 거부 — config/theme.yaml) → 로그인 표 한 트랜잭션 통째 교체. 검증 실패·직전보다 오래된 판은 적재하지 않고 실패(옛 판 유지 → 재시도 뒤 실패 알림). 네이버 유래(테마 이름·편입·사유·종목 마스터)는 prv_themes 만 — 공개 대테마 분류는 theme.classes_sync. KBJ 는 네이버에 직접 접속하지 않는다"

  - name: theme.classes_sync
    phase: P9
    enabled: true               # 외부 키 불필요(공개 GitHub raw 파일)
    owner: "kbj.services.collectors.theme_classes:run"
    schedule: {cron: "40 12 * * 0", when: always}
    retry: {max: 2, backoff_s: [1800, 3600]}
    depends_on: [{job: theme.master_sync, hard: true}]
    collects:
      - {source: STOCK_DASHBOARD, dataset: theme_classes, as_of: run_date}
    writes: [pub_themes.theme]
    note: "공개 작업 — meta.json·themes.json 의 대테마 id·이름·섹션·밸류체인만(네이버 목록은 읽지 않는다) → pub_themes.theme 한 트랜잭션 통째 교체 → 공개 themes.json(public.export). 로그인 원천을 받는 theme.master_sync 는 공개 표에 쓰지 않으므로 따로 둔다(ADR 0002·0039). 굳은 의존 — 로그인 판 검증이 통과한 날만"

