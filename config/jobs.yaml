      - {source: KIS, dataset: etf_quote_intraday, as_of: slot10m}
    writes: [prv_flows.investor_intraday, prv_flows.stock_investor_daily,
             prv_market.turnover_rank_intraday, prv_market.stock_snapshot, prv_etf.quote_intraday]
    note: "D7 — 장중 외국인·기관 가집계·거래대금 순위·ETF 현재가(잠정, quality=estimated). 슬롯마다 *_intraday 이력 + 일별 원장 오늘 행(kis.prelim). 마감 뒤 확정치로 덮는다(D-P3-7)"

  - name: market.intraday
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.market_intraday:market"
    schedule: {equity: {start: open, end: close, every_min: 10}, when: trading_day}
    retry: {max: 2, backoff_s: [20, 40]}      # D-P3-14
    deadline_min: 9
    collects:
      - {source: KIS, dataset: index_quote_intraday, as_of: slot10m}
      - {source: KIS, dataset: sector_quote_intraday, as_of: slot10m}
    writes: [prv_market.index_intraday, prv_market.sector_intraday]
    note: "D-P3-14 신규 — 장중 지수 3·업종 2 호출(슬롯당 5건). 페이지 1 지수 타일·업종 히트맵·장중 시장 거래대금(지수 기준, estimated)"

  # ── P5 F2 장중 투자자 수급·프로그램매매(docs/p5_flow_program_prompt.md §3.4, docs/p5_design.md §0.4·§3.4) ──
  # 1분 작업은 정규장 + 장 마감 단일가 15:40 까지(close+10). 빈 분은 채우지 않는다(보간 금지 — 행 없음).
  # 프로그램 TR 은 실측(#40·#41) 전이라 웨이브 3 에도 꺼진 채 남는다(D-P5-23). KIS 우선순위는 limits.yaml
  # kis.priorities(market_minute·program_intraday P2 · program_scan P3 · program_sweep P4).
  - name: flows.market_minute
    phase: P5
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): K2I 3조합만(GX 2026-09-28 실측) — 현물은 #39 전까지 꺼진 조합
    owner: "kbj.services.collectors.flows_minute:run"
    schedule: {equity: {start: open, end: "close+10", every_min: 1}, when: trading_day}
    retry: {max: 1, backoff_s: [15]}         # 슬롯 안에서 한 번만 — 슬롯 + 45초 넘으면 estimated(§3.4)
    deadline_min: 1
    as_of: minute
    collects:
      - {source: KIS, dataset: market_investor_intraday, as_of: minute}
    writes: [prv_gex.investor_flow]
    note: "ADR 0019 — prv_gex.investor_flow 의 유일한 쓰기 주인(D-P5-21). 조합은 config/markets.yaml flows.minute.pairs 의 켠 것만(실측 전 K2I F001·OC01·OP01 — 현물은 #39 뒤). 대금 백만원(GX 단위 그대로). 같은 분 재실행 멱등(UNIQUE ts·시장·업종·투자자)"

  - name: program.intraday
    phase: P5
    owner: "kbj.services.collectors.program:intraday"
    schedule: {equity: {start: open, end: "close+10", every_min: 1}, when: trading_day}
    retry: {max: 1, backoff_s: [15]}
    deadline_min: 1
    as_of: minute
    collects:
      - {source: KIS, dataset: program_market_intraday, as_of: minute, venues: [KRX]}
    writes: [prv_flows.program_market_intraday]
    note: "꺼짐(WRAP) — 막는 실측 #40(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 시장 2(코스피·코스닥) × 켠 거래소(config/markets.yaml kis.venues) 매분. 응답 칸·단위 [확인 필요 #40]"

  - name: program.stock_scan
    phase: P5
    owner: "kbj.services.collectors.program:scan"
    # P3 10분 슬롯(09:00·09:10…)과 5분 엇갈려 같은 KIS 버킷이 겹치지 않게(§3.4·R5)
    schedule: {equity: {start: "open+5", end: "close-5", every_min: 10}, when: trading_day}
    retry: {max: 1, backoff_s: [60]}
    deadline_min: 9
    collects:
      - {source: KIS, dataset: program_stock_intraday, as_of: slot10m, venues: [KRX]}
    writes: [prv_flows.program_stock_intraday]
    note: "꺼짐(WRAP) — 막는 실측 #41(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 범위 = 거래대금 상위 N(config/markets.yaml program.scan_top_n — [확인 필요 #41]) + 관심종목(≤ scan_watch_max). 화면 순위는 범위 꼬리표 필수(F2 §1.4)"

  # ── 장 마감 뒤 ──────────────────────────────────────────────────────────────────────────
  - name: market.close_collect
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.market_close:run"
    schedule: {equity: {start: "close+5"}, when: trading_day}   # 평소 15:35, 수능일 16:35
    retry: {max: 5, backoff_s: [300]}
    collects:
      - {source: KIS, dataset: stock_quote_eod, as_of: trade_date, venues: [KRX]}
      - {source: KIS, dataset: stock_investor_daily, as_of: trade_date, venues: [KRX]}
      - {source: KIS, dataset: market_investor_daily, as_of: trade_date, venues: [KRX]}
      - {source: KIS, dataset: inst_foreign_top, as_of: trade_date, venues: [KRX]}
      - {source: KIS, dataset: etf_investor_daily, as_of: trade_date, venues: [KRX]}
    writes: [prv_market.stock_snapshot, prv_market.daily_bar, prv_flows.stock_investor_daily,
             prv_flows.market_investor_daily, prv_flows.investor_revision]
    absorbs: ["SD:price_sync_close", "SD:flow_batch", "SD:ohlcv_autofill", "SD:price_sync_afterhours",
              "ET:board@16:10:collect", "ET:kr.yml:kis_flows", "ET:flow.yml:collect"]
    note: "ADR 0001 Q1 결정 전 기본값(KIS 당일 마감, 다음 날 KRX 대조). 장중 잠정 행을 덮어쓰고 차이를 prv_flows.investor_revision 에(D-P3-7). 거래소 구분은 config/markets.yaml kis.venues(기본 KRX — D-P3-9)마다 데이터 키"

  - name: gex.day_minutes
    phase: P7
    runner: external
    owner: "legacy:gexlab/services/scheduler/minute.py:MinuteDaily"
    schedule: {state_enter: [POST_DAY], when: trading_day}
    collects:
      - {source: KIS, dataset: fut_minute_day, as_of: trade_date}
    writes: [prv_gex.minute_bars]
    absorbs: ["GX:scheduler:minute_day", "GX:scheduler:gap_day", "GX:scheduler:open_check_day"]
    note: "GX 규칙 그대로 — POST_DAY 16:00~17:50 주간(F) 분봉·무결측, 08:48 개장 확인"

  # 장 끝난 뒤 텔레그램은 전부 16:00(ADR 0018 — 사용자 결정 2026-10-08, 원본 SD·ET 와 같다). 16:00 에
  # 발화해 굳은 의존(market.close_collect — 15:35 시작, 약 24분)을 기다리고, 발송 작업은 같은 16:00 의
  # board.daily 를 무른 의존 wait_min 으로 기다린다(보드 실패는 발송을 막지 않는다). 실제 도착은 마감 수집이
  # 끝난 뒤 — 평소 16:00~16:05 [추정 — 실측 전], 마감 수집이 늦으면 그만큼 늦다(수능일은 close+5 = 16:35 뒤).
  - name: board.daily
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.board:daily"    # D-P3-5 — 순수 계산은 kbj.engines.board, 실행은 services.engine
    # 실행기에 '의존이 끝나면 시작' 트리거가 없다(triggered_by 미구현 — D-P4-4) → 16:00 cron + 굳은 의존.
    # close_collect 가 16:00 전에 끝났으면 16:00 에 바로, 늦으면 끝난 뒤 30초(DEP_POLL_S) 안에 시작한다.
    schedule: {cron: "0 16 * * 1-5", when: trading_day}
    retry: {max: 2, backoff_s: [600]}
    depends_on: [{job: market.close_collect, hard: true}]
    writes: [prv_board.alltime, prv_board.label, prv_board.split_check, prv_board.stock_day,
             prv_board.artifact]
    absorbs: ["SD:prewarm_new_highs", "SD:stage2_auto", "ET:board@16:10:compute"]
    note: "신고가 계산·랭킹·탐지(DB 만 — LLM 서술은 P8). KIS 마감 스냅으로 잠정 보드(quality estimated), 다음 날 board.confirm 이 KRX 확정으로 덮는다. 16:00 발송(마감 요약·수급 리포트)이 기다리므로 16:00 에 발화해 close_collect(평소 15:35~약 16:00, 수능일 16:35~) 가 끝나는 대로 돈다(ADR 0018)"

  - name: brief.closing
    phase: P5                 # D-P3-17·메인 결정 R18 — 마감 요약은 P5(아침 브리핑과 같은 묶음)
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): 16:00(ADR 0018)
    owner: "kbj.reports.briefs:closing"
    schedule: {cron: "0 16 * * 1-5", when: trading_day, catch_up_until: "20:30"}
    retry: {max: 0}
    depends_on:
      - {job: market.close_collect, hard: true}
      - {job: board.daily, hard: false, wait_min: 20}   # 진행 중인 보드를 최대 20분(재시도 1번) 기다린다
    notify: {kind: brief.closing}
    absorbs: ["SD:tg_closing", "SD:tg_closing_summary", "SD:closing_brief_catchup", "SD:agent_pipeline",
              "ET:board@16:10:send", "GX:plan:brief_1550"]
    note: "U2 하루 1회(16:00, 캐치업 20:30 — ADR 0018). 마감 수집(굳은)·보드(무른, 최대 20분 기다림)가 끝난 뒤 나간다 — 평소 16:00~16:05. 보드가 시한 안에 없으면 '미준비'로 적는다. 본문은 P5(R18)"

  - name: flows.report
    phase: P5                 # D-P3-17
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): 16:00(ADR 0018), 원장만 읽는다
    owner: "kbj.reports.flows:daily"
    schedule: {cron: "0 16 * * 1-5", when: trading_day}
    retry: {max: 0}
    depends_on:
      - {job: market.close_collect, hard: true}
      - {job: board.daily, hard: false, wait_min: 20}
    notify: {kind: flows.report}
    absorbs: ["SD:tg_flow_signals", "ET:flow.yml:report"]
    note: "수급 리포트 발송 16:00(ADR 0018) — P5(D-P3-17). 수집(market.close_collect)은 P3. 16:00 의 투자자 수급을 그날 확정치로 볼 수 없다: 오늘 행은 KIS 마감 수집(15:35~약 16:00) 값이라 잠정일 수 있고(SD 기록 — 투자자별 확정치는 KRX 약 18:00·네이버 약 18:30. KIS 가 이 시각에 당일 행을 주는지·저녁 값과 같은지는 [확인 필요 — probe_results §7 #22]), 당일 행이 없는 종목은 전 거래일 값이다. 리포트는 수급 섹션에 실제 기준일·원천·quality 를 적고 오늘 값인 척 내보내지 않는다(SD 2026-09-18 결정과 같은 원칙)"

  - name: consensus.snapshot
    phase: P4
    enabled: false               # 실데이터 확인(probe #29) 전까지 꺼 둔다 — 웨이브 3 에도 켜지 않는다(D-P4-10)
    owner: "kbj.services.collectors.consensus:run"
    schedule: {cron: "0 16 * * 1-5", when: trading_day}
    retry: {max: 2, backoff_s: [1800]}
    # 굳은 의존은 가격 때문이 아니다(유니버스 = 관심종목 ∪ 전 거래일 시총 상위 — ADR 0015 6). 같은 KIS 앱키
    # 버킷(초당 4건)을 마감 수집 약 5,700건과 겹치지 않게 차례를 잡는 것 — 16:00 발화 그대로 둔다.
    depends_on: [{job: market.close_collect, hard: true}]
    collects:
      # TR id·경로는 kbj/data/private/kis/datasets.py:CONSENSUS_TRS 한 곳([확인 필요 #29]). invest_opinion 은
      # 묶음 K(웨이브 2)가 카탈로그 행·가짜 서버·시뮬레이션 KIS_SPECS 와 같은 변경으로 더했다
      - {source: KIS, dataset: consensus_estimate, as_of: trade_date}
      - {source: KIS, dataset: invest_opinion, as_of: trade_date}
    writes: [prv_fin.consensus_snapshot, prv_fin.invest_opinion, prv_fin.target_consensus,
             prv_fin.revision]
    notify: {kind: alert.revision}
    absorbs: ["SD:consensus_snapshot_daily", "SD:tg_revision_signals", "SD:consensus_quarterly_weekly",
              "SD:mac-crontab:consensus_collector"]
    note: "⚠ 대체 출처 미확인(conflict_map §1.13, R20) — KIS TR 실측 뒤 확정. 리비전 알림(alert.revision) 16:00(ADR 0018) — 마감 수집이 끝난 뒤 약 640호출(4/s 로 약 3분)을 받고 보내므로 평소 16:00~16:05. 수집과 알림은 한 작업이다(SD 처럼 14:30 수집·16:00 발송으로 나누면 장중 KIS 버킷과 겹친다 — p4_design §3.6)"

  - name: themes.monitor
    phase: P5
    owner: "kbj.services.engine.themes:monitor"   # D-P5-7 — 순수 계산은 kbj.engines.themes(계약 ⑨)
    schedule: {cron: "50 16 * * 1-5", when: trading_day}
    retry: {max: 1, backoff_s: [600]}
    depends_on: [{job: market.close_collect, hard: true}]
    writes: [prv_themes.strength]
    absorbs: ["ET:kr.yml:build"]
    note: "테마·밸류체인 사전 통합(페이지 9)은 사용자가 따로 진행(2026-10-13 결정 Q1) — P5 에서 제외, 꺼짐. 처리기·표(prv_themes.strength)는 그 작업이 만든다. ET kr.yml 09:30·15:30 — 장중판은 폐지 [제안], 마감 뒤 1회. 텔레그램 아님(ADR 0018 대상 아님)"

  - name: program.daily
    phase: P5
    owner: "kbj.services.collectors.program:daily"
    schedule: {equity: {start: "close+20"}, when: trading_day}    # 평소 15:50(수능일 16:50)
    retry: {max: 3, backoff_s: [600]}
    collects:
      - {source: KIS, dataset: program_market_daily, as_of: trade_date, venues: [KRX]}
      - {source: KIS, dataset: program_investor_today, as_of: trade_date, venues: [KRX]}
    writes: [prv_flows.program_market_daily, prv_flows.program_investor_daily]
    note: "꺼짐(WRAP) — 막는 실측 #40(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 일별 60거래일 막대(F2 §0-2). 처음 60거래일은 program.backfill 로. 텔레그램 없음(16:00 리포트에 프로그램 줄을 넣지 않는다 — F2 §3.7)"

  - name: program.stock_sweep
    phase: P5
    owner: "kbj.services.collectors.program:sweep"
    schedule: {cron: "10 18 * * 1-5", when: trading_day}
    retry: {max: 2, backoff_s: [900]}
    deadline_min: 90
    as_of: trade_date              # collects 가 event 하나라 명시해야 발화한다(D-P4-25 ③)
    depends_on: [{job: market.close_collect, hard: true}]
    collects:
      # 종목 단위 키 <종목>:<거래일>(event) — 처리기가 claims 로 직접 선점, 끊기면 이어서(D-P4-25 ②)
      - {source: KIS, dataset: program_stock_daily, as_of: event, venues: [KRX]}
    writes: [prv_flows.program_stock_daily]
    note: "꺼짐(WRAP) — 막는 실측 #41(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 마감 뒤 전 종목 1회(코스피+코스닥 약 2,700 × 켠 거래소 — 4/s 로 약 11~12분, [확인 필요 #41]). 18:10 = 16:00 발송 묶음·컨센서스(16:00~16:05) 뒤(ADR 0018). 확정 순위(scope sweep — 화면 꼬리표 '전 종목(마감 확정)')"

  - name: program.backfill
    phase: P5
    owner: "kbj.services.collectors.program:backfill"
    schedule: {manual: true}
    retry: {max: 2, backoff_s: [600]}
    deadline_min: 120
    backfill_of: [program.daily]
    writes: [prv_flows.program_market_daily, prv_flows.program_investor_daily]
    note: "꺼짐(WRAP) — 막는 실측 #40(docs/probe_results.md §7), 키 수령·확인 뒤 켬. python -m kbj.services.scheduler backfill program.backfill --from <60거래일 전> --to <전 거래일>(P3 백필 하위 명령 — program.daily 와 같은 데이터 키, 선점 공유). 날짜 구간 상한·호출 수 [확인 필요 #40]"

  - name: macro.evening
    phase: P5
    owner: "kbj.services.collectors.macro:evening"
    schedule: {cron: "0 17 * * 1-5", when: trading_day}
    retry: {max: 3, backoff_s: [1800]}
    collects:
      - {source: ECOS, dataset: 817Y002, as_of: trade_date}
      - {source: ECOS, dataset: 722Y001, as_of: trade_date}
      - {source: ECOS, dataset: 731Y003, as_of: trade_date}
    writes: [pub_macro.series]
    absorbs: ["ET:bok.yml@16:30", "ET:bok.yml@22:00"]
    note: "꺼짐(WRAP) — 막는 실측 #43(docs/probe_results.md §7), 키 수령·확인 뒤 켬"

  - name: macro.evening_prv
    phase: P5
    owner: "kbj.services.collectors.macro_prv:evening"
    schedule: {cron: "5 17 * * 1-5", when: trading_day}
    retry: {max: 3, backoff_s: [1800]}
    collects:
      - {source: ECOS, dataset: 802Y001, as_of: trade_date}
      - {source: ECOS, dataset: 731Y001, as_of: trade_date}
    writes: [prv_macro.series]
    note: "꺼짐(WRAP) — 막는 실측 #43(docs/probe_results.md §7), 키 수령·확인 뒤 켬. ECOS 타기관 작성 표(한국거래소·서울외국환중개) — 로그인(DATA_TIERS §1)"

  - name: fin.valuation_band
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.valuation:band"    # D-P3-5 — 순수 계산은 kbj.engines.valuation
    schedule: {cron: "50 8 * * 1-5", when: trading_day}
    retry: {max: 1, backoff_s: [600]}
    as_of: prev_trading_day      # 굳은 의존 krx.daily 와 as_of 종류가 같아야 한다(D-P4-25 ④ — board.confirm 과 같다)
    depends_on: [{job: krx.daily, hard: true}, {job: fin.quarterly, hard: false}]
    writes: [prv_fin.valuation_daily, prv_fin.valuation_band, prv_fin.scenario, prv_market.share_class]
    absorbs: ["SD:mac-crontab:valuation_calculator", "SD:mac-crontab:tam_modeler"]
    note: "PIT 밸류에이션(D-P4-11 — t 에 공시된 분기만, 회사 시총 = 보통 + 우선, EV 에 오버행 가치 더하지 않음): 전 거래일 행 추가·밴드·시나리오 적정가(구 TAM — D-P4-12) 모두 그날 행이 있는 전 종목(주요계정 층은 EV/EBITDA 만 not_detail_tier — 밴드는 그 칸만 비운다). 시세로 과거가 늘어나는 KRX 일별 백필(market.backfill) 뒤에는 `python -m kbj.services.engine.valuation rebuild --as-of <전 거래일>` 한 번(재무 지문이 시세 백필을 잡지 못한다 — 재무 백필·정정은 지문이 다시 계산). 시총·상장주식수는 KRX 확정 원장(krx.daily 08:05). 알림 없음"

  - name: earnings.alerts
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.earnings:alerts"
    schedule: {cron: "*/5 7-20 * * 1-5", when: always}
    retry: {max: 0}
    deadline_min: 5
    as_of: minute                # 5분마다 — 실행 as_of 하나에 한 번(D-P4-25 ①)
    writes: [prv_fin.earnings_surprise]
    notify: {kind: alert.earnings}
    absorbs: ["SD:earnings_pipeline_5min"]
    note: "미처리 잠정실적(pub_filings.earnings_prelim 중 prv_fin.earnings_surprise 에 행 없음) → YoY 분류(+ 분기 컨센서스 있을 때 서프라이즈) → 기록 → 관심종목·우선순위 ≤ 2 면 alert.earnings(사건 시점 — 장 마감 뒤 사건도 바로, ADR 0018 의 16:00 대상 아님). 본문은 템플릿(LLM 없음). subject <corp_code>:<회계기간>:<연결/별도>(정정공시 재발송 없음)"

  - name: filings.derive
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.filings:derive"
    # 스케줄 cron 은 하나뿐 — 21:10·21:40 이 밤 마무리(초안의 + 21:30 대신, D-P4-25 ⑤)
    schedule: {cron: "10,40 7-21 * * *", when: always}
    retry: {max: 1, backoff_s: [300]}
    deadline_min: 25
    as_of: minute
    writes: [pub_filings.overhang_state, pub_filings.overhang_summary, pub_filings.insider_window,
             pub_filings.earnings_schedule, pub_filings.disclosure]
    note: "공개 파생(계약 ⑬ — 로그인 모듈 import 금지): 그날 바뀐 회사의 오버행 상태·요약·내부자 창(30·90·180일)·실적 일정·공시 키워드 점수(disclosure.kw_score)를 pub_filings 에. DB 만 — 수집 없음"

  - name: fin.backfill
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.fin:backfill"
    schedule: {manual: true}
    retry: {max: 2, backoff_s: [600]}
    deadline_min: 360
    backfill_of: [fin.quarterly]
    budget: dart
    writes: [pub_fin.statement_raw, pub_fin.quarterly, pub_fin.ratio, pub_filings.share_count]
    note: "python -m kbj.services.scheduler run-once fin.backfill --as-of <YYYY-MM-DDTHH:MM> — 시작 연도·층은 config/fin.yaml backfill(스케줄러 backfill 명령은 거래일 펼치기라 쓰지 않는다 — §0.4). 이미 받은 statement_raw 는 건너뛰어 여러 날에 나눠 돈다. DART 백필 상한 dart.backfill_cap(DartClient.from_settings(backfill=True), 우선순위 P4 — 장중 피드에 양보). run-once 는 fin.quarterly 의 데이터셋마다 <데이터셋>@<as_of> 실행 키를 하나씩 잡는다 — 처리기는 그 키(ctx.keys)를 collected 로 돌려준다"

  # ── 장중 운영 감시·수동 ─────────────────────────────────────────────────────────────────
  - name: ops.watchdog
    phase: P2
    enabled: true
    owner: "kbj.services.collectors.ops_watchdog:run"
    schedule: {cron: "0,30 8-20 * * 1-5", when: trading_day}
    retry: {max: 0}
    deadline_min: 10
    as_of: minute
    notify: {kind: ops.watchdog}
    absorbs: ["SD:data_watchdog", "ET:daily.yml 실패 curl(#37)", "GX health"]
    note: "마감 지난 실행·하트비트 끊긴 서비스·실패 작업 → ops.watchdog 알림"

  - name: market.backfill
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.krx_daily:backfill"
    schedule: {manual: true}
    retry: {max: 2, backoff_s: [600]}
    backfill_of: [krx.daily]
    budget: krx
    writes: [prv_market.daily_bar, prv_market.stock_snapshot, prv_market.universe, prv_etf.etf_daily,
             prv_etf.meta]
    absorbs: ["SD:mac-crontab:ohlcv_5y_collector"]
    note: "run-once --as-of <과거 날짜> 또는 backfill --from --to(§3.8) — krx.daily 와 같은 데이터 키(선점 공유). 백필 상한 krx.backfill_cap, 최근 날짜부터 과거로. ET 네이버 일봉 백필은 KRX 로 다시 받는다(U4 — 네이버 출처 옛 최고가는 옮기지 않는다, R8)"

  # ── P5 2차 묶음 IDX — 패시브 지수 정기변경(편입·편출) 예측(docs/p5_index_rebalance_prompt.md §3-4) ──
  # 외부 원천을 부르지 않는다(DB·설정만 — collects 없음). 알림 없음(ADR 0018 의 16:00 발송과 무관 — 결과
  # 발표일 알림은 P8 규칙 알림). 켜기는 메인 결정(꺼진 채 등록 — 단계별 켜진 표 ENABLED_BY_PHASE 는 공유 시험).
  - name: index.calendar
    phase: P5
    enabled: false              # P5 2차 IDX — 켜기는 메인(requests)
    owner: "kbj.services.engine.index_review:calendar"
    schedule: {cron: "41 6 * * *", when: always}
    retry: {max: 1, backoff_s: [300]}
    as_of: run_date
    writes: [prv_index.review_calendar]
    note: "config/index_reviews.yaml reviews(사람이 적은 공표 일정표 — 계산 추정 금지, 대조 #51) → prv_index.review_calendar. confirmed=false 는 estimated. 사용자 컷오프(user_cutoff_won)는 덮지 않는다"

  - name: index.predict
    phase: P5
    enabled: false              # P5 2차 IDX — 켜기는 메인(requests)
    owner: "kbj.services.engine.index_review:predict"
    schedule: {cron: "20 17 * * 1-5", when: trading_day}   # 16:00 발송 묶음 뒤(ADR 0018)
    retry: {max: 2, backoff_s: [600, 1800]}
    as_of: trade_date
    depends_on: [{job: market.close_collect, hard: true}]
    writes: [prv_index.prediction_run, prv_index.predictions, prv_index.passive_aum]
    note: "규칙 숫자 [확인 필요 #50·#52·#53]. 켜진 지수(MSCI Korea·KOSPI200·KOSDAQ150)마다 효력 전 첫 리뷰의 편입·편출·경계·유지 판정(metrics §24). 계산 날짜 = min(그날, 리뷰 기준일) — 기준일 뒤엔 기준일 값으로 고정. 구성종목 목록(prv_index.constituents — 사용자·보도자료, load-constituents CLI)이 없으면 no_constituents 한 줄만(예측하지 않는다). 지수 하나의 실패는 격리. 백테스트·목록 반영·컷오프 입력은 `python -m kbj.services.engine.index_review`"

