# 작업 등록부 — KBJ 의 정기 작업·상시 서비스·폐지한 legacy 작업 전부(PLAN §2 "스케줄은 등록부 하나").
# 형식·검증: docs/p2_design.md §6.2~§6.8, 해석기 kbj/services/scheduler/registry.py(묶음 F).
#   python -m kbj.services.scheduler validate config/jobs.yaml   (CI: tests/unit/scheduler/test_registry_validation.py)
#
# - 같은 (source, dataset) 은 등록부 전체(jobs + services)에서 한 곳만 collects 에 둔다(§6.5 정적 겹).
#   데이터셋 id 는 카탈로그(kbj/data/catalog.py)의 논리 데이터셋이다. 실행 때는 ops.data_claim 선점(동적 겹).
# - 시각은 schedule.tz 벽시계(기본 KST — 컨테이너는 UTC, 변환은 코드에서). 트리거는 하나만:
#   cron · state_enter(세션 상태 진입) · equity(주식 정규장 기준 — 연초·수능일 지연 개장을 따른다) · manual.
# - P2 에 켠 작업은 셋(ops.nightly·filings.corp_code·ops.watchdog)이다(§6.9).
#   켜지지 않은 작업은 등록만 — 실행기는 '계획됨'(ops.job_run status=skipped, reason=planned)으로 기록만 한다.
# - P3(docs/p3_design.md §0.4·§3.2): 웨이브 1(묶음 M)이 P3 작업의 owner·collects·writes 를 확정했고,
#   처리기가 생긴 뒤 웨이브 3(묶음 S)이 9개를 켰다(켜진 작업은 처리기 import 가 검증된다 — 단계별 켜진
#   작업 목록은 tests/unit/scheduler/test_registry_validation.py:ENABLED_BY_PHASE). P3 에서 빼는 작업
#   (brief.closing·flows.report·us.universe·us.eod·market.fsc_daily)은 P5(D-P3-17).
# - KIS 거래소 구분(venues)은 config/markets.yaml kis.venues 와 같아야 한다(D-P3-9 — 기본 [KRX]).
#   collects 에 venues 를 적지 않으면 실행기가 카탈로그의 KRX·NXT·TOTAL 키를 모두 잡고, 처리기는 부르지 않은
#   키를 done 으로 돌려준다(선점 장부 오염). 두 값이 같은지는 등록부 시험이 검사한다.
# - runner: external = legacy GX 가 돌린다(P7 까지). KBJ 는 실행하지 않고 데이터 키만 등록한다(D-P2-5).
# - absorbs 의 문자열은 tests/unit/scheduler/legacy_jobs.txt 의 줄 이름이다(inventory (c) — 줄마다
#   absorbs·retired 에 정확히 한 번). 그 밖의 문자열(코드 위치)은 근거 메모다.
# - 아침 브리핑·마감 요약은 하루 1회씩(U2): notify.kind brief.morning·brief.closing 을 보내는 작업은 각 1개.
# - 장 마감 뒤 텔레그램(notify)은 전부 16:00 에 발화한다(ADR 0018 — 사용자 결정 2026-10-08). 아침·장중·
#   사건(공시 alert.earnings)·운영 감시(ops.*) 발송은 그대로. 등록부 시험이 지킨다.
# - P4(docs/p4_design.md §0.4·§3.2·D-P4-25): 웨이브 1(묶음 M)이 P4 작업의 owner·schedule·as_of·collects·
#   writes 를 확정했고(처리기는 웨이브 2), 웨이브 3(묶음 S)이 9개를 켰다 — consensus.snapshot 은 실데이터
#   확인(#29) 전까지 꺼 둔다(D-P4-10). 꺼진 작업도 하루 운영 시뮬레이션은 시험 안에서 켠 사본으로 돌린다. 실행기는 실행 as_of 하나에 한 번
#   돌므로 하루 여러 번 도는 작업(fin.quarterly·earnings.alerts·filings.derive)은 as_of: minute 을 명시한다.
#   collects 의 `as_of: event`(접수번호·회사 단위) 키는 실행기가 미리 잡지 않는다 — 처리기가 자원 `claims`
#   (선점 저장소)로 직접 claim → complete/fail 하고 JobResult.collected 에는 넣지 않는다.
# - P5(docs/p5_design.md §0.4·§3.2): 웨이브 1(묶음 FND)이 P5 작업의 owner·schedule·as_of·collects·writes 를
#   확정했다 — 전부 enabled: false(켜기는 웨이브 3 WRAP, 실측 전 수집은 꺼진 채 — #39~#48). 매크로는 공개
#   `collectors.macro`·로그인 `collectors.macro_prv` 모듈로 나눴다(D-P5-7 — 계약 ⑭). 장중 투자자 1분
#   (KIS:market_investor_intraday)의 수집 주인은 flows.market_minute 하나다(ADR 0019 — gex.poller 에서 옮김).
#   새 발송 etf.report 는 아침 08:20(브리핑 아님 — U2 의 하루 1회에 세지 않는다). 장 마감 뒤 발송은 그대로 16:00.
# - P6(docs/p6_design.md §0.4·§3.2): 웨이브 1(묶음 FND)이 trade.* 다섯 작업의 owner·schedule·as_of·collects·
#   writes 를 확정했다 — 전부 enabled: false(켜기는 웨이브 3 WRAP, 관세청 수집은 실측 #1~#6·#17·#55 뒤).
#   새 텔레그램 발송 없음 — 수출 속보는 16:00 brief.closing 한 줄(D-P6-8, ADR 0018). public.export 는 하루 4번(D-P6-7).
version: 1

defaults:
  tz: Asia/Seoul               # 컨테이너 TZ=UTC(docs/secrets.md) — 변환은 코드에서
  retry: {max: 3, backoff_s: [60, 300, 900]}
  deadline_min: 120            # 시작 시각 + 이 시간 안에 끝나지 않으면 실패
  enabled: false               # kbj 처리기가 있고 그 단계에 켠 작업만 true

# ── 상시 프로세스(작업이 아님 — 하트비트로만 감시) ───────────────────────────────────────────
services:
  - {name: auth, owner: kbj.services.auth, phase: P2, heartbeat_s: 180, enabled: true,
     absorbs: ["GX:auth:step"],
     note: "KIS 접근토큰·웹소켓 접속키의 유일한 발급자(ADR 0004). K1~K9 발급 지점은 묶음 H 가 교체"}
  - {name: notifier, owner: kbj.services.notifier, phase: P2, heartbeat_s: 60, enabled: true,
     note: "발송 outbox 소비·웹훅·10분 웹훅 점검(§5). 발송·수신 지점 #1~#46"}
  - {name: scheduler, owner: kbj.services.scheduler, phase: P2, heartbeat_s: 60, enabled: true,
     absorbs: ["GX:scheduler:session_state"],
     note: "세션 상태 발행(session:state·session.events·ops.session_log) + 이 등록부 실행기"}
  - name: gex.poller
    owner: "legacy:gexlab/services/poller"
    runner: external
    phase: P7
    collects:
      - {source: KIS, dataset: option_chain_live, as_of: minute}
    absorbs: ["GX:poller"]
    note: "투자자별(KIS:market_investor_intraday)은 flows.market_minute 이 유일하게 쓴다(ADR 0019 — P5 D-P5-21 ①). P7 이 poller 를 옮길 때 이 TR 을 부르지 않고 prv_gex.investor_flow 를 읽는다. ⚠ legacy GX poller 를 kbj 와 함께 돌리면 같은 TR 을 두 곳이 부른다 — investor_period_s 를 끄는 설정 [확인 필요]"
  - name: gex.ws_gateway
    owner: "legacy:gexlab/services/ws_gateway"
    runner: external
    phase: P7
    collects:
      - {source: KIS, dataset: ws_ticks, as_of: minute}
    absorbs: ["GX:ws_gateway", "GX:ws_gateway:closed_session_watch"]
    note: "접속키는 auth 가 발급, ws-gateway 는 읽기만(ADR 0004 D2)"
  - {name: gex.recorder, owner: "legacy:gexlab/services/recorder", runner: external, phase: P7,
     absorbs: ["GX:recorder"]}
  - {name: gex.engine, owner: "legacy:gexlab/services/engine", runner: external, phase: P7,
     absorbs: ["GX:engine:cycle", "GX:engine:daily_post_day"]}

jobs:
  # ── 새벽(운영·공시 기준표) ─────────────────────────────────────────────────────────────
  - name: ops.nightly
    phase: P2
    enabled: true
    owner: "kbj.services.ops.nightly:run"
    schedule: {cron: "0 3 * * *", when: always}
    retry: {max: 1, backoff_s: [600]}
    writes: [prv_alerts.tg_inbox, prv_alerts.notify_message]
    absorbs: ["SD:db_backup_hourly", "ET:Actions 캐시 DB(board.db 보존)"]
    note: "pg_dump 백업(VM 로컬, 7일 보존 [확인 필요 — R23]) · 인박스 14일 · 발송 본문 30일 정리"

  - name: filings.corp_code
    phase: P2
    enabled: true
    owner: "kbj.services.collectors.corp_code:run"
    schedule: {cron: "5 3 * * *", when: always}
    retry: {max: 3, backoff_s: [600, 600, 600]}
    collects:
      - {source: DART, dataset: corpCode, as_of: run_date}
    budget: dart
    writes: [pub_filings.corp_code]
    absorbs: ["SD:dart_corp_map_update", "ET:board/ingest/dart.py:corp_codes", "ET:dart-report .cache/corp*"]

  - name: public.export
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.public_export:run"
    schedule: {cron: "30 5,11,14,17 * * *", when: always}   # P6 D-P6-7 — 하루 4번(관세청 당일 반영)
    retry: {max: 1, backoff_s: [600]}
    deadline_min: 30
    note: "D-P3-15·16 — pub_* 와 코드 계산(캘린더·금통위)만 JSON 으로(KBJ_DATA_DIR/public). 수집 없음·표 쓰기 없음. public-data 브랜치 푸시·Pages 디스패치는 KBJ_PUBLIC_PUSH_ENABLED(기본 false — 사용자 승인 필요)"

  - name: us.universe
    phase: P5                 # D-P3-17 — 간밤 미국 신고가는 P5
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): 사용자 결정 Q6 — ET us-board 운영 파서(본인 화면·텔레그램만)
    owner: "kbj.services.collectors.us:universe"
    schedule: {cron: "0 4 * * 0", when: always}
    retry: {max: 2, backoff_s: [600]}
    collects:
      - {source: NASDAQ, dataset: screener, as_of: run_date}
    writes: [prv_market.us_universe]
    absorbs: ["SD:refresh_us_universe"]

  - name: us.eod
    phase: P5                 # D-P3-17
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): 사용자 결정 Q6 — Nasdaq·Stooq·Yahoo(ET 운영 확인)
    owner: "kbj.services.collectors.us:eod"
    # 16:10 뉴욕 = 서머타임 끝(11-01) 전 05:10 KST, 뒤 06:10 KST
    schedule: {cron: "10 16 * * 1-5", tz: America/New_York, when: us_trading_day}
    retry: {max: 3, backoff_s: [600]}
    depends_on: [{job: us.universe, hard: false}]
    collects:
      - {source: NASDAQ, dataset: daily, as_of: us_trade_date}
      - {source: YAHOO, dataset: us_index_daily, as_of: us_trade_date}
    writes: [prv_market.daily_bar, prv_board.artifact]
    absorbs: ["SD:us_market_daily", "ET:us-board.yml:collect"]
    note: "D-P5-18 — 일봉은 새 표 없이 prv_market.daily_bar(market='US', 행 source 에 실제 출처 nasdaq·stooq·yahoo), 미국 엔진(kbj.engines.us — 252봉) 산출은 prv_board.artifact(market='US' — us_summary·us_brief, 0016). 아침 브리핑 ① 은 us_brief 를 읽기만 한다"

  - name: earnings.backfill
    phase: P4
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.earnings:backfill"
    schedule: {cron: "30 6 * * *", when: trading_day}
    retry: {max: 1, backoff_s: [600]}
    writes: [prv_fin.earnings_surprise]
    absorbs: ["SD:earnings_backfill_daily"]
    note: "관심종목 잠정실적 알림 후 3·5·7 거래일 종가 성과(알림 직전 마감 종가 대비 — 원장 krx > kis, 정지로 종가가 없으면 None). SD 는 달력일"

  # ── 아침 ────────────────────────────────────────────────────────────────────────────────
  # 매크로는 공개(정부 시리즈)·로그인(Yahoo·ForexFactory)으로 작업을 나눈다 — 로그인 출처를 받는 작업은
  # pub_* 에 쓰지 않는다(ADR 0002). 설계 §6.7 의 macro.morning 한 줄을 둘로 나눴다.
  - name: macro.morning
    phase: P5
    owner: "kbj.services.collectors.macro:morning"
    schedule: {cron: "20 6 * * *", when: kr_or_after_us}
    retry: {max: 3, backoff_s: [600]}
    collects:
      - {source: FRED, dataset: gov_series, as_of: us_trade_date}
      - {source: FRED, dataset: release_dates, as_of: run_date}
      - {source: TREASURY, dataset: yield_curve, as_of: us_trade_date}
      - {source: NYFED, dataset: rates, as_of: us_trade_date}
    writes: [pub_macro.series, pub_macro.series_meta, pub_macro.calendar]
    absorbs: ["ET:bok.yml@06:40:collect", "ET:bok.yml@09:30"]
    note: "꺼짐(WRAP) — 막는 실측 #43·#45(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 공개 모듈(D-P5-7 — 계약 ⑭: 로그인 원천·저장소를 모른다). 시리즈 목록은 config/macro.yaml(tier public). FRED 발표일 → 경제 캘린더 공개 행(D-P5-8). 공표 전이면 키 미완료(다음 실행에 다시), 값 없는 칸은 None(0 금지). FRED·재무부·뉴욕연은 [실측 필요 #45]"

  - name: macro.morning_prv
    phase: P5
    owner: "kbj.services.collectors.macro_prv:morning"
    schedule: {cron: "20 6 * * *", when: kr_or_after_us}
    retry: {max: 3, backoff_s: [600]}
    collects:
      - {source: YAHOO, dataset: macro, as_of: us_trade_date}
      - {source: FRED, dataset: restricted_series, as_of: us_trade_date}
      - {source: FF, dataset: calendar, as_of: run_date}
    writes: [prv_macro.series, prv_macro.series_meta, prv_macro.calendar]
    absorbs: ["SD:tg_briefing_refresh", "SD:global_data_refresh"]
    note: "꺼짐(WRAP) — 막는 실측 #45·#46·#49 (FF 어댑터는 켬 — 사용자 결정 Q3, config/macro.yaml ff.enabled)(docs/probe_results.md §7), 키 수령·확인 뒤 켬. 로그인 모듈(D-P5-7). Yahoo 12종(SD _MACRO_TICKERS)·FRED 저작권 시리즈(D-P5-6). FF:calendar 는 config/macro.yaml ff.enabled: false(§10 Q3 — 사용자 결정 전)면 부르지 않고 키를 skipped 로. Yahoo [실측 필요 #46]"

  - name: gex.night_minutes
    phase: P7
    runner: external
    owner: "legacy:gexlab/services/scheduler/minute.py:MinuteDaily"
    schedule: {state_enter: [IDLE], when: after_night_session}
    collects:
      - {source: KIS, dataset: fut_minute_night, as_of: trade_date}
    writes: [prv_gex.minute_bars]
    absorbs: ["GX:scheduler:minute_night", "GX:scheduler:gap_night", "GX:scheduler:open_check_night"]
    note: "GX 규칙 그대로 — IDLE 06:10~08:00 야간(CM) 분봉·무결측, 18:03 야간 개장 확인"

  - name: etf.collect
    phase: P3                 # D-P3-12 — P5 에서 당겼다(페이지 10 구성종목 변동)
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.etf_holdings:run"
    schedule: {cron: "0 8 * * 1-5", when: trading_day}
    retry: {max: 3, backoff_s: [900]}
    collects:
      - {source: ETF_ISSUERS, dataset: pdf, as_of: trade_date}
    writes: [prv_etf.fund, prv_etf.holding, prv_etf.change_log, prv_etf.meta]
    absorbs: ["ET:daily.yml"]
    note: "운용사 9곳 어댑터마다 격리(한 운용사 실패가 다른 운용사를 멈추지 않는다), 끝에 구성종목 변동 분석. ETF 리포트 발송(notify etf.report)은 P5"

  - name: kis.master
    phase: P7
    runner: external
    owner: "legacy:gexlab/services/scheduler/service.py:Scheduler"
    schedule: {state_enter: [PRE_DAY, PRE_NIGHT], when: trading_day}
    collects:
      - {source: KIS, dataset: fo_master, as_of: trade_date}
    writes: [prv_gex.master_snapshots]
    absorbs: ["GX:scheduler:master"]
    note: "GX _master_step — 실패하면 60초 뒤 다시(GX 규칙)"

  - name: krx.daily
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.collectors.krx_daily:run"
    schedule: {cron: "5 8 * * 1-5", when: trading_day}
    retry: {every_s: 600, until: "10:00"}     # KRX 는 D+1 08:00 공표(conflict_map E1)
    collects:
      - {source: KRX, dataset: sto/stk_bydd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: sto/ksq_bydd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: sto/knx_bydd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: sto/stk_isu_base_info, as_of: prev_trading_day}
      - {source: KRX, dataset: sto/ksq_isu_base_info, as_of: prev_trading_day}
      - {source: KRX, dataset: idx/kospi_dd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: idx/kosdaq_dd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: idx/krx_dd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: etp/etf_bydd_trd, as_of: prev_trading_day}
      - {source: KRX, dataset: etp/etn_bydd_trd, as_of: prev_trading_day}
    budget: krx
    writes: [prv_market.daily_bar, prv_market.stock_snapshot, prv_market.universe,
             prv_market.eod_reconcile, prv_etf.etf_daily, prv_etf.meta, prv_etf.split_event,
             prv_flows.ledger_check]
    notify: {kind: ops.universe, when: changed}
    absorbs: ["SD:mark_etf_stocks", "SD:kr_universe_daily", "SD:universe_sync_monthly",
              "ET:board@16:10:krx_confirm", "SD:krx_api.*"]
