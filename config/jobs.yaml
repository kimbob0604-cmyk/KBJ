  # 장 끝난 뒤 텔레그램은 전부 16:00(ADR 0018 — 사용자 결정 2026-10-08, 원본 SD·ET 와 같다). 16:00 에
  # 발화해 굳은 의존(market.close_collect — 15:35 시작, 약 24분)을 기다리고, 발송 작업은 같은 16:00 의
  # board.daily 를 무른 의존 wait_min 으로 기다린다(보드 실패는 발송을 막지 않는다). 실제 도착은 마감 수집이
  # 끝난 뒤 — 평소 16:00~16:05 [추정 — 실측 전], 마감 수집이 늦으면 그만큼 늦다(수능일은 close+5 = 16:35 뒤).
  - name: board.daily
    phase: P3
    enabled: true               # 웨이브 3(묶음 S) — 처리기 import 검증 통과
    owner: "kbj.services.engine.board:daily"    # D-P3-5 — 순수 계산은 kbj.engines.board, 실행은 services.engine
    # 실행기에 '의존이 끝나면 시작' 트리거가 없다(triggered_by 미구현 — D-P4-4) → 16:00 cron + 굳은 의존.
    # close_collect 가 16:00 전에 끝났으면 16:00 에 바로, 늦으면 끝난 뒤 30초(DEP_POLL_S) 안에 시작한다.
    schedule: {cron: "0 16 * * 1-5", when: trading_day}
    retry: {max: 2, backoff_s: [600]}
    depends_on: [{job: market.close_collect, hard: true}]
    writes: [prv_board.alltime, prv_board.label, prv_board.split_check, prv_board.stock_day,
             prv_board.artifact]
    absorbs: ["SD:prewarm_new_highs", "SD:stage2_auto", "ET:board@16:10:compute"]
    note: "신고가 계산·랭킹·탐지(DB 만 — LLM 서술은 P8). KIS 마감 스냅으로 잠정 보드(quality estimated), 다음 날 board.confirm 이 KRX 확정으로 덮는다. 16:00 발송(마감 요약·수급 리포트)이 기다리므로 16:00 에 발화해 close_collect(평소 15:35~약 16:00, 수능일 16:35~) 가 끝나는 대로 돈다(ADR 0018)"

  - name: brief.closing
    phase: P5                 # D-P3-17·메인 결정 R18 — 마감 요약은 P5(아침 브리핑과 같은 묶음)
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): 16:00(ADR 0018)
    owner: "kbj.reports.briefs:closing"
    schedule: {cron: "0 16 * * 1-5", when: trading_day, catch_up_until: "20:30"}
    retry: {max: 0}
    depends_on:
      - {job: market.close_collect, hard: true}
      - {job: board.daily, hard: false, wait_min: 20}   # 진행 중인 보드를 최대 20분(재시도 1번) 기다린다
      - {job: diag.daily, hard: false, wait_min: 10}    # P7 — 진단·GEX 마감 줄(D-P7-16). 없으면 '미준비'
    notify: {kind: brief.closing}
    absorbs: ["SD:tg_closing", "SD:tg_closing_summary", "SD:closing_brief_catchup", "SD:agent_pipeline",
              "ET:board@16:10:send", "GX:plan:brief_1550"]
    note: "U2 하루 1회(16:00, 캐치업 20:30 — ADR 0018). 마감 수집(굳은)·보드(무른, 최대 20분 기다림)가 끝난 뒤 나간다 — 평소 16:00~16:05. 보드가 시한 안에 없으면 '미준비'로 적는다. 본문은 P5(R18)"

  - name: flows.report
    phase: P5                 # D-P3-17
    enabled: true             # P5 웨이브 3(WRAP — D-P5-23): 16:00(ADR 0018), 원장만 읽는다
    owner: "kbj.reports.flows:daily"
    schedule: {cron: "0 16 * * 1-5", when: trading_day}
