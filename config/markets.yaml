# 시장·수급·ETF 튜닝값 — 비밀 아님(docs/secrets.md: 튜닝값은 config/*.yaml). 숫자는 이 한 곳(docs/p3_design.md §3.9).
# 해석기는 kbj/config/markets.py 하나(모르는 키는 오류). 근거와 [확인 필요]·[실측 필요] 는 줄마다 주석.
# 금액은 원 단위 정수(metrics §0), 비율은 %.
version: 1

# KIS 거래소 구분(D-P3-9). 실측 전에는 KRX 하나만 부른다 [확인 필요 — 체크리스트 #25].
# venue 를 늘리면 KIS 호출이 배로 는다(§3.7). 합계(TOTAL)는 계산하지 않는다 — 화면에 "NXT 미포함" 꼬리표.
kis:
  venues: [KRX]

# 스크리닝(metrics §3)
screen:
  min_avg_turnover_krw: 30_000_000_000   # 일평균 거래대금 하한 300억 [확인 필요]
  spike_min: 1.5                         # 거래대금 급증 배수 하한(metrics §3)
  spike_min_prior_days: 10               # 직전 거래일이 이보다 적으면 급증 배수를 계산하지 않는다(metrics §1)
  streak_min: 3                          # 연속 순매수 기준(일)

# ETF 수급(metrics §4)
etf:
  # |괴리율| 경고 — KRX 괴리율 관리 기준(국내 1%·해외 2%)에 맞춤 [확인 필요]. 전엔 모두 0.5% 라 해외 ETF(NAV 가
  # 전일 해외 종가라 구조적으로 괴리)의 70% 가 경고였다(2026-10-20: 1,176개 중 426개)
  premium_warn_pct: {default: 1.0, overseas: 2.0, bond: 1.0}
  watch_top_n: 50                                # 장중 iNAV 를 볼 순자산 상위 ETF 수(§3.7) [확인 필요]
  investor_min_net_asset_krw: 100_000_000_000    # 투자자별 ETF 순매수를 받을 순자산 하한 1,000억 [확인 필요]
  split_tol: 0.02                                # 분할·병합 감지 상대오차(§4.3)
  split_ratios: [2, 3, 4, 5, 10, 20, 50, 100]    # 감지할 분할 배수(병합은 1/k)
  holdings:                                      # 구성종목 변동(ET tracker.py:63·64 — 옛 환경변수 QTY_FLOOR·ACTION_PP 대체)
    qty_floor: 100            # 이 수량 미만은 반올림 노이즈로 보고 비중 변동에서 뺀다
    action_pp: 2.0            # CU 재산정 보정 뒤 이 %p 이상 움직여야 ADD·CUT
    max_gap_days: 14          # 비교할 두 스냅의 최대 간격(ET fund_pairs)
    min_base_for_cu: 5        # CU 보정 중앙값을 낼 최소 종목 수(미만이면 보정 0)

# KRX D+1 대조(§3.6)
reconcile:
  close_tol_pct: 0.0          # 종가는 정확히 같아야 한다
  turnover_tol_pct: 0.5       # 거래대금 허용 차이 — KIS 가 클 때만 본다(작으면 시간외 몫, 실측 2026-10-19)
  mktcap_tol_pct: 0.5         # [확인 필요]
  warn_mismatch_pct: 1.0      # 불일치 종목 비율이 이 % 이상이면 health 경고(reconcile_mismatch)

# 시장 화면(§4.4)
market:
  # 장중 지수(KIS:index_quote_intraday) — KIS 업종 코드 [실측 필요 — 체크리스트 #24]
  intraday_indices: {"0001": 코스피, "1001": 코스닥, "2001": 코스피200}
  # 업종 히트맵 셀 = KRX 업종지수. 코드 = KRX 지수 일별의 공백 뺀 이름(krx_daily.index_code) —
  # 2026-10-18 DB 실측(2026-10-15 하루치 목록). 이름만 있는 것 = 코스피 목록, '코스닥' 접두어 = 코스닥 목록.
  # 장중 셀(KIS 업종 코드)은 이 이름과 연결표가 없어 아직 없다(장 마감 뒤 KRX 일봉 값)
  sector_indices:
    - 음식료·담배
    - 섬유·의류
    - 종이·목재
    - 화학
    - 제약
    - 비금속
    - 금속
    - 기계·장비
    - 전기전자
    - 의료·정밀기기
    - 운송장비·부품
    - 전기·가스
    - 건설
    - 유통
    - 운송·창고
    - 통신
    - 금융
    - 증권
    - 보험
    - 일반서비스
    - 부동산
    - IT서비스
    - 오락·문화
    - 제조
    - 코스닥음식료·담배
    - 코스닥섬유·의류
    - 코스닥종이·목재
    - 코스닥출판·매체복제
    - 코스닥화학
    - 코스닥제약
    - 코스닥비금속
    - 코스닥금속
    - 코스닥기계·장비
    - 코스닥전기전자
    - 코스닥의료·정밀기기
    - 코스닥운송장비·부품
    - 코스닥기타제조
    - 코스닥건설
    - 코스닥유통
    - 코스닥운송·창고
    - 코스닥통신
    - 코스닥금융
    - 코스닥일반서비스
    - 코스닥IT서비스
    - 코스닥오락·문화
    - 코스닥제조
  limit_move_pct: 29.5        # 상한가·하한가 판정(가격제한폭 30% 와 호가 단위 — [추정])

# 상단 띠(§4.4 — v0.2 plan_kr:60~64)
ribbon:
  semis: ["005930", "000660"]  # 반도체 쏠림 — 삼성전자·SK하이닉스(시총가중, 전일 시총)
  # 경기민감 대 방어 — 코스피 업종지수(KRX 이름 코드, sector_indices 의 것). 2026-10-20 사용자 요청으로 채움:
  # 경기민감 = 소재·산업재·금융(경기 순환에 민감), 방어 = 필수소비·통신·유틸리티·헬스케어
  cyclical: [화학, 금속, 기계·장비, 운송장비·부품, 건설, 증권]
  defensive: [음식료·담배, 통신, 전기·가스, 제약]

# ── P5 F2 장중 투자자 수급 1분(docs/p5_design.md §3.4·D-P5-21, docs/p5_flow_program_prompt.md §1.1·§1.3) ──
# flows.market_minute 이 부르는 (시장 코드, 업종 코드) 조합 — 켠 것만 부른다(하루 호출 = 켠 조합 × 401분).
# KIS FHPTJ04030000(시장별 투자자매매동향(시세)) 의 FID_INPUT_ISCD·FID_INPUT_ISCD_2.
# 코드 출처(KIS 공식 레포 koreainvestment/open-trading-api, 커밋 2077773 — 2026-10-19 확인):
#   legacy/postman/실전계좌_POSTMAN_샘플코드_v2.6.json 의 이 TR 입력 설명
#   https://github.com/koreainvestment/open-trading-api/blob/main/legacy/postman/%EC%8B%A4%EC%A0%84%EA%B3%84%EC%A2%8C_POSTMAN_%EC%83%98%ED%94%8C%EC%BD%94%EB%93%9C_v2.6.json
#   "시장구분 코스피: KSP, 코스닥:KSQ, 선물,콜옵션,풋옵션 : K2I, 주식선물:999 … 위클리월 : WKM, 위클리목: WKI"
#   "업종구분 KSP(코스피)·KSQ(코스닥)인 경우 코스피(0001_종합 …) 코스닥(1001_종합 …) / K2I 면 F001(선물)·
#    OC01(콜옵션)·OP01(풋옵션) / 999 면 S001(주식선물) / WKM 면 OC05·OP05 / WKI 면 OC04·OP04"
# 이 TR 은 호출 순간의 오늘 누적 한 줄이다(HTS [0403] 시장별 시간동향의 '상단 표' — 분 이력 없음, 같은 레포
# examples_llm/domestic_stock/inquire_investor_time_by_market). 못 받은 분은 뒤에서 다시 받을 수 없다.
# tab = 페이지 1 시장 탭 id. 위클리 4조합은 GX 실측 #13(7조합 정상 응답)을 근거로 P7 WRAP 이 켰다(D-P7-6).
# index = 차트에 겹칠 지수(market.intraday_indices 의 KIS 업종 코드 — 장중 10분 값). 없으면 지수 선 없음.
# 현물 금액 단위는 선물·옵션과 같은 백만원으로 본다 [확인 필요 — 마감 뒤 일별 확정과 대조(검산 ③)].
# 야간(k200_fut_night)은 꺼진 채 — 실행기에 야간 분 트리거가 없고 야간 응답 실측도 없다(#P7-2).
flows:
  minute:
    pairs:
      - {id: k200_fut, market: K2I, sector: F001, session: day, tab: k200_fut, label: 코스피200 선물, enabled: true, index: "2001", note: "GX probe_investor 실측 2026-09-28"}
      - {id: k200_call, market: K2I, sector: OC01, session: day, tab: k200_call, label: 콜옵션, enabled: true, index: "2001", note: "GX 실측 2026-09-28"}
      - {id: k200_put, market: K2I, sector: OP01, session: day, tab: k200_put, label: 풋옵션, enabled: true, index: "2001", note: "GX 실측 2026-09-28"}
      - {id: kospi, market: KSP, sector: "0001", session: day, tab: kospi, label: 코스피, enabled: true, index: "0001", note: "KIS 공식 Postman 샘플 v2.6 — KSP·0001(종합)"}
      - {id: kosdaq, market: KSQ, sector: "1001", session: day, tab: kosdaq, label: 코스닥, enabled: true, index: "1001", note: "KIS 공식 Postman 샘플 v2.6 — KSQ·1001(종합)"}
      - {id: stock_fut, market: "999", sector: S001, session: day, tab: stock_fut, label: 주식선물, enabled: true, note: "KIS 공식 예제 기본값 999·S001(주식선물)"}
      - {id: wkm_call, market: WKM, sector: OC05, session: day, tab: weekly, label: 위클리(월) 콜, enabled: true, index: "2001", note: "GX 실측 #13(7조합 정상 응답) — P7 WRAP 이 켬(D-P7-6)"}
      - {id: wkm_put, market: WKM, sector: OP05, session: day, tab: weekly, label: 위클리(월) 풋, enabled: true, index: "2001", note: "GX 실측 #13(7조합 정상 응답) — P7 WRAP 이 켬(D-P7-6)"}
      - {id: wki_call, market: WKI, sector: OC04, session: day, tab: weekly, label: 위클리(목) 콜, enabled: true, index: "2001", note: "GX 실측 #13(7조합 정상 응답) — P7 WRAP 이 켬(D-P7-6)"}
      - {id: wki_put, market: WKI, sector: OP04, session: day, tab: weekly, label: 위클리(목) 풋, enabled: true, index: "2001", note: "GX 실측 #13(7조합 정상 응답) — P7 WRAP 이 켬(D-P7-6)"}
      - {id: k200_fut_night, market: K2I, sector: F001, session: night, tab: k200_fut, label: 코스피200 선물(야간), enabled: false, note: "야간 세션 [확인 필요] — P7"}

# ── P5 F2 프로그램매매(F2 §1.4·§3.4, metrics §22) ──
program:
  scan_top_n: 30                  # 장중 종목 훑기 = 거래대금 상위 N(KIS:turnover_rank_intraday) [확인 필요 #41 — 한 번에 오는 개수]
  scan_watch_max: 20              # + 관심종목 최대 수(장중 호출 예산 §3.4 — (30 + 20) × 38슬롯 ≈ 1,900)
  sweep_markets: [K, Q]           # 마감 뒤 전 종목 훑기 시장(코스피·코스닥 — 약 2,700종목)
  daily_days: 60                  # 일별 막대·백필 거래일 수(F2 §0-2)
  top_n: 20                       # 순매수·순매도 상위 표 행 수(F2 §0-3)
