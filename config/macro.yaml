# 매크로 시리즈·탭·캘린더 — 비밀 아님. 숫자·목록은 이 한 곳(docs/p5_design.md §3.6·§4.1, D-P5-5~8).
# 해석기는 kbj/config/macro.py 하나(모르는 키는 오류). 시험 tests/unit/config/test_p5_config.py 가 시리즈마다
# tier 를 카탈로그 데이터셋 tier 와 대조한다(D-P5-6 — 한 데이터셋에 공개·로그인을 섞지 않는다).
#
# - series[].id = 저장 키(pub_macro·prv_macro.series.series_id) — '<출처>:<표>[:<항목>]' 또는 '<출처>:<심볼>'.
# - item = 출처 안 항목 코드(ECOS ITEM_CODE·KOSIS ITM_ID). 실측 전이라 모르는 것은 null + probe 번호 —
#   코드를 지어내지 않는다. item 이 null 인 시리즈는 수집기가 부르지 않는다(키 skipped — MAC 이 실측 뒤 채움).
# - brief: 아침 브리핑 ② '금리·달러·원자재 한 표'에 싣는가(config/briefs.yaml 이 순서를 정한다).
# - FRED 시리즈 id 는 FRED 공개 id 그대로. 저작권 시리즈(S&P·ICE BofA·CBOE)는 FRED:restricted_series(로그인).
#   시리즈별 저작권 표시는 [실측 필요 #45](FRED series notes) — 애매하면 로그인(DATA_TIERS 원칙, R10).
# - item 이 있어도 probe 가 붙은 시리즈는 [실측 필요](코드는 공개 id 그대로지만 단위·공표 시각·저작권 표시를 실응답으로
#   확인 전 — FRED #45, Yahoo #46). 부르기는 한다(ready) — 화면·API 는 probe 를 함께 보인다(MAC).
# - 미 재무부·뉴욕연은은 공개 [확인 필요 — DATA_TIERS §1 행 추가, §10 Q8].
version: 1

