# 종목 스크리너(페이지 11 '스크리너' 패널 — kbj/engines/screen, 해석기 kbj/config/screen.py).
#
# cis 순추세: 전 거래일 종가 기준 '거래량이 튄' 종목 중 박스권을 거래량 실어 뚫은 것.
# 근거(2026-10-26 조사): "사는 주식을 사고 팔리는 주식을 판다", "오르는 주식은 계속 오른다",
# 가격·거래량만 본다(Bloomberg 인용), 물타기 금지, 이익은 길게. 숫자 규칙은 cis 본인이 공개한 적이
# 없다 — 아래 값은 우리 출발점이고 백테스트로 다시 정한다. 매매 권유가 아니다(주문 코드 없음).
cis:
  lookback_days: 20                  # 평균 거래량·평균 거래대금·박스권 창(오늘을 뺀 직전 거래일 수)
  vol_mult: 3.0                      # 오늘 거래량 ≥ 직전 평균 × 이 값 → '거래량 급증'
  min_turnover_won: 5000000000       # 오늘 거래대금 ≥ 50억 원
  min_avg_turnover_won: 1000000000   # 직전 평균 거래대금 ≥ 10억 원(평소 유동성)
  min_price: 1000                    # 종가 ≥ 1,000원
  close_pos_min: 0.75                # (종가−저가)/(고가−저가) ≥ 이 값 — 윗꼬리 긴 날은 뺀다
  limit_pct: 29.0                    # 등락률 ≥ 이 값이면 '상한가 근처'(재료 역추세 — 따로 표시, 통과에서 뺀다)
  regime_ma: 20                      # 시장 지수 종가 > 이 일선이면 시장 국면 '켜짐'
  index: {KOSPI: ["코스피", "0001"], KOSDAQ: ["코스닥", "1001"]}  # 지수 일봉 코드 후보(앞에서부터 있는 것)
  max_rows: 60                       # 화면에 싣는 줄 상한(통과 먼저, 거래량 배수 큰 순)
  # 다음 날 계획(표에 함께 보이는 값 — 백테스트 기본값과 같다)
  plan:
    stop_pct: 2.0                    # 최초 손절: 진입가 −2%
    trail_pct: 8.0                   # 추적 손절: 보유 중 최고가 −8%
    gap_skip_pct: 8.0                # 다음 날 시가가 종가 +8% 넘으면 건너뜀(추격 금지)
    add_at_pct: 5.0                  # 불타기: +5% 이고 신고가일 때 처음 수량의 50% 한 번
    risk_pct: 1.0                    # 한 번에 거는 위험 = 시험 자금의 1%
    max_positions: 5
