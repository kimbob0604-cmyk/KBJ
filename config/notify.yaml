# 알림 발송 규칙 — 해석기는 kbj/services/notifier/policy.py 하나(모르는 키는 오류).
# 근거: docs/p2_design.md §5.2(종류·토픽)·§5.3(중복 키·쿨다운)·§5.5(발송 꺼짐), U2.
# 채팅 id 는 비밀 취급이라 여기 두지 않는다(KBJ_TELEGRAM_CHAT_ID). 발송 스위치는 KBJ_NOTIFY_ENABLED(기본 false).
#
# dedup(중복 방지 규칙) — 키는 Redis notify:dedup:<키>(SET NX) + ops.notify_log.dedup_key(UNIQUE):
#   daily     하루 1회   {kind}:{as_of YYYYMMDD}[:{subject}]   36시간
#   cooldown  쿨다운     {kind}:{subject 또는 본문 해시} — 마지막 발송부터 cooldown_s   cooldown_s
#   subject   대상별 1회 {kind}:{subject 또는 본문 해시}                             30일
#   body      그 밖      {kind}:{as_of}:{sha256(본문) 16자}                           24시간
# ttl_s 를 적으면 문지기 수명을 바꾼다. catch_up_until(KST, as_of 날짜)이 지나면 보내지 않는다(failed).
version: 1

# 토픽 → message_thread_id. 슈퍼그룹을 만든 뒤 적는다 [확인 필요] — 비어 있으면 일반 대화로 보내고
# 경고(notify_topic_missing, R16).
topics:
  market: null    # 시장 — 아침 브리핑·마감 요약·수급 리포트·ETF 리포트
  newhigh: null   # 신고가 — 보드 HTML·랭킹 엑셀·노트
  alert: null     # 알림 — 규칙·관심종목·트레일링·어닝·리비전·GEX 레벨
  ops: null       # 운영 — 워치독·작업 실패·헬스·유니버스 변동

kinds:
  # ── 시장 — U2: 아침 브리핑 1회·마감 요약 1회 ─────────────────────────────────────────
  brief.morning:
    topic: market
    dedup: daily
    note: "U2 하루 1회. 작업 brief.morning 08:10(본문은 P5). 흡수 legacy #3·#4·#5·#15(오전)·#29·#30·#38"
  brief.closing:
    topic: market
    dedup: daily
    catch_up_until: "20:30"
    note: "U2 하루 1회, 캐치업 20:30 까지. 작업 brief.closing 16:00(ADR 0018 — 마감 수집·보드가 끝난 뒤, 평소 16:00~16:05. 본문은 P5). 흡수 #8·#9·#15(오후)·#23~#26"
  flows.report:
    topic: market
    dedup: daily
    parse_mode: Markdown   # ET monitor/flow 본문 그대로(BRF — run.py 가 호출마다 넘기던 값을 정책으로)
    note: "작업 flows.report 16:00(ADR 0018 — 평소 16:00~16:05). 16:00 수급은 KIS 마감 수집 값(잠정일 수 있음)이거나 전 거래일 값 — 본문에 실제 기준일을 적는다. 흡수 #11·#39·#40"
  etf.report:
    topic: market
    dedup: daily
    note: "작업 etf.report 08:20(P5 — D-P5-13 ④, 굳은 의존 etf.collect 08:00). 브리핑이 아니라 별도 1회(U2 의 브리핑 1회에 세지 않는다 — §10 Q5). 흡수 #34"

  # ── 신고가·ET 보드 (전환 기간: ET 가 kind 를 넘긴다 — 마감 요약에 합치는 것은 P3) ──────────
  board.rankings:
    topic: market
    dedup: body
    parse_mode: Markdown
    note: "ET cmd_send('rankings') #23 → P3 에 brief.closing ③"
  board.draft:
    topic: market
    dedup: body
    parse_mode: Markdown
    max_parts: 20
    note: "ET cmd_send('draft') #24 → P3 에 brief.closing ⑧. 초안은 자르지 않고 전부 보낸다(ET D-084)"
  board.signals:
    topic: market
    dedup: body
    parse_mode: Markdown
    note: "ET cmd_send('signals') #26 → P3 에 brief.closing ⑦"
  board.files:
    topic: newhigh
    dedup: body
    note: "ET run._send_files #25 — 보드 HTML·랭킹 엑셀 첨부"
  board.note:
    topic: newhigh
    dedup: body
    parse_mode: Markdown
    note: "ET run._send_note #27(수동)"
  board.us:
    topic: market
    dedup: body
    note: "ET run.cmd_us_send #29 → P5 brief.morning ① 로 대체(us.eod 가 쓴 us_brief 산출을 읽는다). legacy 송신 정리는 WRAP"
  board.manual:
    topic: ops
    dedup: body
    parse_mode: Markdown
    note: "ET cmd_send('backtest'·'screen'·'search') #28(수동)"

  # ── 알림 ───────────────────────────────────────────────────────────────────────────
  alert.rule:
    topic: alert
    dedup: cooldown
    cooldown_s: 3600
    note: "장중 규칙 알림 — 사건 시점(정규장 10분 슬롯). subject = <rule_id>:<code>, 60분은 안전망이고 규칙 쿨다운(기본 24시간·하한 60분)은 엔진 상태기가 신호 표로 판정한다(D-P8-10). 근거에 '장중(잠정)'·장중 수급은 '장중 잠정'(사용자 결정 2026-10-13). 작업 rules.intraday(P8). 흡수 #6·#12·#13(#14 발굴 신규 진입은 P8 폐지 — jobs.yaml retired)"
  alert.rule_close:
    topic: alert
    dedup: daily
    catch_up_until: "20:30"
    note: "마감 규칙 알림 16:00 한 통 묶음(ADR 0018 — 사용자 결정 2026-10-13 Q1, 0건이면 보내지 않음). 규칙별 종목 줄, 30종목 넘으면 '외 N' + 페이지 11 링크. 머리에 '16:00 기준 KIS 마감 값(잠정일 수 있음)'. 작업 rules.close(P8)"
  alert.earnings:
    topic: alert
    dedup: subject
    note: "관심종목 잠정실적(우선순위 ≤ 2 — config/fin.yaml earnings.alert_max_priority)만 사건 시점 push. subject = <corp_code>:<회계기간>:<연결/별도>(접수번호가 아니다 — 정정공시가 30일 안에 다시 울리지 않게, D-P4-14). 일반 공시는 push 하지 않는다. 작업 earnings.alerts(P4 — 5분 폴링, 장 마감 뒤 사건도 바로 — ADR 0018 의 16:00 대상 아님). 흡수 #16"
  alert.revision:
    topic: alert
    dedup: daily
    note: "관심종목 리비전(|pct| ≥ 5 — config/fin.yaml consensus.alert_min_abs_pct) 하루 1통 묶음, 0건이면 보내지 않는다. 작업 consensus.snapshot 16:00(P4, ADR 0018 — 마감 수집 뒤 약 3분 수집하고 보낸다, 평소 16:00~16:05. 실데이터 확인 #29 전까지 작업이 꺼져 있다 — D-P4-10). 흡수 #10"
  trade.preview:
    topic: alert
    dedup: subject
    note: "실적 프리뷰(P10 단계 3 — docs/p10_trade_stocks_plan.md) — 마지막 달 통관이 들어와 판정(BEAT·IN LINE·MISS)이 바뀐 매핑 종목 한 통 묶음, 0건이면 보내지 않는다. subject = 마지막 달(YYYY-MM — 달마다 한 번). 30종목 넘으면 '외 N'. 규칙 문장(LLM 아님)·매매 권유 아님. 작업 trade.preview 16:00(ADR 0018)"
  alert.gex_level:
    topic: alert
    dedup: cooldown
    cooldown_s: 600
    note: "GX 설계 쿨다운 10분. 보내는 작업은 gex.alert 하나(P7 — 정규장 09:00~15:30 매분, §10 Q5). visible 지표만: Flip 건넘·콜월/풋월 행사가 바뀜·기대변동폭 ±1σ 밖(D-P7-17 [제안]). 엔진 서비스는 보내지 않는다. 15:30 뒤·야간 변화는 16:00 마감 요약·아침 브리핑에만. #42 계획"

  # ── 운영 ───────────────────────────────────────────────────────────────────────────
  ops.watchdog:
    topic: ops
    dedup: cooldown
    cooldown_s: 1800
    note: "같은 공백 30분. 작업 ops.watchdog. 흡수 #18, GX health"
  ops.job_failed:
    topic: ops
    dedup: subject
    note: "작업·as_of 마다 1회(subject = '<작업>:<as_of>'). 실행기. 흡수 #37"
  ops.universe:
    topic: ops
    dedup: daily
    note: "작업 krx.daily. 흡수 #17"

  # ── 명령 응답 — 받은 대화·스레드로. subject = 'u<update_id>'(chat id 는 키에 넣지 않는다) ─────
  cmd.reply:
    topic: reply
    dedup: subject
    ttl_s: 172800
    note: "§5.7. 같은 업데이트에 두 번 답하지 않는다(48시간 — tg:update 와 같다). #21"

# P9(LEGACY): 전환 기간의 legacy 발송 종류(legacy.other)·legacy_kinds·legacy_default_kind 는 ET·SD 를
# 지우며 같이 지웠다 — 모든 발송은 kbj 작업이 kind 를 넘긴다(docs/p9_design.md 'LEGACY 구현 기록').

delivery:
  max_attempts: 8              # 네트워크·5xx·429 초과는 재시도, 그 밖 4xx 는 바로 failed.
                               # 10·20·40·80·160·300·300초 — 맥이 깨어난 직후 DNS 가 몇 분 안 될 때도(10-27 08:47) 15분 버틴다
  retry_initial_s: 10
  retry_max_s: 300
  max_attachment_bytes: 20971520   # 20 MiB [제안] — 첨부는 대기열에 바이트로 싣는다(봇 API 한도 50 MB)
  backlog_warn: 500            # notify:outbox 가 이만큼 쌓이면 경고
  webhook_check_s: 600         # getWebhookInfo 점검 주기(ET triggers.py:812 #46 대체)
  webhook_pending_warn: 100    # 대기 업데이트 급증 경고

inbox:
  keep_days: 14                # ET KEEP_DAYS — ops.nightly 가 지운다
  oembed_timeout_s: 20
