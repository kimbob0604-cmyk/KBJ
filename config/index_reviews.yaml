# ── 일정 — 공표 일정표를 사람이 적는다(계산 추정 금지) ──────────────────────────────────────────────
# base = 기준일(시총·유동비율을 재는 날 — MSCI 는 리뷰 전월 마지막 10영업일 중 비공개 하루라 그 끝날을
# 대용 — GIMI §3.1.9 Price Cutoff, KRX 는 심사기준일). announce = 결과 발표일(KST — MSCI 는 CET 23:00 께
# 발표라 한국 날짜는 다음 날 오전). trade = 패시브 매매일(효력일 직전 영업일 종가). effective = 효력일.
# confirmed: false = 공표 일정표와 대조 전 — 화면이 '추정'으로 보인다.
# MSCI: 공식 일정표 "MSCI Announces the Next Eight Index Review Dates"(2026-08-12)·사전 공지로 확인(2026-10-14).
reviews:
  msci_korea:
    - {id: "2026-02", base: 2026-01-30, announce: 2026-02-11, trade: 2026-02-27, effective: 2026-03-02, confirmed: true}
    - {id: "2026-05", base: 2026-04-30, announce: 2026-05-13, trade: 2026-05-29, effective: 2026-06-01, confirmed: true}
    - {id: "2026-08", base: 2026-07-31, announce: 2026-08-13, trade: 2026-08-31, effective: 2026-09-01, confirmed: true}
    - {id: "2026-11", base: 2026-10-30, announce: 2026-11-12, trade: 2026-11-30, effective: 2026-12-01, confirmed: true}
  # KRX 2026-12: base(10월 마지막 거래일)·trade(12월 선물옵션 만기 둘째 목요일)·effective(그다음 날)는 원칙과
  # 맞다. announce 는 공표 일정을 못 찾음 — 선례(2024-11-21·2025-11-18) 추정이라 confirmed: false.
