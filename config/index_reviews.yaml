# ── MSCI 형 규칙(컷오프 배수) ───────────────────────────────────────────────────────────────────
# 컷오프(Interim Market Size-Segment Cutoff)는 MSCI 가 공표하지 않는다 → 시장 커버리지 방식으로 추정:
# 전체 시총 내림차순으로 유동시총을 누적해 coverage 에 처음 닿는 종목의 전체 시총. 구간 = coverage_low·high.
# (원문도 Interim Cutoff 를 리뷰 뒤 NOS·FIF 로 같은 방식으로 계산한다 — 각주 20. Global Minimum Size Range 로
# 위아래를 자르는 단계는 없다 [확인 필요].)
# 배수(GIMI 2026-08판 §3.1.5·§3.1.6 — 2023-02 부터 2·5·8·11월 리뷰 모두 Quarterly Comprehensive Review):
# 비구성종목 시총 ≥ 1.0 × 컷오프, 하위 세그먼트(Small Cap) 구성종목의 이동은 upper buffer 1.5 ×, 신규 유동시총
# ≥ 0.5 × 컷오프, 유지 ⅔·⅓. 유동비율 < 15% 종목은 유동시총 ≥ 0.9 ×(신규)·0.6 ×(유지). 비구성종목이 Small Cap
# 구성종목인지 모르면 segment_default(migrate = 1.5 × — 보수적). 1.8 × · 0.9 × 는 Light Rebalancing(시장
# 스트레스 때 MSCI 가 따로 공지)·거래기간 미달 신규에만 쓰인다 → light_rebalance(기본 꺼짐).
msci:
  msci_korea:
    coverage: {v: 0.85, src: "GIMI 2026-08판 §2.3.1 — Standard 지수 유동시총 커버리지 85%", checked: 2026-10-14, verify: false}
    coverage_low: {v: 0.80, src: "GIMI 2026-08판 §2.3.1 — 커버리지 85% ± 5%", checked: 2026-10-14, verify: false}
    coverage_high: {v: 0.90, src: "GIMI 2026-08판 §2.3.1 — 커버리지 85% ± 5%", checked: 2026-10-14, verify: false}
    add_mcap_mult_new: {v: 1.0, src: "GIMI 2026-08판 §3.1.5·§3.1.6 — 새로 투자 가능해진 비구성종목 시총 ≥ 컷오프", checked: 2026-10-14, verify: false}
    add_mcap_mult_migrate: {v: 1.5, src: "GIMI 2026-08판 §3.1.5·§3.1.6 — 하위 세그먼트 upper buffer(컷오프 1.5배)", checked: 2026-10-14, verify: false}
    add_ff_mult: {v: 0.5, src: "GIMI 2026-08판 §3.1.5·§3.1.6 — 신규 유동시총 ≥ 50% × 컷오프", checked: 2026-10-14, verify: false}
    keep_mcap_mult: {v: 0.6667, src: "GIMI 2026-08판 §3.1.5·§3.1.6 — lower buffer(컷오프 ⅔)", checked: 2026-10-14, verify: false}
    keep_ff_mult: {v: 0.3333, src: "GIMI 2026-08판 §3.1.5·§3.1.6 — 기존 유동시총 ≥ ⅔ × 50% 컷오프", checked: 2026-10-14, verify: false}
    min_fif_add: {v: 0.15, src: "GIMI 2026-08판 §2.2.6 — 최소 유동비율 15%(아래는 low_fif 배수로 예외 편입)", checked: 2026-10-14, verify: false}
    low_fif_ff_mult_add: {v: 0.9, src: "GIMI 2026-08판 §3.1.2.5·§2.3.6.1 — FIF<0.15 신규 유동시총 ≥ 1.8 × 50% 컷오프", checked: 2026-10-14, verify: false}
    low_fif_ff_mult_keep: {v: 0.6, src: "GIMI 2026-08판 §3.1.6 — FIF<0.15 기존 유동시총 ≥ ⅔ × 1.8 × 50% 컷오프", checked: 2026-10-14, verify: false}
    segment_default: migrate  # 비구성종목의 Small Cap 구성 여부를 모를 때(1.5 ×). 자료가 생기면 StockIn.lower_segment
    light_rebalance:
      enabled: false          # MSCI 가 Light Rebalancing 을 공지한 리뷰에만 true
      add_mcap_mult: {v: 1.8, src: "GIMI 2026-08판 App.VIII — Light Rebalancing 비IMI 종목 시총 ≥ 1.8 × 컷오프", checked: 2026-10-14, verify: false}
      add_ff_mult: {v: 0.9, src: "GIMI 2026-08판 App.VIII — Light Rebalancing 유동시총 ≥ 1.8 × 50% 컷오프", checked: 2026-10-14, verify: false}
    borderline: {v: 0.10, src: "KBJ 표시 규칙 — 조건 괴리율이 ±10% 안이면 '경계'", checked: 2026-10-13, verify: false}
    adv_days: {v: 20, src: "KBJ — 일평균 거래대금 창(거래일)", checked: 2026-10-13, verify: false}
    aum_won: {v: null, src: "MSCI Korea 추종 패시브 자금(EM·ACWI 내 한국 비중 포함) — 사용자가 증권사 추정치를 넣는다", checked: 2026-10-13, verify: true}
    exclude_flags: [halted, liquidation]
    kinds: [common]
  ftse_korea:
    coverage: {v: 0.85, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    coverage_low: {v: 0.80, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    coverage_high: {v: 0.90, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    add_mcap_mult_new: {v: 1.0, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    add_mcap_mult_migrate: {v: 1.0, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    add_ff_mult: {v: 0.5, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    keep_mcap_mult: {v: 0.6667, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    keep_ff_mult: {v: 0.3333, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    min_fif_add: {v: 0.05, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    borderline: {v: 0.10, src: "KBJ 표시 규칙", checked: 2026-10-13, verify: false}
    adv_days: {v: 20, src: "KBJ — 일평균 거래대금 창(거래일)", checked: 2026-10-13, verify: false}
    aum_won: {v: null, src: "FTSE Korea 추종 패시브 자금 — 사용자 입력", checked: 2026-10-13, verify: true}
    exclude_flags: [halted, liquidation]
    kinds: [common]

# ── KRX 형 규칙(시총 순위·완충) — KRX 방법론 원문(index.krx.co.kr)은 직접 받지 못했다: 2차 자료 근사 ──────────
# 심사 시총 = 심사기간(6개월 — 6월 변경은 전년 11~4월, 12월 변경은 5~10월) 일평균 시총. 평균을 못 내면 기준일
# 시총으로 대체(추정). 산업군마다 심사 시총 내림차순으로
# 신규: 산업군 안 순위 ÷ 산업군 구성종목 수 ≤ add_rank_ratio 이고 산업군 누적 시총 비중 sector_cum_mcap 이내
#      (자기보다 큰 종목들의 비중 < 문턱 — 문턱에 처음 닿는 종목까지),
# 기존: 산업군 안 순위 ÷ 산업군 구성종목 수 ≤ keep_rank_ratio 면 유지.
# 유동성: 산업군 안 일평균 거래대금 순위 백분위 ≤ liquidity_pct. 상장 min_listing_days 미만은 제외하되
# 전체 시총 순위 ≤ fast_entry_rank 면 특례(신규 상장 특례). 수를 size 에 맞춘다(넘치면 순위 낮은 신규를 '경계',
