    "66": "금융"

# ── MSCI 형 규칙(컷오프 배수) ───────────────────────────────────────────────────────────────────
# 컷오프(Interim Market Size-Segment Cutoff)는 MSCI 가 공표하지 않는다 → 시장 커버리지 방식으로 추정:
# 전체 시총 내림차순으로 유동시총을 누적해 coverage 에 처음 닿는 종목의 전체 시총. 구간 = coverage_low·high.
# 배수는 문서마다 다르다(옛 요약 2014: 1.8× · ½, 사용자 리포트: 1.5× · ½, 하나증권 표: 유동 ⅓) — 현행
# GIMI 방법론(2026-03판) 원문과 대조 전 [확인 필요].
msci:
  msci_korea:
    coverage: {v: 0.85, src: "MSCI GIMI — Standard 지수 유동시총 커버리지 85%", checked: 2026-10-13, verify: true}
    coverage_low: {v: 0.80, src: "커버리지 허용 구간 ±5%p", checked: 2026-10-13, verify: true}
    coverage_high: {v: 0.90, src: "커버리지 허용 구간 ±5%p", checked: 2026-10-13, verify: true}
    add_mcap_mult: {v: 1.8, src: "MSCI 방법론 요약(2014) — 신규 편입 시총 ≥ 1.8 × 컷오프", checked: 2026-10-13, verify: true}
    add_ff_mult: {v: 0.9, src: "MSCI 방법론 요약(2014) — 신규 편입 유동시총 ≥ 1.8 × ½ 컷오프", checked: 2026-10-13, verify: true}
    keep_mcap_mult: {v: 0.6667, src: "MSCI 방법론 — 기존 구성종목 유지 시총 ≥ ⅔ × 컷오프", checked: 2026-10-13, verify: true}
    keep_ff_mult: {v: 0.3333, src: "기존 구성종목 유지 유동시총 ≥ ⅔ × ½ 컷오프(하나증권 표의 ⅓)", checked: 2026-10-13, verify: true}
    min_fif_add: {v: 0.15, src: "MSCI 방법론 — 신규 편입 최소 유동비율 15%", checked: 2026-10-13, verify: true}
    borderline: {v: 0.10, src: "KBJ 표시 규칙 — 조건 괴리율이 ±10% 안이면 '경계'", checked: 2026-10-13, verify: false}
    adv_days: {v: 20, src: "KBJ — 일평균 거래대금 창(거래일)", checked: 2026-10-13, verify: false}
    aum_won: {v: null, src: "MSCI Korea 추종 패시브 자금(EM·ACWI 내 한국 비중 포함) — 사용자가 증권사 추정치를 넣는다", checked: 2026-10-13, verify: true}
    exclude_flags: [halted, liquidation]
    kinds: [common]
  ftse_korea:
    coverage: {v: 0.85, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    coverage_low: {v: 0.80, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    coverage_high: {v: 0.90, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    add_mcap_mult: {v: 1.0, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    add_ff_mult: {v: 0.5, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    keep_mcap_mult: {v: 0.6667, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    keep_ff_mult: {v: 0.3333, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    min_fif_add: {v: 0.05, src: "FTSE GEIS 규칙 [확인 필요]", checked: 2026-10-13, verify: true}
    borderline: {v: 0.10, src: "KBJ 표시 규칙", checked: 2026-10-13, verify: false}
    adv_days: {v: 20, src: "KBJ — 일평균 거래대금 창(거래일)", checked: 2026-10-13, verify: false}
    aum_won: {v: null, src: "FTSE Korea 추종 패시브 자금 — 사용자 입력", checked: 2026-10-13, verify: true}
    exclude_flags: [halted, liquidation]
    kinds: [common]

# ── KRX 형 규칙(시총 순위·완충) — KRX 지수 산출 방법론 원문을 옮기기 전 근사 [확인 필요] ──────────────
# 순위 = 기준일 전체 시총 내림차순(KRX 는 심사기간 일평균 시총 — [확인 필요]).
# 신규: 순위 ≤ size × add_rank_ratio, 기존: 순위 ≤ size × keep_rank_ratio 면 유지.
# 유동성: 산업군 안 일평균 거래대금 순위 백분위 ≤ liquidity_pct. 상장 min_listing_days 미만은 제외하되
