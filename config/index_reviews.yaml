# 패시브 지수 정기변경(편입·편출) 예측 설정 — 규칙의 모든 숫자·일정은 이 파일 한 곳(P5 2차 묶음 IDX).
# 근거: docs/p5_index_rebalance_prompt.md §1·§3, docs/metrics.md §24. 해석기: kbj/config/index_reviews.py.
#
# 규칙
# - 숫자는 전부 `{v: 값, src: 출처, checked: 확인일, verify: true|false}` 모양이다. verify: true = [확인 필요]
#   (원문과 대조 전 기본값 — 화면·문서가 '추정'으로 보인다). 사용자가 원문으로 확인하면 v 를 고치고
#   verify: false 로 바꾼다(코드는 그대로 — 엔진은 이 값만 읽는다).
# - 날짜는 운용사·거래소가 공표한 일정표를 사람이 적는다(계산으로 추정하지 않는다). 공표 확인 전 날짜는
#   confirmed: false — 일정 표(prv_index.review_calendar)에 quality=estimated 로 들어가고 화면이 '추정'으로 보인다.
# - 현 구성종목 목록은 이 파일에 넣지 않는다(MSCI·KRX 자료 — 로그인 등급, DB prv_index.constituents 에만.
#   `python -m kbj.services.engine.index_review load-constituents` 로 VM 에서 올린다). 레포에는 합성 목록만.
# - 패시브 자금 규모(aum)는 사용자 입력 전 null — null 이면 예상 패시브 매매를 계산하지 않는다(지어내지 않음).
version: 1

# ── 대상 지수 ─────────────────────────────────────────────────────────────────────────────────────
# family: msci(컷오프 배수 규칙 — kbj.engines.index_review.msci) · krx(시총 순위·완충 규칙 — .krx).
# enabled: false = 2차(같은 틀 — 규칙 값을 확인한 뒤 켠다). order = 화면 탭 순서.
indexes:
  - id: msci_korea
    title: "MSCI Korea"
    family: msci
    enabled: true
    order: 1
    markets: [KOSPI, KOSDAQ]
  - id: kospi200
    title: "KOSPI200"
    family: krx
    enabled: true
    order: 2
    markets: [KOSPI]
  - id: kosdaq150
    title: "KOSDAQ150"
    family: krx
    enabled: true
    order: 3
    markets: [KOSDAQ]
  - id: ftse_korea
    title: "FTSE Korea(GEIS)"
    family: msci             # 같은 컷오프·배수 틀 — FTSE 규칙 값은 [확인 필요] 이라 꺼 둔다
    enabled: false
    order: 4
    markets: [KOSPI, KOSDAQ]
  - id: krx300
    title: "KRX300"
    family: krx
    enabled: false
    order: 5
    markets: [KOSPI, KOSDAQ]

# ── 유동비율(FIF) 반올림 — 리뷰 날짜로 규칙을 고른다 ─────────────────────────────────────────────
# 리뷰의 announce 날짜 ≥ from 인 규칙 가운데 from 이 가장 늦은 것(from: null = 그 이전 전부).
# band: raw > above(엄격히 큼 — 경계값 자체는 아래 띠 [확인 필요]) 인 첫 띠. mode: nearest(반올림 — 반은 올림)·
# up(올림). buffer: 직전 FIF 가 있고 |raw − 직전| ≤ buffer 면 직전 값을 유지(null = 완충 없음).
fif_rounding:
  - id: msci_2026_05
    from: 2026-05-01
    src: "MSCI 2025-02 확정 발표(유동비율 반올림·완충 변경) — 2026-05 리뷰부터 적용(사용자 요약의 2025-05 와 다르다)"
    checked: 2026-10-13
    verify: true            # 띠 경계(25%·5% 포함 쪽)·완충 비교(≤ 인지 <)를 원문으로 [확인 필요]
    bands:
      - {above: 0.25, step: 0.025, buffer: 0.025, mode: nearest}
      - {above: 0.05, step: 0.005, buffer: 0.005, mode: nearest}
      - {above: 0.0, step: 0.001, buffer: 0.001, mode: nearest}
  - id: msci_legacy
    from: null
    src: "MSCI GIMI 방법론(옛 규칙) — 15% 초과 5% 단위 올림, 이하 1% 단위 반올림"
    checked: 2026-10-13
    verify: true
    bands:
      - {above: 0.15, step: 0.05, buffer: null, mode: up}
      - {above: 0.0, step: 0.01, buffer: null, mode: nearest}

# ── 외국인 지분 한도(FOL) — FIF = min(FIF, 한도) [확인 필요: MSCI §FOL 의 여유분 조정까지는 옮기지 않았다] ──
# 종목별 한도 표는 사용자가 확인해 적는다(통신·항공·방송 등). 비어 있으면 조정하지 않는다.
fol:
  src: "MSCI GIMI 방법론 — Foreign Ownership Limit 조정"
  checked: 2026-10-13
  verify: true
  limits: []                # 예: - {code: "<6자리>", limit: 0.49, why: "전기통신사업법"}

# ── 유동비율 추정(DART 지분 공시 — 구성종목 목록에 FIF 가 없을 때) ─────────────────────────────────
# 비유동 = 자기주식 + 5% 대량보유 보고자(아래 이름 패턴에 맞는 재무적 투자자는 빼고)의 최근 보유 주식.
# quality=estimated. 정부·연기금·임원 보유를 지수마다 어떻게 다루는지는 [확인 필요].
fif_estimate:
  src: "MSCI·KRX 유동주식 정의 요약 — 전략적 보유 제외"
  checked: 2026-10-13
  verify: true
  financial_holder_patterns: ["국민연금", "자산운용", "투자신탁", "증권", "보험", "은행"]
  top_n: 400                # 추정하는 시총 상위 종목 수(+ 구성종목 — 밖은 유동비율 없음 → 컷오프 추정에서 빠진다)

# ── 업종(산업군) — DART 기업개황 업종코드(KSIC) 앞자리 → 산업군 [확인 필요: KRX 산업군 분류와 다르다] ──
sectors:
  src: "KSIC 대분류 앞 2자리 근사 — KRX 산업군 원문 대조 전"
  checked: 2026-10-13
