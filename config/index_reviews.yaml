# 패시브 지수 정기변경(편입·편출) 예측 설정 — 규칙의 모든 숫자·일정은 이 파일 한 곳(P5 2차 묶음 IDX).
# 근거: docs/p5_index_rebalance_prompt.md §1·§3, docs/metrics.md §24. 해석기: kbj/config/index_reviews.py.
#
# 규칙
# - 숫자는 전부 `{v: 값, src: 출처, checked: 확인일, verify: true|false}` 모양이다. verify: true = [확인 필요]
#   (원문과 대조 전 기본값 — 화면·문서가 '추정'으로 보인다). 사용자가 원문으로 확인하면 v 를 고치고
#   verify: false 로 바꾼다(코드는 그대로 — 엔진은 이 값만 읽는다).
# - 날짜는 운용사·거래소가 공표한 일정표를 사람이 적는다(계산으로 추정하지 않는다). 공표 확인 전 날짜는
#   confirmed: false — 일정 표(prv_index.review_calendar)에 quality=estimated 로 들어가고 화면이 '추정'으로 보인다.
# - 현 구성종목 목록은 이 파일에 넣지 않는다(MSCI·KRX 자료 — 로그인 등급, DB prv_index.constituents 에만.
#   `python -m kbj.services.engine.index_review load-constituents` 로 VM 에서 올린다). 레포에는 합성 목록만.
# - 패시브 자금 규모(aum)는 사용자 입력 전 null — null 이면 예상 패시브 매매를 계산하지 않는다(지어내지 않음).
version: 1

# ── 대상 지수 ─────────────────────────────────────────────────────────────────────────────────────
# family: msci(컷오프 배수 규칙 — kbj.engines.index_review.msci) · krx(시총 순위·완충 규칙 — .krx).
# enabled: false = 2차(같은 틀 — 규칙 값을 확인한 뒤 켠다). order = 화면 탭 순서.
indexes:
  - id: msci_korea
    title: "MSCI Korea"
    family: msci
    enabled: true
    order: 1
    markets: [KOSPI, KOSDAQ]
  - id: kospi200
    title: "KOSPI200"
    family: krx
    enabled: true
    order: 2
    markets: [KOSPI]
  - id: kosdaq150
    title: "KOSDAQ150"
    family: krx
    enabled: true
    order: 3
    markets: [KOSDAQ]
  - id: ftse_korea
    title: "FTSE Korea(GEIS)"
    family: msci             # 같은 컷오프·배수 틀 — FTSE 규칙 값은 [확인 필요] 이라 꺼 둔다
    enabled: false
    order: 4
    markets: [KOSPI, KOSDAQ]
  - id: krx300
    title: "KRX300"
    family: krx
    enabled: false
    order: 5
    markets: [KOSPI, KOSDAQ]

# ── 유동비율(FIF) 반올림 — 리뷰 날짜로 규칙을 고른다 ─────────────────────────────────────────────
# 리뷰의 announce 날짜 ≥ from 인 규칙 가운데 from 이 가장 늦은 것(from: null = 그 이전 전부).
# band: raw > above(엄격히 큼 — 정확히 25% 는 0.5% 띠: 원문 "greater than 25%") 인 첫 띠. mode: nearest(반올림 —
# 반은 올림: 동률 처리는 원문에 없다 [확인 필요])·up(올림). buffer: 기존 구성종목이고 직전 FIF 가 있으며
# |raw − 직전| < buffer 면 직전 값을 유지(변화가 단위 이상이면 반영 — GIMI §3.1.7). null = 완충 없음.
# 완충 예외(완충 없이 반영): 신규 편입·세그먼트 이동(비구성종목), FOL 변경으로 생긴 FIF 변경.
fif_rounding:
  - id: msci_2026_05
    from: 2026-05-01
    src: "GIMI 2026-08판 App.VI·§3.1.7 + MSCI 2026-01-27 공지(2026-05 리뷰부터 전면 적용)"
    checked: 2026-10-14
    verify: false           # 띠·단위·완충(<)·from 원문 확인. 정확히 5%·동률(반 단위) 처리만 원문에 없다
    bands:
      - {above: 0.25, step: 0.025, buffer: 0.025, mode: nearest}
      - {above: 0.05, step: 0.005, buffer: 0.005, mode: nearest}
      - {above: 0.0, step: 0.001, buffer: 0.001, mode: nearest}
  - id: msci_legacy
    from: null
    src: "MSCI GIMI 방법론(옛 규칙) — 15% 초과 5% 단위 올림, 이하 1% 단위 반올림"
    checked: 2026-10-13
    verify: true
    bands:
      - {above: 0.15, step: 0.05, buffer: null, mode: up}
      - {above: 0.0, step: 0.01, buffer: null, mode: nearest}

# ── 외국인 지분 한도(FOL) — GIMI 2026-08판 §2.3.6.2·§3.1.2.6·§3.1.6.3·App.VI ─────────────────────
# FIF = min(외국인 가용 유동비율(위 반올림), FOL(limit_step 단위 반올림)) × foreign room 계수.
# room = (FOL − 외국인 보유) ÷ FOL. 신규: room ≥ 25% → 1, 15~25% → 0.5, < 15% → 편입 불가.
# 기존: room < 3.75% → 0.25. 그 사이(3.75~25%)는 원문 표가 직전 계수별 단계라 옮기지 못했다 [확인 필요 —
# null = 조정하지 않음]. 기존 종목의 유동시총 요건은 계수를 곱하기 전 값으로 본다.
# 외국인 보유 비율 자료가 없으면 room 계수는 적용하지 않는다(사유 — 추정).
# 종목별 한도 표는 사용자가 확인해 적는다(통신·항공·방송 등). 비어 있으면 조정하지 않는다.
fol:
  src: "GIMI 2026-08판 §2.3.6.2·§3.1.2.6·§3.1.6.3·App.VI — Foreign Ownership Limit·foreign room"
  checked: 2026-10-14
  verify: false
  limit_step: {v: 0.001, src: "GIMI 2026-08판 App.VI — FOL 은 0.1% 단위 반올림", checked: 2026-10-14, verify: false}
  room_full: {v: 0.25, src: "GIMI 2026-08판 §3.1.2.6 — foreign room ≥ 25% 면 조정 없음", checked: 2026-10-14, verify: false}
  room_min_add: {v: 0.15, src: "GIMI 2026-08판 §3.1.2.6 — 신규 종목 room < 15% 편입 불가", checked: 2026-10-14, verify: false}
  room_add_factor: {v: 0.5, src: "GIMI 2026-08판 §3.1.2.6 — 신규 종목 room 15~25% 조정계수 0.5", checked: 2026-10-14, verify: false}
  room_keep_floor: {v: 0.0375, src: "GIMI 2026-08판 §3.1.6.3 — 기존 종목 room < 3.75%", checked: 2026-10-14, verify: false}
  room_keep_floor_factor: {v: 0.25, src: "GIMI 2026-08판 §3.1.6.3 — 기존 종목 room < 3.75% 조정계수 0.25", checked: 2026-10-14, verify: false}
  room_keep_mid_factor: {v: null, src: "GIMI 2026-08판 §3.1.6.3 표(직전 계수별 단계 — 원문 이미지라 옮기지 못함). null = 조정 안 함", checked: 2026-10-14, verify: true}
  limits: []                # 예: - {code: "<6자리>", limit: 0.49, why: "전기통신사업법"} — 채우지 않음(사용자 확인)

# ── 유동비율 추정(DART 지분 공시 — 구성종목 목록에 FIF 가 없을 때) ─────────────────────────────────
# 비유동 = 자기주식 + 5% 대량보유 보고자(아래 이름 패턴에 맞는 재무적 투자자는 빼고)의 최근 보유 주식.
