# 규칙 알림·백테스트 설정 — 비밀 아님(P8 묶음 FND). 해석기 kbj/config/rules_cfg.py(모르는 키는 오류).
# 정의는 docs/metrics.md §30, 설계 docs/p8_design.md §3.5. 숫자는 여기 한 곳 — 엔진·작업·API 는 이 값을
# 인자로 받는다. 사용자 결정(2026-10-13): 마감 알림 16:00 한 통·장중 상한 60·쿨다운 24시간·
# 성과 1/3/5/10/20일·수수료 0.015%·매도세 0.20%(2026-01-01 양도분부터 — 증권거래세법 시행령 §5) — §10 기본값 그대로.
version: 1

# EMA 계열 시작점 고정(D-P8-7) — 지표는 max(anchor_date, 종목 첫 봉)부터 한 번에 계산 [확인 필요]
anchor_date: 2020-01-02

# 알림 후 성과 기간(거래일, D-P8-12 — Q4)
horizons: [1, 3, 5, 10, 20]

# 규칙 쿨다운(분) — 기본 24시간, 하한 60(D-P8-10 — Q3)
cooldown_min: {default: 1440, floor: 60}

# 장중 평가 대상 상한(관심종목 main ∪ 보유 ∪ 규칙 코드 — D-P8-20, Q2). KIS 호출 = 상한 × 40 슬롯/일
intraday_max_codes: 60

# DSL 상한(D-P8-5)
dsl: {max_depth: 3, max_conditions: 12}

# 성과 비교 지수(시장 → 원장 지수 코드) [확인 필요 — 원장 지수 코드]
index: {KOSPI: "1001", KOSDAQ: "2001"}

# 백테스트 비용(Q5) — 수수료 양쪽(bp), 매도 거래세(%), 슬리피지(bp).
# 매도 거래세: 2026-01-01 양도분부터 KOSPI 0.05%+농특세 0.15%(=0.20%), KOSDAQ 0.20%, KONEX 0.10%
# (증권거래세법 시행령 §5 — 2025 세제개편, 확인 2026-10-14). 유니버스가 KOSPI·KOSDAQ 뿐이라 단일값 0.20.
# KONEX 를 넣으면 시장별 값이 필요하다. 2025년 이전 구간(2025년 0.15% 등)은 연도별 세율이 다르다.
costs: {fee_bps: 1.5, sell_tax_pct: 0.20, slippage_bps: 0}

# 즉석 백테스트 상한(D-P8-17) [제안]
adhoc: {max_codes: 100, max_years: 5, timeout_s: 20, cache_ttl_s: 3600}

# 일치 감시 창(거래일, D-P8-14)
match: {window_days: 20}

# 야간 백테스트 기간(년 — Q10 '3년 백필')
nightly: {years: 3}

# 보존(일) — watch_quote_slot 2년 [제안]
retention: {watch_quote_slot_days: 730}

# 성과 통계 '표본 적음' 문턱(§4.5)
stats: {min_samples: 20}
