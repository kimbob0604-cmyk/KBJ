name: CI

# KBJ CI (PLAN §8 P1). kbj/ 의 린트·타입·시험·시뮬레이션·통합·프런트·공개 산출물·데모를 돌린다.
# - 트리거는 push(main)·pull_request·workflow_dispatch 만 — 예약(schedule) 실행은 두지 않는다
# - 비밀(secrets)을 쓰지 않는다. 시험은 전부 네트워크 없이 도는 합성 fixture 로 돈다
# - 해석기는 루트 uv.lock 하나(Python 3.12)
# - P2 묶음 I: canonical(직접 호출 금지 검사 — scripts/check_canonical.py)·sim(하루 운영 시뮬레이션 —
#   tests/sim, 가짜 시계·가짜 서버라 네트워크·비밀 없음) 잡. test-kbj 는 sim 을 빼고 돈다(두 번 돌지 않게)
# - P3 묶음 S(docs/p3_design.md §8.6): web 잡(프런트 eslint·tsc·vitest·두 빌드·번들 검사·타입 신선도·공개
#   데이터 합치기 dry-run) 신설. test-kbj 에 openapi 신선도·공개 빌드 스크립트 dry-run, sim 에 장중 1시간
#   무결측(느린 하루 판은 -m slow — CI 에서 빼고 수동). lint 의 import-linter 는 계약 ①~⑩.
#   Pages 배포(pages.yml)는 CI 가 아니라 수동(workflow_dispatch) — Pages 활성·배포 키·토큰은 사용자 승인 사항
# - P4 묶음 S(docs/p4_design.md §8.7): 잡 정의는 그대로 — 새 시험(골든 tests/golden/dart_report·수용
#   tests/acceptance·sim test_one_day_p4·web test/pages·test/acceptance)은 기존 잡이 자동으로 모은다.
#   lint 의 import-linter 는 계약 ①~⑬, canonical 목표 0 그룹에 fnguide(FnGuide·WiseReport 스크랩 금지)
# - P5 WRAP(docs/p5_design.md §8.7): test(kbj)·sim 에 한글 폰트(flows.report 차트 — matplotlib), legacy
#   매트릭스의 etf-rest 에서 monitor/flow 를 뺐다(kbj/reports/flows 로 승격·삭제). import-linter 는 계약
#   ①~⑭·⑯(⑮ 분류 사전은 테마 사전 작업 몫 — 사용자 별도 진행). 새 시험(sim test_one_day_p5·test_brief_once·
#   test_intraday_minute, web test/acceptance/p5_pages)은 기존 잡이 모은다
# - P8 WRAP(docs/p8_design.md §1.6-4): import-linter 계약 ⑳(개인 기록 쓰기 모듈), 직접 호출 검사 새 그룹
#   ta_indicators. 새 시험(tests/acceptance/test_rules_parity·tests/unit/test_no_orders·sim test_rules_days —
#   sim 잡이 `-m "sim and not slow"` 로 모은다, web test/acceptance/p11_p12_pages·test/api_write)은 기존 잡이 모은다.
#   rules_days 만 다시 돌릴 때: `uv run pytest tests/sim -m sim -k rules_days`
# - P9 LEGACY(docs/p9_design.md §7.6): legacy/etf_traker·stock_dashboard 를 지워 legacy 매트릭스는 gexlab 하나,
#   `pytest -m legacy` 단계 삭제(그 시험 2 파일도 지웠다)
# - P9 WRAP(§7.2 WRAP-3, ADR 0035·0038): legacy/ 를 비워 legacy·gexlab-integration 잡과 scripts/test_legacy.sh 를
#   지웠다(GX 수집 통합 시험 일부는 kbj tests/integration/test_gex_ingest_pg.py 로 — kbj-integration 이 모은다).
#   test (kbj) 의 `and not legacy` 삭제, canonical 은 모든 그룹이 목표 0 이라 한 단계, public-safety 잡을
#   public-outputs(scripts/check_public_outputs.py — 레포·공개 사이트·데모 미디어·데모 이미지 입력)로 바꿨다.
#   새 잡 demo (compose): docker-compose.demo.yml 을 띄워 데모 계정으로 대표 API(scripts/demo_smoke.py)

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: lint (kbj — ruff·pyright·import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format github
      - name: ruff format
        run: uv run ruff format --check
      - name: pyright
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports

  test-kbj:
    name: test (kbj)
    runs-on: ubuntu-latest
    # P8 까지 시험이 늘어 15분(P7 13분 42초)을 넘겼다 — 다른 무거운 잡과 같은 30분
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 한글 폰트 (P5 flows.report 차트 — kbj/reports/flows, 원본 ETF-Traker flow.yml 과 같음)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f
      - name: pytest (sim·통합 제외 — 아래 sim·kbj-integration 잡)
        run: uv run pytest -m "not sim and not integration"
      - name: openapi 신선도(web/src/api/openapi.json — 묶음 A)
        run: uv run python -m kbj.services.api openapi --check
      - name: 등록부 정적 검증(config/jobs.yaml — 켜진 작업의 처리기 import 포함)
        run: uv run python -m kbj.services.scheduler validate config/jobs.yaml

  kbj-integration:
    # kbj 통합 시험(TimescaleDB pg16 — 마이그레이션 0001~0006·이관·저장소 SQL). 시험이 docker CLI 로
    # 컨테이너를 직접 띄우고 지운다(tests/integration/conftest.py). Docker 를 못 써서 하나라도
    # 건너뛰면 녹색이 아니라 실패로 본다(이 환경에서 못 돌린 21개를 여기서 확인한다).
    name: kbj-integration (TimescaleDB pg16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 이미지 받기
        run: docker pull timescale/timescaledb:latest-pg16
      - name: pytest -m integration (건너뜀 0 이어야 통과)
        run: |
          set -o pipefail
          uv run pytest -m integration -rs --junitxml="${{ runner.temp }}/kbj-it.xml" 2>&1 | tee integration.log
          if grep -qE '^SKIPPED|[0-9]+ skipped' integration.log; then
            echo "::error::통합 시험이 건너뛰어졌다 — Docker 를 쓸 수 있어야 한다"; exit 1
          fi
      # P9 WRAP: gexlab-integration 잡에서 쓰던 주석 도구를 이 잡으로 옮겼다(그 잡은 legacy/ 와 함께 지움)
      - name: 실패한 시험을 주석으로(로그 본문을 못 받는 곳에서도 원인이 보이게)
        if: failure()
        run: uv run python scripts/ci_junit_annotations.py "${{ runner.temp }}/kbj-it.xml"

  canonical:
    # 정본 경계(docs/p2_design.md §9): 직접 호출 — P9 WRAP 뒤 모든 그룹이 목표 0(기준선 파일은 머리말만 —
    # scripts/canonical_baseline.txt). 실패하면 경로:줄·그룹만 찍는다(찾은 문자열은 찍지 않는다)
    name: canonical (직접 호출 금지 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 전체(모든 그룹 목표 0 — PLAN §8 P2 완료 기준 + P9)
        run: uv run python scripts/check_canonical.py

  sim:
    # 하루 운영 시뮬레이션(PLAN §8 P2 완료 기준 — 토큰 발급은 auth 한 곳, 중복 수집 0). 24시간 창과
    # 변형 6개. 가짜 웹소켓 서버만 127.0.0.1 임의 포트에 뜬다. P3: 장중 1시간 무결측(실제 처리기 + 변형 4)·
    # 하루 운영 확장(test_one_day_p3 — KRX 확정·보드 확정까지 28.5시간). P4: test_one_day_p4(분기 마감 직후
    # 2026-11-16 05:00 ~ 11-17 05:00 — DART 피드 780회·재무·밸류·리포트·알림)
    name: sim (하루 운영 시뮬레이션)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 한글 폰트 (P5 하루 운영의 flows.report 차트)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f
      - name: pytest tests/sim (장중 하루 판 slow 는 제외 — 수동 `-m slow`)
        run: uv run pytest tests/sim -m "sim and not slow" -rx

  web:
    # 프런트(web/ — 묶음 W·W2). node 22.13 이상(eslint 10). 설치 스크립트를 돌리지 않는다(npm ci
    # --ignore-scripts — R12 공급망). 두 빌드를 만든 뒤 번들 검사(공개 번들에 /api·CSRF·KBJ_ 0, gzip 예산),
    # openapi → TS 타입 신선도, 공개 데이터 합치기(build_public_site.sh — X)를 합성 견본으로 돌린다.
    # 비밀·네트워크 데이터 없음
    name: web (eslint·tsc·vitest·빌드·번들 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci (lock 그대로·설치 스크립트 안 돌림)
        run: npm ci --ignore-scripts
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: 공개 빌드·로그인 빌드
        run: npm run build:public && npm run build:login
      - name: 번들 검사
        run: node scripts/check-bundle.mjs
      - name: openapi → TS 타입 신선도
        run: npm run gen:types -- --check
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(python — 공개 데이터 만들기)
        working-directory: .
        run: uv sync --frozen
      - name: 공개 사이트 조립 dry-run(내보내기 → python 검사 → 합치기 → 번들 검사, 푸시 없음)
        working-directory: .
        run: bash scripts/build_public_site.sh --dry-run
      - name: 공개 사이트 실제 조립(공개 빌드에 데이터 합치기 — 배포는 pages.yml 수동)
        working-directory: .
        run: bash scripts/build_public_site.sh --skip-install

  public-outputs:
    # P9 DEMO·WRAP(docs/p9_design.md §3, ADR 0035): 공개 산출물 검사 — ① 레포 파일(기존 공개 안전 검사 +
    # 출처 표식 없는 fixture) ② 공개 사이트 산출(공개 데이터·번들의 비밀 형태·로그인 출처 이름·시세 칸)
    # ③ 데모 미디어(docs/media) ④ 데모 이미지 입력(Dockerfile.demo.dockerignore). python 만(node 불필요)
    name: public-outputs (원시세·키 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 공개 산출물 검사
        run: uv run python scripts/check_public_outputs.py

  demo:
    # P9 WRAP(§0.3 첫 줄, ADR 0034): `docker compose -f docker-compose.demo.yml up` 한 줄 데모가 뜨고 데모
    # 계정(README 의 고정 데모값 — 합성 데이터 전용)으로 대표 API 가 200 인지 본다. 키·DB·외부 호출 없음.
    # 합성 세계 적재가 약 2분 — healthcheck start_period 120s
    name: demo (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev — 연기 시험 도구)
        run: uv sync --frozen
      - name: compose 설정 검사
        run: docker compose -f docker-compose.demo.yml config -q
      - name: 데모 띄우기
        run: docker compose -f docker-compose.demo.yml up -d --build
      - name: 연기 시험(health → 로그인 → 페이지 대표 API)
        run: uv run python scripts/demo_smoke.py --wait 300
      - name: 실패하면 데모 로그 끝
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail 80 demo
      - name: 내리기
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
