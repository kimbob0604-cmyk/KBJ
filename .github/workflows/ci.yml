name: CI

# KBJ CI (PLAN §8 P1). 신규 kbj/ 의 린트·타입·시험과 legacy 세 프로젝트의 기존 시험을 돌린다.
# - 트리거는 push(main)·pull_request·workflow_dispatch 만 — 예약(schedule) 실행은 두지 않는다
# - 비밀(secrets)을 쓰지 않는다. 시험은 전부 네트워크 없이 도는 합성 fixture 로 돈다
# - 해석기는 루트 uv.lock 하나(Python 3.12). legacy 잡은 legacy 의존성 그룹까지 설치한다
# - legacy 시험은 scripts/test_legacy.sh 의 부분 이름으로 돌린다(프로젝트마다 import 루트 분리 —
#   docs/conflict_map.md §3.4)
# - P2 묶음 I: canonical(직접 호출 금지 검사 — scripts/check_canonical.py)·sim(하루 운영 시뮬레이션 —
#   tests/sim, 가짜 시계·가짜 서버라 네트워크·비밀 없음) 잡. test-kbj 는 sim 을 빼고 돈다(두 번 돌지 않게)

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: lint (kbj — ruff·pyright·import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format github
      - name: ruff format
        run: uv run ruff format --check
      - name: pyright
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports

  test-kbj:
    name: test (kbj)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: pytest (sim·통합 제외 — 아래 sim·kbj-integration 잡)
        run: uv run pytest -m "not sim and not integration"

  kbj-integration:
    # kbj 통합 시험(TimescaleDB pg16 — 마이그레이션 0001~0006·이관·저장소 SQL). 시험이 docker CLI 로
    # 컨테이너를 직접 띄우고 지운다(tests/integration/conftest.py). Docker 를 못 써서 하나라도
    # 건너뛰면 녹색이 아니라 실패로 본다(이 환경에서 못 돌린 21개를 여기서 확인한다).
    name: kbj-integration (TimescaleDB pg16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 이미지 받기
        run: docker pull timescale/timescaledb:latest-pg16
      - name: pytest -m integration (건너뜀 0 이어야 통과)
        run: |
          set -o pipefail
          uv run pytest -m integration -rs 2>&1 | tee integration.log
          if grep -qE '^SKIPPED|[0-9]+ skipped' integration.log; then
            echo "::error::통합 시험이 건너뛰어졌다 — Docker 를 쓸 수 있어야 한다"; exit 1
          fi

  canonical:
    # 정본 경계(docs/p2_design.md §9): legacy·kbj 의 KIS 토큰·REST·마스터·KRX·DART 직접 호출 0(기준선
    # 없음), 웹소켓·공공데이터포털·네이버·KRX 스크랩은 줄어들기만 하는 기준선(scripts/canonical_baseline.txt),
    # legacy 의 kbj import 규칙(AST). 실패하면 경로:줄·그룹만 찍는다(찾은 문자열은 찍지 않는다)
    name: canonical (직접 호출 금지 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 목표 0 그룹(PLAN §8 P2 완료 기준)
        run: uv run python scripts/check_canonical.py --groups kis_oauth,kis_rest,kis_master,krx_api,dart
      - name: 전체(기준선 포함)
        run: uv run python scripts/check_canonical.py

  sim:
    # 하루 운영 시뮬레이션(PLAN §8 P2 완료 기준 — 토큰 발급은 auth 한 곳, 중복 수집 0). 24시간 창과
    # 변형 6개. 가짜 웹소켓 서버만 127.0.0.1 임의 포트에 뜬다
    name: sim (하루 운영 시뮬레이션)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: pytest tests/sim
        run: uv run pytest tests/sim -m sim -rx

  legacy:
    name: legacy (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # gexlab: 단위·속성·골든(통합 49개는 아래 gexlab-integration 잡)
        # board: unittest 1,319 / etf-rest: monitor/kr 94·monitor/flow 129·flowlab 44·dart-report·etf_tracker_v9
        # stock_dashboard: 검사 스크립트 10개 pytest 래퍼
        part: [gexlab, board, etf-rest, stock_dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev + legacy)
        run: uv sync --frozen --all-groups
      - name: 한글 폰트 (monitor/flow 차트 시험 — 원본 ETF-Traker flow.yml 과 같음)
        if: matrix.part == 'etf-rest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f
      - name: scripts/test_legacy.sh ${{ matrix.part }}
        run: uv run bash scripts/test_legacy.sh ${{ matrix.part }}

  gexlab-integration:
    # GEXLAB 통합 시험 49개. 원본 GEXLAB CI 처럼 러너의 Docker 를 그대로 쓴다 — 시험이 docker CLI 로
    # TimescaleDB(pg16)·Redis 컨테이너를 직접 띄우고 지운다(legacy/gexlab/tests/integration/conftest.py,
    # docker-compose.test.yml). 그래서 job services 는 두지 않고 이미지만 미리 받는다.
    # KBJ_REQUIRE_DOCKER=1 — Docker 를 못 써서 건너뛰면 녹색이 아니라 실패로 본다.
    name: gexlab-integration (TimescaleDB pg16·Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev + legacy)
        run: uv sync --frozen --all-groups
      - name: 이미지 받기
        run: |
          docker pull timescale/timescaledb:latest-pg16
          docker pull redis:7-alpine
      - name: scripts/test_legacy.sh gexlab-integration
        env:
          KBJ_REQUIRE_DOCKER: "1"
        run: uv run bash scripts/test_legacy.sh gexlab-integration

  public-safety:
    name: public-safety (레포 전체, legacy 포함)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성(dev)
        run: uv sync --frozen
      - name: 공개 안전 검사
        run: uv run python scripts/check_public_safety.py
