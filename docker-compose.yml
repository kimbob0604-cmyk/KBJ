# KBJ 로컬 스택 — PostgreSQL 16 + TimescaleDB, Redis 7 (PLAN §2·D2, docs/adr/0002-tier-schemas.md)
#
# - 비밀은 .env(로컬, git 제외)에만. 이 파일에 값·기본값이 없다 — KBJ_POSTGRES_PASSWORD·KBJ_REDIS_PASSWORD 가
#   없으면 compose 가 시작하지 않는다(.env.example 을 복사해 채운다, 이름표는 docs/secrets.md).
# - 포트는 127.0.0.1 에만 연다(같은 기계에서만 접속). 시각은 UTC, 표시는 앱이 KST 로.
# - 첫 기동 때 kbj/store/migrations/0001_schemas.sql 을 initdb 로 적용한다(pub_*·prv_*·ops 스키마,
#   kbj_public_export 역할). 이미지 자체의 timescaledb 설치 스크립트(000_*·001_*) 뒤에 돌도록 100_ 이름으로
#   넣는다. initdb 는 빈 볼륨에서만 돈다 — 0002 부터는 P2 적용기(ops.schema_migrations)로.
# - 앱 서비스(P2 — 묶음 I)는 profile `app` 이다: `docker compose up -d` 는 지금처럼 db·redis 만,
#   `docker compose --profile app up -d --build` 는 migrate → auth·scheduler·notifier 까지 띄운다.
#   이미지는 레포 루트 Dockerfile 하나(런타임 의존성만, 비밀 없음). collectors·ws-gateway·engine·
#   api 는 그 단계(P3~P7)에서 더한다. 로그인 API·웹훅 HTTP 서버는 P3(메인 결정 D4) — 지금은 포트 없음.
# - 비밀은 서비스마다 필요한 것만 넣는다(.env 를 env_file 로 통째로 넣지 않는다 — docs/secrets.md,
#   ADR 0004). KIS 앱키·시크릿은 KIS 를 부르는 프로세스에만: P2 는 auth(유일한 발급자 —
#   KBJ_SERVICE=auth). KIS REST 를 부르는 수집 작업이 켜지는 P3 에 scheduler 에도 더한다(메인 결정 D1
#   안 A — 요청 헤더에 앱키가 필요하다. 발급은 그래도 auth 만: 발급자 런타임 가드·계약 ④·검사).
#   텔레그램 값은 notifier 에만, DART 키는 scheduler(filings.corp_code)에만.
# - 접속 문자열은 이 파일이 비밀번호로 만든다(컨테이너 안 호스트 이름 db·redis). 비밀번호는 URL 에
#   그대로 넣을 수 있는 영숫자로(.env.example). 기본값은 없다.
#
# 문법 검사(데몬 없어도 됨): docker compose --env-file <값이 든 임시 파일> --profile app config -q

name: kbj

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# 앱 서비스가 같이 쓰는 접속 문자열(컨테이너 안). 비밀번호는 .env 에서 — 없으면 compose 가 멈춘다
x-urls:
  database: &database_url "postgresql://kbj:${KBJ_POSTGRES_PASSWORD:?KBJ_POSTGRES_PASSWORD 를 .env 에 넣는다}@db:5432/kbj"
  redis: &redis_url "redis://:${KBJ_REDIS_PASSWORD:?KBJ_REDIS_PASSWORD 를 .env 에 넣는다}@redis:6379/0"

x-app: &app
  image: kbj-app:local
  build:
    context: .
    dockerfile: Dockerfile
  profiles: [app]
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      TZ: UTC
      POSTGRES_USER: kbj
      POSTGRES_DB: kbj
      POSTGRES_PASSWORD: ${KBJ_POSTGRES_PASSWORD:?KBJ_POSTGRES_PASSWORD 를 .env 에 넣는다}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./kbj/store/migrations/0001_schemas.sql:/docker-entrypoint-initdb.d/100_kbj_0001_schemas.sql:ro
    shm_size: 256mb
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kbj -d kbj"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    environment:
      TZ: UTC
      KBJ_REDIS_PASSWORD: ${KBJ_REDIS_PASSWORD:?KBJ_REDIS_PASSWORD 를 .env 에 넣는다}
    # 비밀번호는 컨테이너 환경에서 읽어 컨테이너 안 설정 파일로 넘긴다 — 이 파일에도, redis-server 명령줄
    # 인자(ps 로 보인다)에도 값이 없다. 이미지 진입점을 거쳐 redis 사용자로 돈다. AOF 로 토큰·상태가 재기동을 넘긴다
    command:
      - sh
      - -c
      - >-
        printf 'requirepass %s\n' "$$KBJ_REDIS_PASSWORD" > /tmp/redis.conf
        && exec docker-entrypoint.sh redis-server /tmp/redis.conf --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis:/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$KBJ_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── 앱(P2 — profile app) ─────────────────────────────────────────────────────────────
  # 0002~0006 적용(ops.schema_migrations). 한 번 돌고 끝난다 — 나머지 앱은 이것이 성공한 뒤 뜬다
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "kbj.store.migrate"]
    environment:
      TZ: UTC
      KBJ_SERVICE: migrate
      KBJ_DATABASE_URL: *database_url
    depends_on:
      db:
        condition: service_healthy

  # KIS 접근토큰·웹소켓 접속키의 유일한 발급자(ADR 0001 U1·0004). 한 컨테이너(복제 1)
  auth:
    <<: *app
    command: ["python", "-m", "kbj.services.auth"]
    environment:
      TZ: UTC
      KBJ_SERVICE: auth
      KBJ_REDIS_URL: *redis_url
      KBJ_KIS_APP_KEY: ${KBJ_KIS_APP_KEY:-}
      KBJ_KIS_APP_SECRET: ${KBJ_KIS_APP_SECRET:-}
      KBJ_KIS_ENV: ${KBJ_KIS_ENV:-real}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "kbj.services.runtime.healthcheck", "auth", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 세션 상태 발행 + 작업 등록부 실행기(config/jobs.yaml). P2 에 켜진 작업은 ops.nightly(pg_dump 백업 —
  # /data/backup, 보존 [확인 필요 R23])·filings.corp_code(DART)·ops.watchdog 셋뿐(설계 §6.9)
  scheduler:
    <<: *app
    command: ["python", "-m", "kbj.services.scheduler", "run"]
    environment:
      TZ: UTC
      KBJ_SERVICE: scheduler
      KBJ_REDIS_URL: *redis_url
      KBJ_DATABASE_URL: *database_url
      KBJ_DART_API_KEY: ${KBJ_DART_API_KEY:-}
      KBJ_NOTIFY_ENABLED: ${KBJ_NOTIFY_ENABLED:-false}
      KBJ_DATA_DIR: /data
    volumes:
      - state:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "kbj.services.runtime.healthcheck", "scheduler", "60"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 발송 outbox 소비(꺼짐 기본 — KBJ_NOTIFY_ENABLED=false 면 기록만)·받은 업데이트 처리·웹훅 점검
  notifier:
    <<: *app
    command: ["python", "-m", "kbj.services.notifier", "run"]
    environment:
      TZ: UTC
      KBJ_SERVICE: notifier
      KBJ_REDIS_URL: *redis_url
      KBJ_DATABASE_URL: *database_url
      KBJ_TELEGRAM_BOT_TOKEN: ${KBJ_TELEGRAM_BOT_TOKEN:-}
      KBJ_TELEGRAM_CHAT_ID: ${KBJ_TELEGRAM_CHAT_ID:-}
      KBJ_TELEGRAM_INBOX_CHAT_IDS: ${KBJ_TELEGRAM_INBOX_CHAT_IDS:-}
      KBJ_TELEGRAM_WEBHOOK_SECRET: ${KBJ_TELEGRAM_WEBHOOK_SECRET:-}
      KBJ_PUBLIC_BASE_URL: ${KBJ_PUBLIC_BASE_URL:-}
      KBJ_NOTIFY_ENABLED: ${KBJ_NOTIFY_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "kbj.services.runtime.healthcheck", "notifier", "60"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  redis:
  state:
